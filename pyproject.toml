[build-system]
requires = [
    "setuptools>=61.0.0",

    # version compatibility
    "bpc-f2format; python_version < '3.6'",
    "bpc-poseur; python_version < '3.8'",
    "bpc-walrus; python_version < '3.8'",
]
build-backend = "setuptools.build_meta"

[project]
name = "pypcapkit"
dynamic = [ "version", "readme" ]
authors = [
    { name="Jarry Shaw", email="jarryshaw@icloud.com" },
]
maintainers = [
    { name="Jarry Shaw" },
]
license = { text="BSD 3-Clause License" }
# Kept at 3.6, which the ``bpc-*`` requirements above are what make possible: the
# sources use 3.8 syntax (walrus, positional-only parameters) and ``refactor()`` in
# setup.py converts it at install time. Measured, so that the state of that is on
# the record rather than assumed:
#
#   3.9.25, 3.8.20   import and extract straight from source, no conversion needed
#   3.7.16           SyntaxError from source, as expected -- this is what the
#                    ``bpc-*`` conversion exists for
#
# **The conversion path has an upstream bug today.** ``bpc-poseur`` 0.4.3.post1
# crashes on any positional-only parameter that is on a *method* rather than a
# plain function -- ``AttributeError: 'Name' object has no attribute 'name'`` at
# ``poseur.py:744`` in ``_process_classdef``, which does ``cls_ctx=name.name``
# where ``name`` is already a parso ``Name`` leaf and wants ``.value``. It then
# **exits 0**, so ``refactor()``'s ``check_call`` cannot see the failure, and the
# 12 positional-only parameters in ``pcapkit/corekit/io.py`` survive into the
# installed package -- making ``import pcapkit`` fail with ``SyntaxError`` on an
# interpreter below 3.8.
#
# Verified that this is the *only* blocker: with that one line changed to
# ``name.value``, ``walrus`` followed by ``poseur`` converts ``io.py`` into
# something Python 3.7 parses cleanly. So this is an upstream fix to follow, not a
# reason to withdraw the declaration. Until it lands, sub-3.8 support is intent
# rather than something that works.
#
# Independently: CI covers **3.10 through 3.14** (3.15 runs allowed-to-fail), so 3.8 and 3.9 are best-effort
# (both are end-of-life), and the ``PCAP_CT`` extra needs 3.10 regardless.
requires-python = ">=3.6, <4"
description = "PyPCAPKit: comprehensive network packet analysis library"
keywords = [ "network", "pcap", "packet" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "dictdumper~=0.8.0",  # for formatted output
    "chardet",            # for bytes decode
    "aenum",              # for const types
    "tbtrim>=0.2.1",      # for refined exceptions

    # PyBPC
    "bpc-f2format; python_version < '3.6'",
    "bpc-poseur; python_version < '3.8'",
    "bpc-walrus; python_version < '3.8'",

    # version compatibility
    "pathlib2>=2.3.2; python_version == '3.4'",
    "typing-extensions; python_version < '3.11'",
]

[project.urls]
homepage = "https://jarryshaw.github.io/PyPCAPKit/"
documentation = "https://jarryshaw.github.io/PyPCAPKit/"
repository = "https://github.com/JarryShaw/PyPCAPKit"
changelog = "https://jarryshaw.github.io/PyPCAPKit/changelog.html"

[project.scripts]
pcapkit-cli = "pcapkit.__main__:main"
pcapkit-vendor = "pcapkit.vendor.__main__:main"

[project.optional-dependencies]
# for CLI display
cli = [ "emoji" ]
# for ESP payload decryption, c.f. pcapkit.protocols.internet.esp
crypto = [ "cryptography>=3.4" ]
# for NGAP decoding, c.f. pcapkit.protocols.application.ngap. Counted among
# ``all``'s *core addons* by the owner's ruling on #910 -- everything needed for
# the library itself to work at full functionality -- even though the
# ``pycrate`` this needs is not a free addition:
#
#   * Size. ``pycrate`` ships every specification it has ever compiled in one
#     distribution: installing it lands ~238 MB of ``pycrate_asn1dir`` (87 spec
#     modules) to obtain the one 4.9 MB ``NGAP.py`` this needs. That is a 50x
#     multiplier over the useful part, to support one application protocol.
#   * Licence. ``pycrate`` is LGPL-2.1+ where this package is BSD-3-Clause. That
#     is fine as an optional import a user chooses, and it is a real thing for
#     ``pip install pypcapkit[all]`` to pull in without being asked: LGPL
#     carries obligations on redistribution that a BSD-licensed dependent may
#     not want.
#
# #910's owner accepted that trade deliberately rather than leaving ``all``
# contradict the reasoning that used to keep ``pycrate`` out of it -- see the
# ``all`` extra's own comment below for the rest of that ruling. This extra
# still exists on its own, for installing NGAP support without the ``cli`` and
# ``crypto`` core addons ``all`` bundles it with.
#
# No version floor: NGAP has shipped precompiled in ``pycrate_asn1dir`` for many
# releases and the two entry points used here (``NGAP_PDU.from_aper`` and
# ``to_aper``) are long-standing. Verified against 0.8.1, which is pure Python
# with no compiled extension, so there is no toolchain prerequisite either.
NGAP = [ "pycrate" ]
# for normal users
DPKT = [ "dpkt" ]
Scapy = [ "scapy" ]
PyShark = [ "pyshark" ]
# pypcap ships no wheels, so this compiles a C extension against libpcap and
# needs both its headers and its shared library present; deliberately kept out
# of ``all`` for that reason, c.f. the note below.
#
# The version bound is not caution, it is measured. pypcap 1.3.0 compiles a
# ``pcap.c`` that was pre-generated by Cython 0.29.32 and does not run Cython at
# build time, and that generated file does not compile against the Python 3.12+ C
# API. With libpcap present and found, a real build succeeds on 3.10 and 3.11 and
# fails on 3.12 (``ob_digit``, ``curexc_traceback``) and on 3.14 (those two plus
# ``ma_version_tag`` and the arity of ``_PyLong_AsByteArray``). Without the
# marker pip hands the sdist to a 3.12+ interpreter and the user meets a compiler
# error instead of a resolver message; upstream sets no ``requires_python`` of
# its own, and is unmaintained.
PyPCAP = [ "pypcap; python_version < '3.12'" ]
# ``pcap-ct`` is what covers 3.12+, and it is a *separate extra* rather than a
# complementary marker on ``PyPCAP`` above. Two reasons, and the first is
# decisive:
#
#   * They are two engines, not one engine with two backends -- ``engine='pypcap'``
#     selects ``PyPCAP`` and ``engine='pcap_ct'`` selects ``PCAP_CT``, and
#     ``PyPCAP`` refuses to run on pcap-ct rather than mislabel itself. An extra
#     whose contents changed with the interpreter would therefore change which
#     ``engine=`` string works, under one unchanged extra name.
#   * These are pre-releases. Folding them into ``PyPCAP`` would install a beta
#     on a newer interpreter for someone who asked for the stable thing, without
#     ever saying so.
#
# No compiler and no ``pcap.h`` are needed: both publish ``py3-none-any`` wheels.
# A system libpcap *is* still needed at run time, though -- the ``libpcap``
# distribution ships a vendored ``libpcap.so`` but its published ``libpcap.cfg``
# says ``LIBPCAP = None``, which sends its loader to ``find_library("pcap")``.
# That is a runtime prerequisite rather than a resolution problem, so it is not
# expressible here; the engine detects it and degrades to the default engine
# instead of dying, c.f. ``PCAP_CT.unsupported_reason``.
#
# The pins name a pre-release on purpose. Neither project has ever published a
# stable release, so pip's PEP 440 fallback ("if all versions are
# pre-releases, allow them") means a bare ``pcap-ct`` already resolves without
# ``--pre``; naming the version keeps that from being an accident, floors the
# requirement at the versions actually tested here, and still accepts a future
# stable release, since PEP 440 orders 1.3.0 above 1.3.0b3. ``pcap-ct`` itself
# depends on ``libpcap>=1.11.0b16``; ``libpcap`` is listed anyway because it is
# what supplies the ctypes bindings this engine runs on, and that should not be
# implicit in a transitive dependency.
#
# The ``>= '3.10'`` marker is the same courtesy as the ceilings above, pointing
# the other way. Taken from the wheel metadata rather than guessed: ``pcap-ct``
# 1.3.0b3 declares ``Requires-Python: <4.0.0,>=3.9.0`` and ``libpcap``
# 1.11.0b29 declares ``<4.0.0,>=3.10.0``, so 3.10 is the binding floor. The
# marker is load-bearing rather than decorative, because this project's own
# ``requires-python`` is ``>=3.6, <4`` (see the note above it): without the
# marker, ``pip install pypcapkit[PCAP_CT]`` on a 3.6-3.9 interpreter would try
# to resolve two distributions that exclude it and fail the whole install, where
# with it the extra simply resolves to nothing there. CI covers 3.10 upwards, so
# the marker never excludes a tested interpreter.
PCAP_CT = [
    "pcap-ct>=1.3.0b3; python_version >= '3.10'",
    "libpcap>=1.11.0b29; python_version >= '3.10'",
]
# pypcapfile 0.12.0's ``linklayer`` module imports :mod:`imp`, removed in Python
# 3.12, and ``savefile`` imports ``linklayer`` -- so the package installs cleanly
# and is then unusable there. It does *not* raise when the engine is selected:
# ``Extractor.run`` consults ``PyPCAPFile.unsupported_reason()`` before the import
# test and degrades to the default engine with a warning. That guard exists
# precisely because a bare ``import pcapfile`` succeeds on 3.12+, so an
# import-only check would be satisfied and let the ``ModuleNotFoundError`` escape
# from ``__init__`` instead. Upstream master has fixed it but has not released.
PyPCAPFile = [ "pypcapfile; python_version < '3.12'" ]
# for developers -- installs pcapkit.vendor's crawlers, run via
# `pcapkit-vendor` to regenerate pcapkit.const. Includes ``pycrate`` so
# pcapkit.vendor.ngap's two crawlers (#880) can run, and ``requests``/
# ``beautifulsoup4`` for the seven crawlers that import them at module scope
# (c.f. the ``test`` extra's own comment below for which, and #507). #910
# narrowed ``all`` to core addons only, so this extra now names all three
# itself rather than leaning on ``all`` to also carry them -- ``pycrate``
# happens to be a core addon in its own right post-#910 (see the ``all``
# extra's comment below), but ``requests``/``beautifulsoup4`` are not, having
# moved to ``dev`` instead. Either way, this extra's own requirements are what
# it is correct against, not whatever ``all`` happens to carry.
vendor = [ "requests[socks]", "beautifulsoup4[html5lib]", "pycrate" ]
# #910: narrowed to *core addons* only -- the owner's ruling scopes this to
# everything needed for the library itself to work at full functionality, rather
# than everything an end user might conceivably want. An earlier ruling on the
# same issue read the latter and added ``pycrate`` on that basis; the ruling that
# stuck narrowed it again, this time by kind: ``cli``, ``crypto`` and ``pycrate``
# (NGAP) are core addons and stay, and the four 3rd-party capture engines that
# used to be here -- ``dpkt``, ``scapy``, ``pyshark``, ``pypcapfile`` -- are
# installed one at a time on demand, as ``PyPCAP`` and ``PCAP_CT`` always were,
# and move out to their own extras below. Install one explicitly: ``pip install pypcapkit[DPKT]`` /
# ``[Scapy]`` / ``[PyShark]`` / ``[PyPCAPFile]``.
#
# ``pypcap`` and ``pcap-ct``/``libpcap`` stay out for the reason they always
# have, which #910 leaves untouched: installability, not desirability.
# ``pypcap`` is an sdist-only C extension that needs a compiler and the libpcap
# development files, and fails where only the header is present -- as on the
# macOS runners. ``pcap-ct`` and ``libpcap`` need no compiler, but are published
# only as pre-releases, and ``all`` should not be how somebody ends up with a
# beta they did not ask for. Install either explicitly: ``pip install
# pypcapkit[PyPCAP]`` or ``pip install pypcapkit[PCAP_CT]``.
all = [ "emoji", "cryptography>=3.4", "pycrate" ]
# Not for an end user -- for CI, which has a different need entirely: pylint,
# mypy and Sphinx's autodoc all resolve imports against whatever is installed,
# so narrowing ``all`` above would otherwise have made every one of
# ``dpkt``/``scapy``/``pyshark``/``pypcapfile`` newly unresolvable to those
# tools. This extra is what a workflow installs *alongside* ``all`` --
# ``.[all,dev]`` -- to see everything ``all`` used to carry, for that purpose
# only. ``.github/workflows/lint.yml``'s own comment tracks exactly 8
# ``import-error`` messages, from ``pypcap``/``pcap-ct`` (via ``PyPCAP`` and
# ``PCAP_CT`` above, both absent on the Python it lints) and from
# ``pypcapfile`` being excluded there by the same marker this extra repeats
# below; this is the extra that keeps that count at 8 rather than growing it,
# and it is not a place to add ``pypcap``/``pcap-ct`` just to silence a
# finding CI has already decided to carry as advisory.
dev = [
    "dpkt", "scapy", "pyshark",
    # same marker and reasoning as the PyPCAPFile extra above and the old
    # ``all``: on 3.12+ the package installs cleanly and is then unusable, so
    # the marker keeps the resolver from fetching something that could never
    # run. It is not guarding against a hard error -- ``Extractor.run`` already
    # degrades to the default engine with a warning, installed or not
    "pypcapfile; python_version < '3.12'",
    "requests[socks]", "beautifulsoup4[html5lib]",
]
docs = [
    "Sphinx>=6.1.3", "furo",
    "sphinx-autodoc-typehints", "sphinxext-opengraph", "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "typing-extensions", "mypy-extensions",
]
test = [
    "pytest>=8",
    # >=3.6.1, not >=3: the `shouldfail` forwarding tests/conftest.py's xdist fix
    # depends on (xdist/remote.py:146-147) lands in 3.6.0, which PyPI has yanked,
    # so 3.6.1 is the actual floor. Below it the fix silently reverts and
    # test_xdist_run_reports_the_diagnostic_and_fails goes red rather than
    # skipped, since `importlib.util.find_spec('xdist')` still succeeds.
    "pytest-xdist>=3.6.1",
    "typing-extensions",
    # Enough of the ``vendor`` extra for a test to import a vendor crawler.
    # Without these, ``tests/vendor/test_ipx_socket_unit.py`` reports "9 skipped"
    # rather than failing, so the byte-for-byte regeneration check that is the
    # only guard on the hand-maintained IPX socket registry never runs on any CI
    # path: every ``unit-tests.yml`` job's install line builds on ``.[test]``,
    # and ``cron-vendor.yml`` installs ``.[all]`` but never invokes pytest.
    #
    # Both are needed, not just ``requests``. ``pcapkit.vendor.default`` imports
    # ``requests`` at module scope, and ``pcapkit.vendor.__init__`` then imports
    # every crawler unconditionally -- seven of which import ``bs4`` at module
    # scope. Its ``try: import bs4`` guard suppresses only the warning, not the
    # ``ModuleNotFoundError`` that the crawler imports below it raise anyway.
    #
    # Plain, without the ``vendor`` extra's ``[socks]`` and ``[html5lib]``:
    # nothing in the test suite goes through a proxy, and the one unit-tier
    # test that parses HTML (``tests/vendor/test_ftp_return_code_unit.py``)
    # does so from an inline fixture with the ``vendor`` extra's own
    # ``html5lib``, not through anything this extra provides, so neither
    # parser nor proxy support is reachable from here. Their absence
    # makes :mod:`pcapkit.vendor` log two ``VendorWarning``s at import, which
    # pytest captures and shows only on failure; they change no result. See #507.
    "requests",
    "beautifulsoup4",
    # Same reason as the two above, for a different test: without it
    # ``tests/project/test_isort_clean.py`` skipped on every CI leg, so the only
    # guard on ``make isort``'s four recipe lines -- and on the target-resolving
    # globs behind them, wrong three times over (#757, #765, #767) -- ran
    # nowhere. #766.
    #
    # A lint tool in the ``test`` extra rather than in a ``lint`` extra of its
    # own, deliberately. ``isort`` is what *this suite* needs in order not to
    # skip, which is exactly what this extra is for; a ``lint`` extra would also
    # have to carry ``mypy``, ``pylint``, ``bandit`` and ``vermin`` to mean
    # anything, and carrying mypy would silently close the ``HAS_MYPY`` gap that
    # #779 decided to leave open -- reversing a ruling from an unrelated change.
    #
    # Unlike the other four linters, isort has no CI check of its own to defer
    # to: ``.github/workflows/lint.yml`` installs "vermin pylint mypy bandit"
    # and says in its own header that isort appears only in
    # ``cron-vendor.yml``, as a formatter rather than as a check. Cheap, too --
    # a pure-Python wheel, and all four lines together measure about 1.5s.
    #
    # Unpinned, matching ``requests`` and ``beautifulsoup4`` above rather than
    # inventing an unmeasured floor (verified against 9.0.1). A future isort
    # whose verdict moves therefore turns that test red, which is the intended
    # failure: it names the file and prints the diff, where the skip it replaced
    # said nothing at all.
    "isort",
]

# setuptools specific

[tool.setuptools]
zip-safe = false  # We use __file__ in pcapkit/__init__.py, therefore Scapy isn't zip safe

[tool.setuptools.packages.find]
include = [
    "pcapkit*",
]
exclude = [
    "test*",
    "docs*",
    "sample*",
]

[tool.setuptools.dynamic]
version = { attr="pcapkit.__version__" }

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]

[tool.coverage.run]
source = [
    "pcapkit",
]
branch = true

[tool.coverage.report]
show_missing = true
