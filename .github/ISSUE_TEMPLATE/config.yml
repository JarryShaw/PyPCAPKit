# The "New issue" chooser.
#
# ``blank_issues_enabled`` is deliberately true: the maintainer files most issues
# without a template.
#
# The security link exists because ``SECURITY.md`` asks reporters not to open a
# public issue for anything exploitable; without it the chooser offers no private
# route.

blank_issues_enabled: true

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/JarryShaw/PyPCAPKit/security/advisories/new
    about: >-
      Please do not open a public issue for a security problem. This opens an
      advisory visible only to the maintainer, so a patch can be prepared before
      anything is public. See SECURITY.md for what to include.

  - name: Ask a question, or get usage help
    url: https://github.com/JarryShaw/PyPCAPKit/discussions
    about: >-
      For "how do I ...?" rather than "this is broken"; the issue tracker is for
      defects and feature requests.

  - name: Read the documentation
    url: https://jarryshaw.github.io/PyPCAPKit/
    about: >-
      The API reference and per-protocol documentation, which answer most usage
      questions.
