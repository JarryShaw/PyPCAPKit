name: Integration Tests

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Runtime and packet fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and integration dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[all,test]'

      - name: Run integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/integration \
            $(find tests -type f \( -name '*_runtime.py' -o -name '*_regression.py' \) \
              ! -path 'tests/integration/*' -print) \
            2>&1 | tee integration-tests.log

      - name: Upload test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: integration-tests-${{ github.run_id }}
          path: integration-tests.log
          if-no-files-found: ignore
          retention-days: 14
