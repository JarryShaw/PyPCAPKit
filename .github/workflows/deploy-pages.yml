name: GitHub Pages

on:
  # No `push: branches: [main]` here. `unit-tests.yml`'s own push trigger already
  # runs the full matrix for this commit; calling it again with `gate-only: true`
  # below re-ran the single-version "Gate" job a second time for the same tree
  # (#715). Chaining off `Unit Tests`' completion instead means the gate never
  # runs twice, and this workflow simply waits for the verdict that already
  # exists. `workflow_run` fires for *any* completion of that workflow, PR or
  # push, so the jobs below filter on `.event == 'push'` themselves rather than
  # trusting a `branches:` filter here to do it -- see the note on `deploy-pages`.
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]
  schedule:
    - cron: '0 2 * * 6'
  pull_request:
    # Was '**', which matched pull requests against every branch and made this
    # the one workflow that fired outside the main-targeting set the others
    # use. Every pull request here targets main, so '**' only ever added runs.
    branches: [main]

permissions:
  contents: read

# Deliberately still keyed on the ref, unlike the validation workflows. This one
# publishes a *latest state* rather than a verdict on a commit, so coalescing is
# correct: when two pushes land close together the pending build is dropped and
# the newer one publishes, and deploying the older commit's docs after the newer
# ones would actively be wrong. GitHub Pages also permits only one live
# deployment, so serialising here is a requirement rather than a saving.
#
# A `workflow_run` is keyed on the commit `Unit Tests` verified instead (#1643).
# One whose verdict is for an older commit only runs `verdict` and skips, and in
# the shared group it would still displace a pending run whose verdict matches,
# since "any existing pending job or workflow in the same concurrency group will
# be canceled" (GitHub, "Control the concurrency of workflows and jobs"). The
# coalescing and serialising above then happen in `deploy-pages`' own `ci-`
# group, which only a run whose verdict covers its checkout reaches.
concurrency:
  group: pages-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only earns its runners on the schedule trigger: `Unit Tests` has no
  # schedule trigger of its own, so Saturday's cron run is the one case left
  # where nothing else has already verified this tree, and a gate is still
  # needed. Pull requests never published anyway, and `workflow_run` carries
  # its own verdict from the run that completed -- see `deploy-pages` below.
  unit-tests:
    name: Docs test gate
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'workflow_run' }}
    permissions:
      contents: read
    uses: ./.github/workflows/unit-tests.yml
    with:
      gate-only: true

  # #1643: `github.sha`, which every checkout here takes, is main's tip when the
  # `workflow_run` was raised -- not the commit the completed `Unit Tests` run
  # verified, and in a merge wave the two differ. This job compares them with
  # util/verdict_covers_checkout.py, whose docstring gives the rule, and the job
  # below acts on a `workflow_run` only when `verified` is 'true'. Its `if:` is
  # that job's `workflow_run` clause, so a run raised by a pull request's or a
  # failed `Unit Tests` run still concludes `skipped`, as before.
  verdict:
    name: Verdict covers this commit
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verdict.outputs.verified }}
    steps:
      # The default ref, as the job below uses, so both see the same `github.sha`.
      # Twenty commits leaves room for the bot commits the rule accepts; a verdict
      # further back is not found, and so not accepted.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Compare the verified commit with this checkout
        id: verdict
        env:
          VERDICT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 util/verdict_covers_checkout.py

  deploy-pages:
    needs: [ unit-tests, verdict ]
    # `needs` cannot itself be conditional, so a skipped gate (pull requests,
    # and `workflow_run`) has to be accepted explicitly -- by default this
    # job would inherit the skip. `!cancelled()` rather than `always()` so that
    # cancelling the run still cancels the docs build; a gate that actually
    # failed still blocks.
    #
    # The `workflow_run` clause is the real gate for a push to main: it
    # reads the verdict `Unit Tests` already reached instead of re-running it,
    # and `verdict` says whether that verdict covers the commit checked out
    # below (#1643). `.event == 'push'` and `.head_branch == 'main'`
    # both matter -- `workflow_run` fires for *every* completion of that
    # workflow, including one triggered by a pull request, and without this
    # check a green PR would publish docs from that PR's tree.
    if: >-
      !cancelled() && needs.unit-tests.result != 'failure' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        needs.verdict.outputs.verified == 'true'
      ))
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          # Deliberately the default `github.sha` (main's tip), not
          # `github.event.workflow_run.head_sha`. Pinning to the latter once
          # ran here and CodeQL flagged it as "checkout of untrusted code in a
          # privileged context" -- `workflow_run` can also be raised by a pull
          # request's `Unit Tests` run, and that field would then be a fork's
          # commit. The `if:` above already keeps that path from reaching this
          # step, but making the ref itself always resolve to a trusted
          # default-branch commit removes the pattern outright rather than
          # relying on CodeQL tracing through the guard. `main`'s tip is also
          # the *right* commit for docs, which should reflect current main,
          # not a slightly older one -- so this is not a compromise here.
          # Whether this commit is one that verdict covers is `verdict`'s
          # question (#1643).
          persist-credentials: false

      # #1660: `latest` from .github/python-versions.toml, read with the
      # runner's own python3.
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # Builds the Sphinx documentation into `docs/build/html`, which the deploy
      # step below publishes. `PCAPKIT_SPHINX` is what makes the
      # `if SPHINX_TYPE_CHECKING:` TypedDicts visible to autodoc; `PCAPKIT_DEVMODE`
      # puts the library logger at DEBUG on stderr and leaves tracebacks untrimmed,
      # so an autodoc import failure is legible in the run log. Both are read at
      # import time, so they are exported before anything imports `pcapkit` --
      # `docs/source/conf.py` sets `PCAPKIT_SPHINX` itself for the same reason.
      # `.[all,dev]`, not `.[all]` alone: autodoc imports every module, including
      # the engine wrappers, so it needs the same imports resolvable that
      # `lint.yml` does and for the same reason (#910's `dev` extra, added when
      # that issue narrowed `all` to core addons only).
      - name: Install and Build 🔧
        run: |
          set -x

          export PCAPKIT_SPHINX=1
          export PCAPKIT_DEVMODE=1

          python -m pip install -U pip setuptools wheel
          python -m pip install -r docs/requirements.txt
          python -m pip install -e .[all,dev]

          rm -rf docs/build
          make -C docs html

          # disable Jekyll
          touch docs/build/html/.nojekyll

      # `.nojekyll` is hidden, and upload-artifact leaves hidden files out unless
      # told otherwise.
      - name: Upload the built site
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-html
          path: docs/build/html
          include-hidden-files: true
          retention-days: 1

  # #1968: the push to `gh-pages`, split out of `deploy-pages` so that the job
  # running the tree's own code, a pull request's included, holds only the
  # top-level `contents: read`. This job runs no project code, and never on a
  # pull request. It needs `contents: write` to push `gh-pages`, and `actions:
  # read` to download the site `deploy-pages` uploaded in this run. That job's
  # result is checked explicitly, under `!cancelled()`: `unit-tests` or `verdict`
  # always skips, and a skip anywhere in the chain skips a job left with the
  # implicit `success()` (#1632). Its own group keeps one push to `gh-pages` at
  # a time.
  publish-pages:
    name: Publish to gh-pages
    needs: [ deploy-pages ]
    if: >-
      !cancelled() && needs.deploy-pages.result == 'success' &&
      github.event_name != 'pull_request'
    concurrency:
      group: publish-pages-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      # The deploy action pushes from a checkout of this repository.
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the built site
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pages-html
          --dir docs/build/html

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: docs/build/html # The folder the action should deploy.
          clean: true # Automatically remove deleted files from the deploy branch
