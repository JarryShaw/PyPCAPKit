name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 6'
  pull_request:
    # Was '**', which matched pull requests against every branch and made this
    # the one workflow that fired outside the main-targeting set the others
    # use. Every pull request here targets main, so '**' only ever added runs.
    branches: [main]

permissions:
  contents: write

# Deliberately still keyed on the ref, unlike the validation workflows. This one
# publishes a *latest state* rather than a verdict on a commit, so coalescing is
# correct: when two pushes land close together the pending build is dropped and
# the newer one publishes, and deploying the older commit's docs after the newer
# ones would actively be wrong. GitHub Pages also permits only one live
# deployment, so serialising here is a requirement rather than a saving.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing is published on a pull request -- the Deploy step below is skipped
  # -- so the gate only earns its runners when a real publish follows. The docs
  # build still runs on pull requests, which is the part that actually
  # validates a documentation change.
  unit-tests:
    name: Docs test gate
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/unit-tests.yml
    with:
      gate-only: true

  deploy-pages:
    needs: [ unit-tests ]
    # `needs` cannot itself be conditional, so a skipped gate (pull requests)
    # has to be accepted explicitly -- by default this job would inherit the
    # skip. `!cancelled()` rather than `always()` so that cancelling the run
    # still cancels the docs build; a gate that actually failed still blocks.
    if: ${{ !cancelled() && needs.unit-tests.result != 'failure' }}
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install and Build 🔧 # This example project is built using npm and outputs the result to the 'build' folder. Replace with the commands required to build your project, or remove this step entirely if your site is pre-built.
        run: |
          set -x

          export PCAPKIT_SPHINX=1
          export PCAPKIT_DEVMODE=1

          python -m pip install -U pip setuptools wheel
          python -m pip install -r docs/requirements.txt
          python -m pip install -e .[all]

          rm -rf docs/build
          make -C docs html

          # disable Jekyll
          touch docs/build/html/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: docs/build/html # The folder the action should deploy.
          clean: true # Automatically remove deleted files from the deploy branch
