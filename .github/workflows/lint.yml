name: "Lint"

# vermin, pylint, mypy and bandit, plus actionlint over the workflows (#1967).
# `isort` is not among them: it appears only in cron-vendor.yml, as a formatter
# that rewrites the generated constants, not as a check.
#
# Every step but actionlint is advisory (`continue-on-error: true`), because none
# is clean and a job red from day one teaches everyone to ignore red. Promote a
# step by deleting its `continue-on-error` once it is clean, and move it below
# the advisory steps, as a failed step skips every step after it. Counts are in
# the run summary, not here: written-down counts drift (#753).
#
# pylint's `R0401` cyclic-import depends on module-processing order, so runs on
# one tree disagree on it; a change in the R class alone is not evidence.
#
# Promotion order, cheapest first:
#   * bandit -- mostly B104 on `'0.0.0.0'` default arguments in MH/MIP option
#     builders, which bind no socket; triage the rest with `# nosec`.
#   * mypy -- part of its output is `unused-ignore`, risk-free to delete.
#   * vermin -- blocked on a decision, not on cleanup: see its step.
#   * pylint -- not realistically promotable: `unused-argument`,
#     `redefined-builtin` and `super-init-not-called` are inherent to the
#     schema DSL, and its metaprogramming yields `unsubscriptable-object` and
#     `no-member` false positives.

on:
  # No `push: [main]`: the pull request already linted the commit, and runners
  # are oversubscribed. The schedule covers main's drift.
  pull_request:
    branches: [main]
  schedule:
    # Saturdays, an hour clear of the other Saturday jobs.
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: read

# Only pull-request runs may be superseded (see unit-tests.yml): a shared group
# drops a *pending* run when a newer one joins, so other events key on the run id.
concurrency:
  group: lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# #2030: one Discussions category holds every report with no pull request to
# comment on, one thread per job.
env:
  REPORT_CATEGORY: CI reports

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.run-report.outputs.status }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One interpreter, not a matrix: these tools read the source, so more
      # interpreters would only repeat the same findings. `latest` from
      # .github/python-versions.toml, like every single-interpreter job (#1661).
      # To test a Python without C `_decimal`, use setup-python's build, which
      # has none: faking it via `sys.modules` crashes astroid (#1677).
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # `.[all,dev]`: pylint and mypy resolve imports, and `dev` carries the
      # engines #910 took out of `all`. pylint's `import-error` for `pypcap` and
      # `pypcapfile` (`python_version < '3.12'`) and `pcap-ct` (in no extra
      # installed here) is expected.
      - name: Install package and lint tools
        run: |
          set -x

          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[all,dev]'
          python -m pip install -U vermin pylint mypy bandit

      # Each step runs its Makefile target with `RUN=` emptying the `pipenv run`
      # prefix, so CI and a local `make pylint` cannot drift apart. `set +e` and
      # `status=` keep the summary lines running under the default `bash -e`;
      # each block also goes to lint-summary.md for the run report (#2030).

      - name: bandit
        id: bandit
        continue-on-error: true
        run: |
          set +e
          make bandit RUN= 2>&1 | tee bandit.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### bandit'
            echo '```'
            sed -n '/^Run metrics:/,$p' bandit.log || echo 'no run metrics in output'
            echo '```'
          } | tee -a "$RUNNER_TEMP/lint-summary.md" >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: mypy
        id: mypy
        continue-on-error: true
        run: |
          set +e
          make mypy RUN= 2>&1 | tee mypy.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### mypy'
            echo '```'
            tail -n 1 mypy.log
            echo '```'
          } | tee -a "$RUNNER_TEMP/lint-summary.md" >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # `vermin-ci`, not `vermin`: that target redirects the report into temp/,
      # out of this log. Same flags, via $(VERMIN_FLAGS).
      #
      # Blocking needs a decision, not a cleanup. vermin.ini's `targets = 3.8`
      # matches `requires-python` (#2051), but vermin reports 3.11:
      # `--no-parse-comments` ignores the `# novermin` markers on compat.py's
      # version-gated imports, and evaluated annotations put some
      # `pcapkit.foundation` modules at 3.9.
      - name: vermin
        id: vermin
        continue-on-error: true
        run: |
          set +e
          make vermin-ci RUN= 2>&1 | tee vermin.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### vermin'
            echo '```'
            grep -E '^(Minimum required versions|Incompatible versions|Target versions not met):' vermin.log \
              || echo 'no verdict in output'
            echo '```'
          } | tee -a "$RUNNER_TEMP/lint-summary.md" >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # Last of the advisory steps as the slowest, so quick verdicts land first.
      - name: pylint
        id: pylint
        continue-on-error: true
        run: |
          set +e
          make pylint RUN= 2>&1 | tee pylint.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### pylint'
            echo '```'
            printf 'messages by class (C/E/R/W):\n'
            grep -oE ': [A-Z][0-9]{4}:' pylint.log | grep -oE '[A-Z]' | sort | uniq -c || echo 'none'
            echo '```'
          } | tee -a "$RUNNER_TEMP/lint-summary.md" >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # actionlint checks every workflow, running the image's shellcheck over
      # each `run:` block. It blocks (#1967), and `Lint` is a required check of
      # ruleset 23497679, so a finding holds a merge. It runs last so a finding
      # skips none of the advisory steps, and on `!cancelled()` so a failed
      # Python setup does not skip it.
      #
      # The image's shellcheck is not pinned, so a new runner image can flag
      # unchanged code; fix the script it flags.
      #
      # The binary is pinned by version and sha256 from the release's checksums
      # file; Dependabot does not see it, so bump both together. The workflows'
      # YAML anchors need actionlint 1.7.10 or later.
      #
      # The `-ignore` hides a false positive on `concurrency.queue`, a documented
      # key (project-status.yml uses it) no actionlint release knows yet
      # (rhysd/actionlint#657, fixed by rhysd/actionlint#654). Drop it once a
      # release with the fix is pinned.
      - name: actionlint
        id: actionlint
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

          set +e
          "$RUNNER_TEMP/actionlint" -oneline -no-color \
            -ignore '^unexpected key "queue" for "concurrency" section\.' 2>&1 | tee actionlint.log
          status=${PIPESTATUS[0]}
          set -e

          # Without pipefail a pipeline's status is uniq's, so an empty count
          # is caught by its output, not its status.
          rules=$(grep -oE '\[[a-z-]+\]$' actionlint.log | sort | uniq -c)
          shellcheck=$(grep -oE 'SC[0-9]+:[a-z]+' actionlint.log | sort | uniq -c)
          {
            echo '### actionlint'
            echo '```'
            printf 'findings by rule:\n%s\n' "${rules:-none}"
            printf 'shellcheck findings by code:\n%s\n' "${shellcheck:-none}"
            echo '```'
          } | tee -a "$RUNNER_TEMP/lint-summary.md" >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # #2030: the report the `discussion` job posts, never on a pull request,
      # whose run has checks of its own. `status=warning` where an advisory step
      # failed. Both report steps are `continue-on-error`, so a report never
      # fails the run.
      - name: Write the run report
        id: run-report
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          BANDIT: ${{ steps.bandit.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          VERMIN: ${{ steps.vermin.outcome }}
          PYLINT: ${{ steps.pylint.outcome }}
          ACTIONLINT: ${{ steps.actionlint.outcome }}
        run: |
          status=success
          for outcome in "$BANDIT" "$MYPY" "$VERMIN" "$PYLINT"; do
            if [ "$outcome" = failure ]; then
              status=warning
            fi
          done
          report="$RUNNER_TEMP/lint-report.md"
          {
            echo '### Lint'
            echo
            echo "- bandit, advisory: ${BANDIT:-not run}"
            echo "- mypy, advisory: ${MYPY:-not run}"
            echo "- vermin, advisory: ${VERMIN:-not run}"
            echo "- pylint, advisory: ${PYLINT:-not run}"
            echo "- actionlint, blocking: ${ACTIONLINT:-not run}"
            if [ -s "$RUNNER_TEMP/lint-summary.md" ]; then
              echo
              cat "$RUNNER_TEMP/lint-summary.md"
            fi
          } > "$report"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$report"

      - name: Upload the run report
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: ${{ runner.temp }}/lint-report.md
          retention-days: 14

  # #2030: posts `lint`'s report on every run but a pull request's, in
  # `scheduled` mode: Lint has no push trigger, and a dispatch is a deliberate
  # report, as in ci-timing.yml. The job and its steps are `continue-on-error`,
  # and util/discussion_report.py warns rather than failing.
  discussion:
    name: Post the lint report
    needs: [ lint ]
    if: ${{ always() && github.event_name != 'pull_request' && needs.lint.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      discussions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A run that never wrote a report uploaded none; the script then warns.
      - name: Download the report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lint-report
          path: report

      - name: Post the report to Discussions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_STATUS: ${{ needs.lint.outputs.status }}
        run: |
          if [ "$LINT_RESULT" = success ]; then
            status="${LINT_STATUS:-success}"
          else
            status="$LINT_RESULT"
          fi
          python3 util/discussion_report.py --category "$REPORT_CATEGORY" \
            --title 'lint: weekly lint report' --report report/lint-report.md \
            --mode scheduled --status "$status"
