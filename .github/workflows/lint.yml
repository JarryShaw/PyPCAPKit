name: "Lint"

# The linters this repository already maintains -- vermin, pylint, mypy and
# bandit -- had Makefile targets and no CI presence at all, so nothing noticed
# when their output changed. (`isort` does appear in cron-vendor.yml, but as a
# formatter that rewrites the generated constants, not as a check.) This workflow
# is where they run.
#
# Every one of them is advisory -- `continue-on-error: true` on each step -- and
# that is a measurement result rather than a preference. This header records no
# finding counts on purpose: #753 was filed when most of the figures it once
# recorded (on 15189abff) had already drifted -- mypy and pylint by the issue's
# own numbers, and vermin too, which had moved before the issue's own text said
# it "was not re-checked". Only bandit held. A written-down count invites
# exactly this, with no way to tell staleness from disagreement, so each step
# writes its current count to the run summary instead; read the numbers there.
#
# pylint's R class is the one that moves without the code moving. Repeated runs
# on an identical tree were measured to disagree on it, entirely through
# `R0401` cyclic-import, whose count depends on module-processing order rather
# than on the code -- `duplicate-code` and every other R check held steady
# across all of them, as did E, W and C. A change in R between two runs is
# therefore no evidence on its own that anything changed.
#
# #767 cleaned up `PYLINT_FLAGS`. Its `--disable=` list named checks pylint has
# genuinely removed -- `old-division`, `no-absolute-import` and
# `input-builtin` (-> `R0022 useless-option-value`, and pylint's own message
# says so: "was removed from pylint") -- plus `eq-without-hash`, which is not
# gone, only unloaded: `pylint.extensions.eq_without_hash` still ships `W1641`,
# but nothing in `--load-plugins=` ever named it, so `--disable=eq-without-hash`
# was as unrecognised as if the check had been removed (-> `W0012
# unknown-option-value`). Same shape of breakage as `emptystring` below, a
# different cause. All of them are dropped either way -- loading that plugin
# to enable `eq-without-hash` properly found nothing when measured (no `W1641`
# over `pcapkit/`), so there is nothing lost in dropping it instead.
#
# `--load-plugins=` also named `pylint.extensions.emptystring`, which no
# longer exists in the installed pylint (-> `E0013 bad-plugin-value` every
# run). Unlike the entries above, though, the check it used to provide did not
# stop running when the plugin did: `compare-to-empty-string` was folded into
# the core `refactoring` checker at pylint 3.0 as
# `use-implicit-booleaness-not-comparison-to-string` (C1804), reachable under
# either name with no plugin load at all. #767's own premise -- that the
# broken plugin reference made the check "inert" and it "has never run" -- is
# wrong: `--list-msgs-enabled` run under the old flags (broken plugin
# reference included) and the new ones side by side gives the same
# enabled-message list either way, and C1804 fires under the old flags on a
# minimal repro despite the `E0013`. So this half of `PYLINT_FLAGS`' change is
# flag hygiene, not enablement: it drops a dead plugin reference and keeps the
# check it used to gate under that check's current name, and the only thing
# that actually changes is that `E0013` (and the Command-line noise of the
# entries above) stops firing. With those gone, every message the job's own
# grep-based count (the `pylint` step below) tallies is about the code.
#
# None of them is clean, so none can block: a job that is red the day
# it lands teaches everyone to scroll past red, which costs more than the checks
# are worth. Advisory steps keep the numbers visible (each writes its count to
# the run summary) without that damage, and promoting one to blocking is a matter
# of deleting its `continue-on-error` line once its count reaches zero.
#
# Promotion order, cheapest first:
#   * bandit -- most of its findings are B104 "binding to all interfaces" on
#     `address: ... = '0.0.0.0'` *default arguments* in MH/MIP option builders,
#     which bind no socket. This package already suppresses findings with
#     `# nosec`, so triaging what is left is the whole job.
#   * mypy -- part of its output is `unused-ignore`, i.e. `# type: ignore`
#     comments that are no longer needed. Deleting those is risk-free.
#   * vermin -- blocked on a decision, not on cleanup: see the step below.
#   * pylint -- not realistically promotable at this rule set. Most of its
#     warnings are `unused-argument`, `redefined-builtin` and
#     `super-init-not-called`, each of which is inherent to the
#     schema DSL: protocol fields are legitimately named `next`/`type`/`id`, and
#     the `if TYPE_CHECKING: def __init__(...)` stubs exist precisely so as not
#     to call `super().__init__`. Narrowing to `--enable=E,F` does not rescue it
#     either -- what remains is mostly `unsubscriptable-object` and
#     `no-member` false positives off the same metaprogramming.

on:
  # Deliberately *not* `push: [main]`, which is the trigger the other validation
  # workflows here use. Those gate something: a failing unit-test or CodeQL run
  # on main is a commit someone must look at. These steps gate nothing, so a
  # second advisory run per merge -- on a commit that already got one on its pull
  # request -- would buy no information while competing for runners that are
  # visibly oversubscribed (pull requests on this repository have been sitting at
  # 21 queued checks for ten minutes at a time). The weekly schedule covers
  # main's own drift, which is the only thing the push trigger would have added.
  pull_request:
    branches: [main]
  schedule:
    # Saturdays, an hour clear of the other weekly jobs: CodeQL runs at 02:00,
    # Python Compatibility at 04:00 and Vendor Update at 10:00.
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: read

# Only pull-request runs may be superseded -- see the note in unit-tests.yml. A
# ref-keyed group drops a *pending* run when a newer one joins it, so scheduled
# and manual runs are keyed on the run id to give each one its own group.
concurrency:
  group: lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # One interpreter, not a matrix. Unit Tests and Python Compatibility sweep
      # the supported tier, plus the non-blocking KTLO legs (#1633), because
      # they check that the package *runs* everywhere; these tools read the
      # source, and running them several times over would produce several
      # copies of the same findings for several times the runner cost.
      #
      # `latest` from .github/python-versions.toml, like every single-interpreter
      # job (#1661). Moving off 3.14 changes no count. Measured at 0bc157660
      # on setup-python's 3.14.8 and 3.15.0 builds: pylint 4.1.3 (astroid
      # 4.3.4) reports the same C, E and W messages on both, message for message;
      # only R0401 cyclic-import differs, as it does between two runs on one
      # interpreter (see the header). bandit, mypy and vermin print identical
      # reports. To test a 3.15 without C `_decimal`, use setup-python's build,
      # which has none: faking it with `sys.modules['_decimal'] = None` makes
      # astroid crash on pcapkit/toolkit/dpkt.py on 3.14.8 too (#1677).
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # `.[all,dev]` rather than a bare install: pylint and mypy resolve imports,
      # so findings depend on what is importable. #910 narrowed `all` to core
      # addons only (`cli`, `crypto`, `NGAP`), so the `dev` extra it added is
      # what puts `dpkt`/`scapy`/`pyshark`/`pypcapfile` back for this job --
      # without it, narrowing `all` would have grown the count below rather
      # than left it alone. Note `pypcap` and `pypcapfile` are marked
      # `python_version < '3.12'` in pyproject.toml, and `pcap-ct` is in no
      # extra installed here, so each is absent by design -- that is the source
      # of pylint's `import-error` messages, and they will persist until those
      # engines are installed here.
      - name: Install package and lint tools
        run: |
          set -x

          python -m pip install -U pip setuptools wheel
          python -m pip install -e .[all,dev]
          python -m pip install -U vermin pylint mypy bandit

      # Every step below runs the *Makefile* target rather than spelling the
      # flags out again, with `RUN=` emptying the `pipenv run` prefix the targets
      # use locally. That is what keeps this workflow and a developer's `make
      # pylint` running the same check -- restating the flag sets here would let
      # the two drift the first time either changed, which is how "passes on my
      # machine" starts.
      #
      # `continue-on-error: true` reports the step's real verdict as a non-
      # blocking annotation and lets the following steps run, so one tool's
      # findings never hide another's. The `status=$?` dance is needed because
      # the default shell is `bash -e`: without it the summary lines after a
      # non-zero tool would never execute.

      - name: bandit
        continue-on-error: true
        run: |
          set +e
          make bandit RUN= 2>&1 | tee bandit.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### bandit'
            echo '```'
            sed -n '/^Run metrics:/,$p' bandit.log || echo 'no run metrics in output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      - name: mypy
        continue-on-error: true
        run: |
          set +e
          make mypy RUN= 2>&1 | tee mypy.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### mypy'
            echo '```'
            tail -n 1 mypy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      # `vermin-ci`, not `vermin`: the `vermin` target redirects the report into
      # temp/, so a run that found violations stops at that line with the report
      # in a file rather than in this log. Same flags, via $(VERMIN_FLAGS).
      #
      # This one needs a decision rather than a cleanup before it can block, and
      # the decision is not CI's to make. vermin.ini sets `targets = 3.6` while
      # the code's real floor is 3.11 -- `enum.StrEnum` and
      # `enum.show_flag_values` are 3.11 members, and modules across the package
      # import `typing_extensions`. pyproject.toml's `requires-python` claims
      # `>=3.6, <4`, so the declared floor and the actual one are five releases
      # apart. Whichever way that is resolved -- raise `requires-python`, or
      # raise `targets` to match it -- belongs in its own change.
      - name: vermin
        continue-on-error: true
        run: |
          set +e
          make vermin-ci RUN= 2>&1 | tee vermin.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### vermin'
            echo '```'
            grep -E '^(Minimum required versions|Incompatible versions|Target versions not met):' vermin.log \
              || echo 'no verdict in output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      # Last because it is by far the slowest -- minutes over ~90k lines -- so
      # the quick verdicts reach the summary before it starts.
      - name: pylint
        continue-on-error: true
        run: |
          set +e
          make pylint RUN= 2>&1 | tee pylint.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### pylint'
            echo '```'
            printf 'messages by class (C/E/R/W):\n'
            grep -oE ': [A-Z][0-9]{4}:' pylint.log | grep -oE '[A-Z]' | sort | uniq -c || echo 'none'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
