name: "Lint"

# vermin, pylint, mypy and bandit, which had Makefile targets but no CI
# presence, plus actionlint over the workflows (#1967). `isort` is not among
# them: it appears only in cron-vendor.yml, as a formatter that rewrites the
# generated constants, not as a check.
#
# Every step is advisory (`continue-on-error: true`): none is clean, and a job
# that is red the day it lands teaches everyone to scroll past red. Promote a
# step by deleting its `continue-on-error` once its count reaches zero. Each
# step writes its result to the run summary; read the numbers there. This
# header records no counts on purpose: most of those #753 recorded had drifted
# by the time it was filed.
#
# pylint's R class moves without the code moving: `R0401` cyclic-import
# depends on module-processing order, so runs on one tree disagree on it. A
# change in R alone is no evidence that anything changed.
#
# #767's `PYLINT_FLAGS` cleanup was flag hygiene, not enablement. It dropped
# `--disable=` entries pylint no longer recognises (`R0022`, `W0012`; loading
# the unloaded `eq-without-hash` plugin instead found no `W1641`) and the dead
# `pylint.extensions.emptystring` plugin (`E0013`), whose check still runs as
# core C1804 `use-implicit-booleaness-not-comparison-to-string` -- measured
# with `--list-msgs-enabled`, contrary to #767's premise. Every message the
# `pylint` step tallies is now about the code.
#
# Promotion order, cheapest first:
#   * bandit -- most findings are B104 on `address: ... = '0.0.0.0'` default
#     arguments in MH/MIP option builders, which bind no socket; triage the
#     rest with `# nosec`.
#   * mypy -- part of its output is `unused-ignore`, risk-free to delete.
#   * vermin -- blocked on a decision, not on cleanup: see its step.
#   * pylint -- not realistically promotable: `unused-argument`,
#     `redefined-builtin` and `super-init-not-called` are inherent to the
#     schema DSL, and `--enable=E,F` leaves `unsubscriptable-object` and
#     `no-member` false positives off the same metaprogramming.

on:
  # No `push: [main]`: these steps gate nothing, so a second advisory run per
  # merge, on a commit its pull request already linted, buys no information
  # while competing for oversubscribed runners. The schedule covers main's drift.
  pull_request:
    branches: [main]
  schedule:
    # Saturdays, an hour clear of the other Saturday jobs.
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: read

# Only pull-request runs may be superseded (see unit-tests.yml): a shared group
# drops a *pending* run when a newer one joins, so other events key on the run id.
concurrency:
  group: lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint checks every workflow, running the image's shellcheck over
      # each `run:` block. First, as it needs no Python. It is advisory; whether
      # it should block now that it reports nothing is open on #1967.
      #
      # The release binary is pinned by version and sha256, from the release's
      # checksums file. Dependabot does not see this pin; bump both together.
      # The workflows use YAML anchors, which actionlint reads from 1.7.10 on.
      #
      # The `-ignore` hides a false positive: `concurrency.queue` is a documented
      # GitHub key (project-status.yml uses it) that no actionlint release knows
      # yet (rhysd/actionlint#657, fixed by rhysd/actionlint#654). Drop the
      # pattern once a release with that fix is pinned.
      - name: actionlint
        continue-on-error: true
        timeout-minutes: 5
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

          set +e
          "$RUNNER_TEMP/actionlint" -oneline -no-color \
            -ignore '^unexpected key "queue" for "concurrency" section\.' 2>&1 | tee actionlint.log
          status=${PIPESTATUS[0]}
          set -e

          # Without pipefail a pipeline's status is uniq's, so an empty count
          # is caught by its output, not its status.
          rules=$(grep -oE '\[[a-z-]+\]$' actionlint.log | sort | uniq -c)
          shellcheck=$(grep -oE 'SC[0-9]+:[a-z]+' actionlint.log | sort | uniq -c)
          {
            echo '### actionlint'
            echo '```'
            printf 'findings by rule:\n%s\n' "${rules:-none}"
            printf 'shellcheck findings by code:\n%s\n' "${shellcheck:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # One interpreter, not a matrix: these tools read the source, so more
      # interpreters would only repeat the same findings. `latest` from
      # .github/python-versions.toml, like every single-interpreter job (#1661).
      # Measured at 0bc157660, setup-python's 3.14.8 and 3.15.0 give identical
      # reports bar R0401 (see the header). To test a 3.15 without C `_decimal`,
      # use setup-python's build, which has none: faking it with
      # `sys.modules['_decimal'] = None` crashes astroid on 3.14.8 too (#1677).
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # `.[all,dev]`: pylint and mypy resolve imports, so findings depend on what
      # is importable, and `dev` carries the engines #910 took out of `all`.
      # `pypcap` and `pypcapfile` are `python_version < '3.12'` and `pcap-ct` is
      # in no extra installed here, so pylint's `import-error` messages for them
      # are by design.
      - name: Install package and lint tools
        run: |
          set -x

          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[all,dev]'
          python -m pip install -U vermin pylint mypy bandit

      # Each step runs its Makefile target, `RUN=` emptying the local `pipenv
      # run` prefix, so this and a developer's `make pylint` cannot drift apart.
      # `continue-on-error: true` lets every tool run whatever another found;
      # `set +e` and `status=` keep the summary lines running under the default
      # `bash -e`.

      - name: bandit
        continue-on-error: true
        run: |
          set +e
          make bandit RUN= 2>&1 | tee bandit.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### bandit'
            echo '```'
            sed -n '/^Run metrics:/,$p' bandit.log || echo 'no run metrics in output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: mypy
        continue-on-error: true
        run: |
          set +e
          make mypy RUN= 2>&1 | tee mypy.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### mypy'
            echo '```'
            tail -n 1 mypy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # `vermin-ci`, not `vermin`: that target redirects the report into temp/,
      # out of this log. Same flags, via $(VERMIN_FLAGS).
      #
      # Blocking needs a decision, not a cleanup, and not CI's. vermin.ini's
      # `targets = 3.8` matches `requires-python` (#2051), but vermin still
      # reports 3.11: `--no-parse-comments` ignores the `# novermin` markers on
      # compat.py's version-gated imports (`enum.StrEnum`,
      # `enum.show_flag_values`), and evaluated annotations put some
      # `pcapkit.foundation` modules at 3.9.
      - name: vermin
        continue-on-error: true
        run: |
          set +e
          make vermin-ci RUN= 2>&1 | tee vermin.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### vermin'
            echo '```'
            grep -E '^(Minimum required versions|Incompatible versions|Target versions not met):' vermin.log \
              || echo 'no verdict in output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # Last because it is by far the slowest, so the quick verdicts reach the
      # summary first.
      - name: pylint
        continue-on-error: true
        run: |
          set +e
          make pylint RUN= 2>&1 | tee pylint.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '### pylint'
            echo '```'
            printf 'messages by class (C/E/R/W):\n'
            grep -oE ': [A-Z][0-9]{4}:' pylint.log | grep -oE '[A-Z]' | sort | uniq -c || echo 'none'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
