name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      gate-only:
        description: >-
          Run only the single-version gate job instead of the full matrix.
          Callers that merely need a pass/fail verdict before shipping set
          this to true: the full matrix already runs once per commit from
          this workflow's own push and pull_request triggers, so running it
          again per caller tests the same commit several times over.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Only pull-request runs may be superseded. Keying every event on the ref (as
# this did) coalesces all of main's pushes into one group, and GitHub cancels a
# *pending* run whenever a newer one joins the group -- `cancel-in-progress:
# false` protects a run that has already started, never one still queued. Merging
# two PRs a minute apart therefore left the first commit with no unit tests at
# all: measured on run 34970682137 for e0f0160a3, which finished `cancelled` with
# zero jobs one second after the next push's run was created. Keying non-PR
# events on the run id gives each commit its own group.
#
# `github.workflow` is the *caller's* workflow name inside a called workflow, and
# `github.run_id` is the caller's run id too, so the literal `unit-tests-` prefix
# is what stops a called run from sharing a group with the caller that invoked it
# -- if they shared one, the callee would sit pending behind its own caller and
# deadlock.
concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # `github.event_name` is NOT 'workflow_call' inside a called workflow --
    # the github context is inherited from the caller, so it reads
    # 'pull_request', 'push', 'schedule' or 'workflow_run'. Guarding on it (as
    # this workflow used to) therefore ran the whole matrix in every caller
    # and skipped the gate everywhere. An input is the only reliable way for a
    # reusable workflow to know how it was invoked.
    name: Python ${{ matrix.python-version }}
    if: ${{ inputs.gate-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version:
          # 3.15 deliberately excluded: ruleset 23497679's required checks
          # only cover 3.10-3.14, so a 3.15 leg here cannot block a merge and
          # was pure queue contention -- see python-compatibility.yml for its
          # (non-blocking, schedule-only) replacement.
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        # #1063: exactly one leg runs under coverage, so measuring it adds no
        # leg to the queue #1052 is cutting. 3.14 because it had the most
        # headroom under the 45-minute cap on main (15.6, 15.8 and 16.8 minutes
        # in runs 37393532176, 37392964804 and 37391296686, against 12.8-22.0
        # for the other four), and because coverage's sys.monitoring core,
        # which measures branches only from 3.14 on, is its cheapest tracer.
        include:
          - python-version: "3.14"
            coverage: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The DPKT extra is here so the tests gated on it (test_dpkt_unit.py,
      # test_misc.py, test_extraction.py, test_core.py) actually execute
      # instead of skipping -- see #729. It is a small, pure-Python
      # dependency (measured clean installs on 3.10-3.14), so it costs
      # nothing per leg and adds no new job or leg, unlike Scapy below.
      #
      # crypto (cryptography) and NGAP (pycrate) join it for the same reason,
      # covering two of #738's remaining gates -- HAS_CRYPTO (test_esp_unit.py,
      # 14 methods) and HAS_PYCRATE (test_ngap_unit.py, 10 methods), both plain
      # unit-tier. `cli` (emoji) is deliberately NOT added here: its only
      # HAS_EMOJI-gated tests are in tests/integration/test_cli_subprocess.py,
      # which this job ignores wholesale, so installing it here would unlock
      # nothing. cryptography is the one compiled wheel of the two; measured
      # clean installs on 3.10-3.14 (manylinux wheels, no build step). pycrate
      # is pure Python but its distribution is large (~238MB, see the NGAP
      # extra's comment in pyproject.toml) -- still cheap in wall time, just not
      # "a second" cheap.
      #
      # PyPCAPFile (pypcapfile) is deliberately NOT here. It used to be kept off
      # every job in this file: on 3.10/3.11 (where its
      # `python_version < '3.12'` marker lets it install), installing it turned
      # 7 of the 10 HAS_PYPCAPFILE-gated methods this comment used to count
      # into failures, against a real bug in pcapkit/toolkit/pypcapfile.py's
      # handling of pypcapfile 0.12.0's `IP.src`/`IP.dst`. #743 and #746 fixed
      # that bug, and #751 gave the now-safe extra a home: the dedicated
      # `engine-tests` and `pypcap-parity` jobs below install it (15
      # HAS_PYPCAPFILE-gated methods between them), deliberately apart from
      # this job rather than added to it -- see either job's own comment for
      # why.
      - name: Install package and test dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[test,DPKT,crypto,NGAP]'

      # 7.10 is the first release with `[run] patch = ["subprocess"]`, which
      # .github/coverage.toml relies on to measure the xdist workers.
      - name: Install coverage
        if: ${{ matrix.coverage }}
        run: python -m pip install 'coverage>=7.10'

      # `-n auto` resolves to whatever this runner reports, and nothing else in
      # the log says what that was -- print it so the number `-n auto` picked
      # is a measured fact instead of an assumption about runner size.
      - name: Report available parallelism
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"

      - name: Run unit tests
        id: tests
        # `--dist load` is pinned explicitly rather than left to default: a
        # future change to xdist's own default, or someone "optimising" to
        # `loadfile`/`loadscope`, cannot silently change how this suite is
        # distributed. The coverage leg runs the identical selection.
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          set -- -q -n auto --dist load \
            --ignore=tests/integration \
            --ignore-glob='*_runtime.py' \
            --ignore-glob='*_regression.py'
          if [ "$COVERAGE" = "true" ]; then
            python -m coverage run --rcfile=.github/coverage.toml -m pytest "$@"
          else
            python -m pytest "$@"
          fi

      # The table goes to the job summary. The numbers also go to an artifact
      # that coverage-comment.yml renders as a PR comment once this run
      # completes; that comment cannot be posted from here, because this file is
      # also a reusable workflow and its callers grant only `contents: read`.
      # `!cancelled()` so a failing test still reports what it measured, and
      # says the tests failed in the first line.
      - name: Report coverage
        if: ${{ !cancelled() && matrix.coverage }}
        shell: bash
        env:
          SHA: ${{ github.sha }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          python -m coverage combine --rcfile=.github/coverage.toml
          python -m coverage report --rcfile=.github/coverage.toml
          python -m coverage html --rcfile=.github/coverage.toml -d coverage-html
          python -m coverage json --rcfile=.github/coverage.toml -o coverage.json
          mkdir -p coverage-comment
          # Writes the numbers as JSON for coverage-comment.yml, which renders
          # its own Markdown from them rather than posting text from this run.
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, os
          data = json.load(open('coverage.json'))
          keys = ('num_statements', 'missing_lines', 'num_branches', 'num_partial_branches',
                  'covered_lines', 'covered_branches')
          packages = collections.defaultdict(collections.Counter)
          for path, info in data['files'].items():
              parts = path.split('/')
              name = '/'.join(parts[:2]) if len(parts) > 2 else 'pcapkit (top level)'
              packages[name].update({k: info['summary'][k] for k in keys})
          def pct(c):
              total = c['num_statements'] + c['num_branches']
              return 100.0 * (c['covered_lines'] + c['covered_branches']) / total if total else 100.0
          rows = [[name, c['num_statements'], c['missing_lines'], c['num_branches'],
                   c['num_partial_branches'], round(pct(c), 2)] for name, c in sorted(packages.items())]
          total = round(data['totals']['percent_covered'], 2)
          tests = os.environ['TESTS_OUTCOME']
          json.dump({'total': total, 'tests': tests, 'packages': rows},
                    open('coverage-comment/coverage-summary.json', 'w'))
          status = '' if tests == 'success' else f' -- **tests {tests}**, so this is partial'
          print(f"**Coverage: {total:.2f}%**{status} (unit tier, Python 3.14, `{os.environ['SHA'][:9]}`)")
          print()
          print('| Package | Statements | Missed | Branches | Partial | Cover |')
          print('|---|--:|--:|--:|--:|--:|')
          for row in rows:
              print('| `{}` | {} | {} | {} | {} | {:.2f}% |'.format(*row))
          print()
          print('Per-file detail: the `coverage-html` artifact of this run.')
          PY

      - name: Upload coverage HTML report
        if: ${{ !cancelled() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 30

      - name: Upload coverage summary
        if: ${{ !cancelled() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage-comment/coverage-summary.json
          retention-days: 7

  integration:
    name: Integration Python ${{ matrix.python-version }}
    if: ${{ inputs.gate-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version:
          # See the `test` job above for why 3.15 is excluded here.
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The Scapy extra is there for examples/generators/pcap.py and legacy.py,
      # which build their captures with scapy; examples/generators/pcapng.py needs
      # nothing beyond the standard library and pcapkit itself, which it uses to
      # parse each fixture back. DPKT joins it so the two dpkt-gated methods
      # living under tests/integration/ (test_engine_parity.py,
      # test_engine_runtime.py) actually run here instead of skipping -- see
      # #729; same reasoning as the `test` job above.
      #
      # `cli` (emoji) joins it for one of #738's remaining gates. This job's
      # selection (tests/_tiers.py's fixture_tier_paths()) always includes the
      # whole of tests/integration/ -- which is where every HAS_EMOJI-gated
      # method lives (test_cli_subprocess.py, 14 methods). `crypto` and `NGAP`
      # are deliberately NOT added here: test_esp_unit.py and test_ngap_unit.py
      # are plain unit-tier and never enter this job's selection, so installing
      # cryptography/pycrate here would unlock nothing -- they are already
      # covered, across all five Python versions, by the `test` job above.
      # PyPCAPFile is NOT added here either, even though this job's selection
      # also reaches test_new_engine_parity_runtime.py's 6 HAS_PYPCAPFILE
      # methods -- see the `test` job's comment above for the bug that used to
      # make installing it here a regression, now fixed by #743/#746. #751's
      # `pypcap-parity` job below covers those 6 methods instead, on the same
      # fixture-tier selection as this job but in a venv of its own.
      - name: Install package, test and generator dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[test,Scapy,DPKT,cli]'

      # `shell: bash` rather than the default, because it runs with -o pipefail:
      # without it the `tee` below would swallow the generator's exit status.
      - name: Regenerate sample captures
        shell: bash
        run: |
          # Keep a failure here legible as what it is -- the fixtures could not
          # be built, so no test has run yet and nothing is wrong with the code
          # under test.
          if ! python examples/generators/make_samples.py 2>&1 | tee "$RUNNER_TEMP/make-samples.log"; then
            echo "::error title=Sample fixture generation failed::examples/generators/make_samples.py could not rebuild examples/captures/. This is a fixture-generation failure, not a test failure -- the test suite has not run."
            exit 1
          fi

          # examples/generators/pcapng.py fetches two captures from the Wireshark
          # repository and synthesises stand-ins when the download fails. The
          # stand-ins parse, and tests/protocols/test_pcapng_regression.py only
          # asserts that extraction succeeds, so a degraded run goes green and
          # is otherwise indistinguishable from a clean one. Say which happened.
          if grep -q '(download unavailable)' "$RUNNER_TEMP/make-samples.log"; then
            echo "::warning title=Sample fixtures degraded::The upstream Wireshark captures were unreachable, so synthesised stand-ins were used. The PCAP-NG tier ran, but not against the upstream bytes."
            grep '(download unavailable)' "$RUNNER_TEMP/make-samples.log"
          else
            echo "Upstream Wireshark captures were used, matching their pinned SHA-256 digests."
          fi

      # See the `test` job above for why this step exists.
      - name: Report available parallelism
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"

      # The ``test`` job above already ran every unit-tier test for real, on this
      # same commit. Re-running them here (a bare ``pytest -q`` used to) bought
      # no signal and cost ~21.75 minutes per Python version -- ~130 minutes per
      # PR push across the matrix (see #715). So this selects only the
      # fixture-dependent tier plus the handful of unit-tier modules whose
      # capture read is skipped, not exercised, in the `test` job -- see
      # tests/_tiers.py's module docstring and fixture_tier_paths() for why a
      # module can be unit-tier by path and still belong here. The selection is
      # not spelled out as literal flags: it is asked of tests/_tiers.py
      # directly (FIXTURE_TIER_SELECTOR), so this step and that module cannot
      # drift the way two independent copies of the same list could.
      #
      # A failure to compute the selection intentionally does not fall back to
      # a bare `pytest -q` -- that would silently re-introduce the whole-suite
      # duplication this change exists to remove, with nothing in the log to
      # say so. `--dist load` is pinned explicitly; see the `test` job above
      # for why.
      - name: Run full test suite
        shell: bash
        run: |
          if ! selection=$(python -c "from tests._tiers import fixture_tier_paths; print(' '.join(fixture_tier_paths()))"); then
            echo "::error title=Could not compute the fixture-tier selection::tests._tiers.fixture_tier_paths() failed -- see the traceback above. Refusing to fall back to a bare 'pytest -q', which would silently re-run the entire suite instead of failing loudly."
            exit 1
          fi
          if [ -z "$selection" ]; then
            echo "::error title=Fixture-tier selection is empty::tests._tiers.fixture_tier_paths() returned nothing, which cannot be right -- tests/integration alone should always be part of it. Refusing to run pytest with no arguments."
            exit 1
          fi
          echo "Fixture-dependent selection: $selection"
          python -m pytest -q -n auto --dist load $selection

  # Per-engine coverage for the third-party capture engines -- rebuilt in #845
  # as a genuine two-dimension matrix (Python version x engine), replacing the
  # single "install everything, run the unit tier once per Python version" job
  # #751 landed. That shape had a real gap #845 measured on current `main`:
  # PyPCAPFile's own "python_version < '3.12'" marker (pyproject.toml) meant
  # editable-installing the old job's combined extras line silently resolved
  # PyPCAPFile to nothing for that extra on 3.12/3.13/3.14 (deliberately not
  # spelled out as the literal `pip install` form: tests/_dependency_gates.py's
  # job_sections() slices on `^  ([\w-]+):`, so a comment sitting between two
  # jobs is textually part of the one above it, and that guard's pytest_jobs()
  # requires exactly one such literal per job section -- a second one here,
  # even in a comment, makes it think this job has two install lines and
  # cannot tell which extras the run would have. See #845's cross-review.),
  # so "Engines Python 3.12/3.13/3.14" reported
  # green while never exercising PyPCAPFile at all on three of five legs --
  # yet all three were promoted to ruleset 23497679's required checks anyway
  # (finding 3), on the reasoning that the matrix rebuild would close finding
  # 2 rather than leaving it hidden behind a passing gate.
  #
  # The maintainer's own ruling (issue #845) is what sets this job's shape:
  # one leg per (Python version, engine) pair rather than one per Python
  # version installing every engine together, so a failure -- or a correctly
  # asserted decline -- names the one engine responsible instead of an
  # ambiguous "Engines Python 3.12". Each cell resolves to one of three
  # outcomes, tracked via the matrix's own `expect` field (defaulting to
  # `supported` for any (python, engine) pair not listed in `include` below):
  #
  #   * `supported`    -- the engine installs via its normal pyproject.toml
  #                        extra and its dedicated unit-tier tests must
  #                        actually pass, proving this engine ran.
  #   * `unsupported`  -- the engine is installable on this interpreter but
  #                        its own PYTHON_CEILING means it declines at run
  #                        time (PyShark on 3.14+; PyPCAPFile on 3.12+, whose
  #                        pip marker would otherwise stop it ever installing
  #                        here -- so this job installs the raw distribution
  #                        past that marker, deliberately, rather than via the
  #                        extra). The same test files run; their own
  #                        version-aware assertions (e.g.
  #                        PyPCAPFile's test_unsupported_reason_tracks_the_running_interpreter)
  #                        are what prove the decline actually fired and named
  #                        the interpreter, rather than merely skipping.
  #   * `not-installable` -- PyPCAP on 3.12+: a C-extension build failure, not
  #                        a runtime refusal (no wheel; pcap.c does not
  #                        compile against the 3.12+ C API -- PyPCAP carries
  #                        no PYTHON_CEILING at all, so there is no decline to
  #                        assert). This job still installs the raw
  #                        distribution past pyproject.toml's marker to prove
  #                        the failure is real rather than assumed, and treats
  #                        that failure as the expected, passing outcome for
  #                        the cell -- distinctly logged via `::notice`, never
  #                        silently green and never red for the wrong reason.
  #                        If it ever starts building, the job fails loudly
  #                        (see the install step) rather than reporting a
  #                        vacuous pass.
  #
  # Scoped deliberately out of this rebuild: the "and integ, if any" half of
  # the ruling. DPKT and PyShark also have integration-tier coverage
  # (tests/integration/test_engine_parity.py, test_engine_runtime.py) and
  # PyPCAP has tests/foundation/engines/test_new_engine_parity_runtime.py, but
  # all three need example captures regenerated first (examples/generators/),
  # which itself needs Scapy and DPKT together -- awkward to do per single-
  # engine cell without installing engines this job is deliberately keeping
  # apart. That tier stays covered in aggregate by the `integration` and
  # `pypcap-parity` jobs above rather than being duplicated per engine here;
  # worth the maintainer's separate call if per-engine integration coverage is
  # wanted too.
  #
  # Also scoped out: the multi-engine HAS_RUNTIME gate
  # (tests/foundation/engines/test_runtime_engines.py) that the old job
  # exercised as a side effect of installing DPKT+Scapy+PyShark together, and
  # the incidental crypto/NGAP/vendor coverage (#738) the old job carried on
  # this leg because it happened to be the one non-required-check job touching
  # every Python version. Splitting by engine removes the "everything
  # installed at once" venv those relied on; both are pre-existing coverage
  # this rebuild does not restore, and are unaffected by anything already
  # required, but are worth the maintainer's attention -- not silently
  # dropped, but not solved here either.
  #
  # `include` only needs to name the cells that are NOT `supported`; every
  # other (python-version, engine) pair defaults to it, per the install step's
  # `${EXPECT:-supported}`.
  engine-tests:
    name: Engines Python ${{ matrix.python-version }} (${{ matrix.engine }})
    if: ${{ inputs.gate-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 3.15 is experimental-prerelease per #845's ruling: present so a
    # regression is visible, but never blocking -- a failure on this leg
    # reports without failing the run or the required-check set.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        engine:
          - DPKT
          - Scapy
          - PyShark
          - PyPCAPFile
          - PyPCAP
          - PCAP_CT
        include:
          # PyShark's PYTHON_CEILING (pcapkit/foundation/engines/pyshark.py)
          # is (3, 14): no pip marker stops it installing here, it just
          # declines once constructed.
          - { python-version: "3.14", engine: PyShark, expect: unsupported }
          - { python-version: "3.15", engine: PyShark, expect: unsupported }
          # PyPCAPFile's PYTHON_CEILING is (3, 12) -- see
          # pcapkit/foundation/engines/pypcapfile.py. Its own pyproject.toml
          # marker ("python_version < '3.12'") is exactly what #845 finding 2
          # is about: it stops the extra installing here at all, which is why
          # the install step below reaches for the raw distribution on these
          # four legs instead.
          - { python-version: "3.12", engine: PyPCAPFile, expect: unsupported }
          - { python-version: "3.13", engine: PyPCAPFile, expect: unsupported }
          - { python-version: "3.14", engine: PyPCAPFile, expect: unsupported }
          - { python-version: "3.15", engine: PyPCAPFile, expect: unsupported }
          # PyPCAP carries no PYTHON_CEILING -- pyproject.toml's own
          # "python_version < '3.12'" marker is the only thing that keeps pip
          # from attempting the build here, because the build itself fails
          # (no wheel; pcap.c does not compile against the 3.12+ C API).
          - { python-version: "3.12", engine: PyPCAP, expect: not-installable }
          - { python-version: "3.13", engine: PyPCAP, expect: not-installable }
          - { python-version: "3.14", engine: PyPCAP, expect: not-installable }
          - { python-version: "3.15", engine: PyPCAP, expect: not-installable }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # setup-python does not ship a 3.15 interpreter as a release build
          # yet; python-compatibility.yml's compatibility-nightly job already
          # established that 3.15 needs this flag to resolve at all.
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
          cache: pip

      # Only the engines that need a system package get one, rather than
      # installing tshark/libpcap/a C toolchain on every cell regardless of
      # which engine it is testing.
      #
      # tshark: PyShark is a wrapper around it and does no parsing of its
      # own -- see the debconf pre-seed note below for why the two apt lines
      # are shaped the way they are.
      #
      # libpcap0.8: PCAP_CT's ctypes loader calls find_library("pcap") at run
      # time; without it, PCAP_CT.unsupported_reason() degrades the engine to
      # the default parser instead of running it.
      #
      # build-essential + libpcap-dev: PyPCAP is the one engine that compiles
      # (pcap.c against libpcap's headers), on every leg -- including the
      # `not-installable` ones, deliberately, so that failure is a genuine
      # compile failure against the 3.12+ C API rather than merely "no
      # compiler was present to try".
      #
      # `timeout-minutes` bounds this step because an apt stall in it used to
      # eat the whole job. Per #974, on two docs-only PRs within forty minutes
      # a PCAP_CT cell fetched its InRelease metadata and then went silent for
      # 29m52s, until this job's own `timeout-minutes: 30` killed it -- which
      # surfaces as `cancelled`, and `cancelled` correctly fails the
      # `Required checks passed` gate, so an unrelated mirror turned a green
      # docs PR red. The other five PCAP_CT cells of that same run finished,
      # job and all, in 39-81 seconds.
      #
      # 20 minutes rather than the couple of minutes that bounding a stalled
      # mirror tightly would suggest, because the healthy tail here is
      # genuinely long. Across 12 runs (230 non-zero observations of this
      # step) p95 was 338s and the slowest *successful* run 508s, both on
      # PyShark cells; this change's own CI then produced a healthy 646s
      # PyShark run, so treat those figures as a floor on the tail rather
      # than its ceiling -- tshark plus wireshark-common is a large download
      # and archive.ubuntu.com's throughput varies enormously. A 5-minute cap
      # would have failed ~4% of healthy legs, which is a worse defect than
      # the one it fixes. 20 is ~1.9x the largest healthy run yet seen, and
      # was raised from an initial 15 on review: that 646s observation moved
      # the known maximum 27% on a single sample, and a bound sized at ~1.4x
      # a quantity still moving that much risks reproducing this very defect
      # at smaller scale -- a healthy-but-slow run killed and reported as a
      # step timeout, still blocking the pull request. 20 stays under both
      # job budgets (30 here, 45 on `pypcap-parity`), so the headroom is
      # free. A hang costs 20 minutes instead of 30 and
      # -- the actual win -- reports as this named step exceeding its timeout
      # rather than as an opaque job cancellation with no attributable cause.
      #
      # Deliberately *not* also passing `-o Acquire::Retries=3 -o
      # Acquire::http::Timeout=30`, which #974 proposed: both are already the
      # defaults in the apt that noble ships (verified in 2.8.3, the current
      # noble-updates version; 2.7.14's tarball is no longer in the pool --
      # `Retries(_config->FindI("Acquire::Retries", 3))` in
      # apt-pkg/acquire-item.cc, and `TimeOut(30)` in methods/basehttp.cc,
      # read back by `ConfigFindI("Timeout", TimeOut)` in methods/http.cc), so
      # passing them would change no behaviour while reading like protection
      # this step had gained. Their already being in force is also why the
      # stall ran to 29m52s instead of failing after 30s and three retries:
      # whatever hung is not something apt's data timeout governs, since that
      # value bounds each individual `select()` wait rather than the transfer
      # as a whole. Wrapping these invocations in `timeout` and retrying is no
      # safer at these numbers, because a legitimate 646s run cannot be told
      # from a stall inside any per-attempt budget short enough to be worth
      # retrying -- the step timeout below is the one guard that holds however
      # the hang is caused.
      - name: Install this engine's system packages
        timeout-minutes: 20
        run: |
          set -eu
          ENGINE="${{ matrix.engine }}"
          if [ "$ENGINE" = "PyShark" ]; then
            sudo apt-get update
            echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          elif [ "$ENGINE" = "PCAP_CT" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpcap0.8
          elif [ "$ENGINE" = "PyPCAP" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential libpcap-dev
          fi

      # `expect` decides not just the assertion but *how* the engine gets
      # installed: `supported` uses the ordinary pyproject.toml extra, whose
      # own marker (if any) already resolves to "install" on this Python
      # version; `unsupported` and `not-installable` install the raw
      # distribution directly, deliberately bypassing whichever marker would
      # otherwise have skipped it silently -- see this job's own comment
      # above for why that bypass is the point of this rebuild.
      #
      # `set +e` is scoped to the one install command whose failure is
      # sometimes expected, not to the baseline above it: upgrading pip
      # itself and editable-installing this repo's own `test` extra failing
      # is never expected on any cell (deliberately not spelled out as the
      # literal `pip install` form below -- see this job's own comment
      # earlier in this file, and tests/_dependency_gates.py's
      # job_sections()/pytest_jobs(), for why a second such literal in a
      # comment here would make that guard think this section holds two
      # baseline install lines), and running them unchecked used to mean a
      # broken base install on a `not-installable` cell read as "expected"
      # while the job had installed and run nothing at all (#845's
      # cross-review). They now run under this step's own explicit `set -eu`
      # below -- not "the shell's default", since GitHub's default for a
      # Linux `run:` step is plain `bash -e {0}` with no `pipefail`, and
      # this step never sets `shell: bash` to change that -- so either
      # failing aborts the step immediately and loudly.
      - name: Install package and this engine's dependency
        id: install
        run: |
          set -eu
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[test]'

          ENGINE="${{ matrix.engine }}"
          EXPECT="${{ matrix.expect }}"
          EXPECT="${EXPECT:-supported}"

          # RAW_PKGS is an array, not a string, so PCAP_CT's two-package case
          # ("pcap-ct libpcap") reaches pip as two argv entries rather than by
          # relying on unquoted word-splitting (shellcheck SC2086) -- quoting
          # the string form instead would hand pip one invalid "pcap-ct
          # libpcap" argument and break exactly that case.
          case "$ENGINE" in
            DPKT) EXTRA=DPKT; RAW_PKGS=(dpkt); IMPORT_NAME=dpkt ;;
            Scapy) EXTRA=Scapy; RAW_PKGS=(scapy); IMPORT_NAME=scapy ;;
            PyShark) EXTRA=PyShark; RAW_PKGS=(pyshark); IMPORT_NAME=pyshark ;;
            PyPCAPFile) EXTRA=PyPCAPFile; RAW_PKGS=(pypcapfile); IMPORT_NAME=pcapfile ;;
            PyPCAP) EXTRA=PyPCAP; RAW_PKGS=(pypcap); IMPORT_NAME=pcap ;;
            PCAP_CT) EXTRA=PCAP_CT; RAW_PKGS=(pcap-ct libpcap); IMPORT_NAME=pcap ;;
            *) echo "::error::unknown engine $ENGINE"; exit 1 ;;
          esac

          set +e
          if [ "$EXPECT" = "supported" ]; then
            output=$(python -m pip install -e ".[$EXTRA]" 2>&1)
          else
            output=$(python -m pip install "${RAW_PKGS[@]}" 2>&1)
          fi
          status=$?
          set -e
          echo "$output"

          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ] && [ "$EXPECT" != "not-installable" ]; then
            echo "::error title=$ENGINE failed to install on Python ${{ matrix.python-version }}::This cell expects '$EXPECT', which requires a successful install. pip exited $status."
            exit 1
          fi
          if [ "$status" -eq 0 ] && [ "$EXPECT" = "not-installable" ]; then
            echo "::error title=$ENGINE now installs on Python ${{ matrix.python-version }}::This cell is recorded as not-installable in this workflow's include: list (and in pyproject.toml's marker for $ENGINE). It installed cleanly -- update both rather than leaving this green for the wrong reason."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            # A not-installable cell's whole point is a genuine C-API compile
            # failure (see this job's own comment above), not a flaky index
            # or a dropped connection -- treating *any* nonzero exit as that
            # expected failure would let a PyPI 503 pass as though the
            # engine had been proven unbuildable. Grep the captured output
            # for the shape of a transient failure instead of a compile one.
            #
            # The transient list is pip's own retry/network vocabulary, not a
            # bare "5xx or 429" number scan: pip prints a "(NNN kB)" download
            # size on essentially every sdist fetch, and a Cython-generated
            # .c file runs to thousands of lines, so an unanchored bare-number
            # match (#845's cross-review) fires on ordinary download-size
            # lines and on compiler diagnostics quoting a line number in that
            # range -- e.g. "Downloading pypcap-1.3.0.tar.gz (500 kB)" and
            # "pcap.c:501:24: error: ..." both matched, while the actual
            # compile-failure markers matched nothing. A cell that hits that
            # false positive would exit 1 on a transcript no re-run can ever
            # change, so this is a loud, permanent false red, not a silent
            # one -- see this job's own comment on "fails loudly in both
            # directions" above for why that distinction still matters: a
            # loud false red still blocks every PR just as surely as a
            # silent false green would. Requiring the *absence* of a compile
            # marker alongside a transient one is the second half of the
            # fix: a message that happens to carry both is treated as the
            # compile failure it also is, not the transient one it merely
            # resembles.
            if echo "$output" | grep -qiE \
                 'read timed out|connection (reset|refused|aborted)|temporary failure in name resolution|max retries exceeded|could not fetch url|newconnectionerror|readtimeouterror|httpsconnectionpool|retrying \(retry\(|http error (5[0-9][0-9]|429)|status code 429|too many 429 error responses|no matching distribution found' \
               && ! echo "$output" | grep -qiE \
                 'failed building wheel|error: command .* failed with exit code|subprocess-exited-with-error'; then
              echo "::error title=$ENGINE's install failure looks transient, not a compile failure::pip exited $status, but the output matches a network/index failure pattern rather than the C-API compile failure this cell records as expected. Re-run the job rather than trusting this as a genuine 'not-installable' result."
              exit 1
            fi
            echo "::notice title=$ENGINE is not installable on Python ${{ matrix.python-version }} (expected)::pip exited $status, matching this cell's recorded expectation ('not-installable'), and the output does not match a transient-failure pattern. No tests run for this cell -- this is a deliberate skip, not a pass."
          fi

          # #845 finding 2, reproduced structurally rather than left to be
          # re-found by enumeration: a `supported` cell whose extra resolves
          # to nothing (an unmet environment marker, a typo'd extra name)
          # still exits 0, and every one of this cell's tests would then
          # skip rather than fail, going green having proven nothing. This
          # cell's own point is exercising $IMPORT_NAME, so require it.
          if [ "$status" -eq 0 ]; then
            if ! python -c "import $IMPORT_NAME" 2>/dev/null; then
              echo "::error title=$ENGINE installed but $IMPORT_NAME does not import on Python ${{ matrix.python-version }}::pip exited 0 but the module this cell exists to exercise is not importable -- a green install that unlocked nothing."
              exit 1
            fi
          fi

      # See the `test` job above for why this step exists.
      - name: Report available parallelism
        if: ${{ steps.install.outputs.status == '0' }}
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"

      # Runs the SAME test files whether `expect` is `supported` or
      # `unsupported`: the difference is not in what runs here but in what
      # those files themselves assert once they see this interpreter's
      # version, e.g. PyPCAPFile's own
      # test_unsupported_reason_tracks_the_running_interpreter and PyShark's
      # test_the_reason_tracks_the_running_interpreter (added for PyShark's
      # real-capture coverage) both branch on sys.version_info against the
      # engine's own PYTHON_CEILING.
      # That is what proves the decline actually fired and named the
      # interpreter, rather than this job asserting it from the outside.
      # Skipped entirely for `not-installable` cells -- see the install step.
      - name: Run this engine's test suite
        if: ${{ steps.install.outputs.status == '0' }}
        run: |
          set -eu
          ENGINE="${{ matrix.engine }}"
          case "$ENGINE" in
            DPKT) TEST_PATHS="tests/toolkit/test_dpkt_unit.py" ;;
            Scapy) TEST_PATHS="tests/toolkit/test_scapy_unit.py tests/foundation/engines/test_scapy_engine.py tests/protocols/transport/test_sctp_unit.py" ;;
            PyShark) TEST_PATHS="tests/toolkit/test_pyshark_unit.py tests/foundation/engines/test_pyshark_engine.py" ;;
            PyPCAPFile) TEST_PATHS="tests/toolkit/test_pypcapfile_unit.py tests/foundation/engines/test_pypcapfile_engine.py" ;;
            PyPCAP) TEST_PATHS="tests/toolkit/test_pypcap_unit.py tests/foundation/engines/test_pypcap_engine.py tests/foundation/engines/test_pcap_backend.py" ;;
            PCAP_CT) TEST_PATHS="tests/toolkit/test_pcap_ct_unit.py tests/foundation/engines/test_pcap_ct_engine.py tests/foundation/engines/test_pcap_backend.py" ;;
          esac
          echo "Running: $TEST_PATHS"
          python -m pytest -q -n auto --dist load $TEST_PATHS

  # Whether upstream PyPCAP is worth building in CI at all -- #751's own
  # instruction was "try to build and if the CI is not a good suit, then we
  # ripe it". This job is that attempt: a C toolchain plus libpcap headers, on
  # the two Python versions its own marker allows
  # ("pypcap; python_version < '3.12'", pyproject.toml:151). If a clean run of
  # this job's install step goes red -- not a flake -- the fix is deleting this
  # job and returning HAS_PYPCAP to
  # tests/_dependency_gates.DEPENDENCY_GATE_EXCLUSIONS with that run linked as
  # the reason, per the ruling.
  #
  # Kept apart from `engine-tests` above for two reasons: it needs a compiler
  # that job has no other reason to carry, and its `pcap` module would collide
  # with pcap-ct's if both were installed into the one venv (see
  # `engine-tests`'s own comment on that). The HAS_PYPCAP-gated module this job
  # targets, tests/foundation/engines/test_new_engine_parity_runtime.py, reads
  # generated captures (arp.pcap, tcp.pcap, ipv4.pcap -- its own module
  # docstring), so this mirrors the `integration` job's fixture-tier selection
  # and Scapy/DPKT/cli baseline rather than `test`'s ignore-shape one, and pays
  # that job's full run cost a second time on top -- accepted here rather than
  # discovered, since tests/_dependency_gates.py's guard has no cheaper of its
  # three known selection shapes for reaching one fixture-dependent module (see
  # that module's own docstring). The same module also carries 6 of
  # HAS_PYPCAPFILE's 15 gated methods, which come along for free once
  # PyPCAPFile is on this job's install line too.
  #
  # The matrix is deliberately just 3.10 and 3.11, not the full five: PyPCAP's
  # marker and PyPCAPFile's marker are both "python_version < '3.12'", so
  # 3.12-3.14 would install neither extra here and pay this job's full
  # fixture-tier run for zero new coverage.
  pypcap-parity:
    name: PyPCAP/PyPCAPFile parity Python ${{ matrix.python-version }}
    if: ${{ inputs.gate-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pypcap ships no wheel: it compiles pcap.c against libpcap, so both the
      # headers and the shared library have to be present before pip is asked
      # to build it.
      #
      # tshark joins them per #845's finding 1: this job installs pyshark and
      # its fixture-tier selection (see this job's own comment above) is the
      # only place tests/integration/test_engine_runtime.py's real
      # ``engine='pyshark'`` extraction is reachable at all --
      # `engine-tests`'s own selection ignores tests/integration and
      # *_runtime.py wholesale. Without tshark, PyShark.unsupported_reason()
      # declines the engine, the extractor silently falls back to the default
      # parser, and the test's assertions used to pass on that fallback's
      # output -- a vacuous pass, invisible in skip counts. The debconf
      # pre-seed and DEBIAN_FRONTEND mirror `engine-tests`'s "Install system
      # libpcap and tshark" step exactly, for the same reason: tshark's
      # postinst otherwise blocks on the "allow non-superusers to capture
      # packets" prompt.
      #
      # `timeout-minutes` for the reason #974 gives about `engine-tests`'s own
      # install step -- see the long note there, which this step shares
      # wholesale. It was never the leg that stalled, but it installs the
      # union of the packages that one does (build-essential, libpcap-dev and
      # tshark together) from the same mirrors with the same absence of any
      # bound, so the hazard is identical and fixing only the leg that
      # happened to bite would leave it here. The same 20 applies: this step's
      # slowest *successful* observed run was 405s, over a smaller sample (22)
      # than `engine-tests` gives, and its heavier package set should if
      # anything tail longer than the 646s seen there.
      - name: Install libpcap headers, a C toolchain, and tshark
        timeout-minutes: 20
        run: |
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential libpcap-dev tshark

      - name: Install package, test and generator dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[test,Scapy,DPKT,cli,PyShark,PyPCAP,PyPCAPFile]'

      # See the `integration` job above for why this step is shaped the way it
      # is.
      - name: Regenerate sample captures
        shell: bash
        run: |
          if ! python examples/generators/make_samples.py 2>&1 | tee "$RUNNER_TEMP/make-samples.log"; then
            echo "::error title=Sample fixture generation failed::examples/generators/make_samples.py could not rebuild examples/captures/. This is a fixture-generation failure, not a test failure -- the test suite has not run."
            exit 1
          fi

          if grep -q '(download unavailable)' "$RUNNER_TEMP/make-samples.log"; then
            echo "::warning title=Sample fixtures degraded::The upstream Wireshark captures were unreachable, so synthesised stand-ins were used. The PCAP-NG tier ran, but not against the upstream bytes."
            grep '(download unavailable)' "$RUNNER_TEMP/make-samples.log"
          else
            echo "Upstream Wireshark captures were used, matching their pinned SHA-256 digests."
          fi

      # See the `test` job above for why this step exists.
      - name: Report available parallelism
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"

      # See the `integration` job above for why this is asked of
      # tests/_tiers.py directly rather than spelled out as literal flags.
      - name: Run full test suite
        shell: bash
        run: |
          if ! selection=$(python -c "from tests._tiers import fixture_tier_paths; print(' '.join(fixture_tier_paths()))"); then
            echo "::error title=Could not compute the fixture-tier selection::tests._tiers.fixture_tier_paths() failed -- see the traceback above. Refusing to fall back to a bare 'pytest -q', which would silently re-run the entire suite instead of failing loudly."
            exit 1
          fi
          if [ -z "$selection" ]; then
            echo "::error title=Fixture-tier selection is empty::tests._tiers.fixture_tier_paths() returned nothing, which cannot be right -- tests/integration alone should always be part of it. Refusing to run pytest with no arguments."
            exit 1
          fi
          echo "Fixture-dependent selection: $selection"
          python -m pytest -q -n auto --dist load $selection

  # GitHub issue #981: two test modules
  # (tests/protocols/application/test_http_unit.py and
  # tests/test_base_class_contract.py) each pass alone, and pytest -- the
  # runner every job above uses -- reports the combined run green, while
  # plain unittest over the same two modules in one process fails four
  # subTest cases. pytest-subtests is not why -- it is not even installed in
  # this project (absent from the `test` extra in pyproject.toml), and plain
  # pytest already reports a failed subTest as its own top-level SUBFAILED
  # entry rather than folding it into a passing parent. The real cause is
  # tests/conftest.py's autouse restore_module_table fixture, which
  # reconciles the cross-module pcapkit reimport pollution #981 is about --
  # but only under pytest, since plain unittest never loads conftest.py at
  # all. Every job above runs under pytest, so that reconciliation is why
  # none of them can see this shape of defect -- invisible by construction
  # once the fixture is doing its job, not by oversight. This job exists
  # solely to make that visible, by using a different test *runner* --
  # unittest.TextTestRunner -- that never loads conftest.py and so never
  # gets the reconciliation that hides the defect from pytest.
  #
  # A cheaper, narrower alternative: `pytest --noconftest` over just those two
  # modules, in that order, disables that same autouse fixture directly and
  # reproduced the identical four subTest failures in about 70s on the pre-fix
  # tree, under the pytest this CI already installs. Whether that single
  # invocation would have been sufficient instead of this dedicated job and its
  # per-directory matrix was not evaluated when this job was written --
  # recorded here rather than justified after the fact; see
  # util/run_unittest_leg.py's own docstring for the fuller version of both
  # this and the paragraph above.
  #
  # util/run_unittest_leg.py (its own docstring has the full reasoning) runs
  # one tests/ subdirectory per matrix cell (for protocols, one shard of it,
  # see #1029 below), paired with every root-level
  # tests/test_*.py module, directory first and root second -- the order
  # #981's own reproduction needs, since the defect is an earlier module
  # polluting a later one. Running the whole suite in one process is not an
  # option (it OOMs at 29 GB on the machine this was diagnosed on); a matrix
  # of one leg per top-level directory (protocols, since #1029, being two
  # cells) is the affordable approximation, and it
  # is sized for wall time rather than for memory. Peak RSS was measured for
  # the three cheapest legs only -- cli 152 MiB, dumpkit 237 MiB, interface
  # 305 MiB (resource.getrusage on RUSAGE_CHILDREN, this venv) -- leaving the
  # largest of the three some 90x short of 29 GB; no figure was taken for
  # tests/protocols, the largest leg. Measured wall times (this venv, serial):
  # cli 18s, const 268s, dumpkit 39s, foundation 272s, interface 38s, project
  # 70s, protocols 847s (before the #1029 split), toolkit 97s, utilities 42s,
  # vendor 104s, one leg per
  # matrix cell -- see `timeout-minutes` below for why the job-level budget is
  # no longer 20.
  #
  # GitHub issue #1029: the protocols cell measured 30.4 minutes on a CI
  # runner against this job's 45-minute cap (#1029 measured the next slowest
  # leg at 6.2 minutes on CI), so it is now two cells: `protocols/internet` and the rest of
  # tests/protocols (its other five subdirectories and the modules sitting
  # directly in it), the latter expressed as `protocols` with
  # `--exclude protocols/internet`. run_unittest_leg.py takes a sub-path and
  # repeatable --exclude for this; every other cell is untouched.
  #
  # Measured on CI (GitHub Actions wall time per cell, one unit throughout):
  #
  #   leg                  run 37334173854     run 37341197811
  #                        (#1031, unsharded)  (#1032, sharded)
  #   protocols            27.8m               -
  #   protocols/internet   -                   8.2m
  #   protocols (rest)     -                   7.6m
  #   foundation (control) 6.2m                6.4m
  #   const (control)      6.0m                6.1m
  #
  # The baseline is 27.8m from a same-hour run, deliberately not #1029's
  # headline 30.4m (its quiet-runner re-run, taken after a window of
  # cancelled runs). The controls moved by 0.1-0.2m between the two runs, so
  # the runners compare. Two cells rather than three because these already
  # balance (8.2m against 7.6m) and the next slowest unsharded leg is
  # foundation at 6.4m: a third cell could save under two minutes of wall time
  # and would cost more co-running module pairs. No local per-module timings
  # are recorded here; the figure above is the one that matters, and the
  # pre-#1029 local serial table above is left as it was measured.
  #
  # What sharding costs: modules in different cells no longer share a process,
  # so pollution from one to the other is invisible again. Counts below were
  # derived with leg_modules() on main at 30714cd51 plus this change: 51
  # modules in tests/protocols (12 under internet, 39 in the rest, of which 10
  # sit directly in tests/protocols). "Pairs" are unordered, C(n,2), since a
  # single serial run realises each pair in one order. Before: 1275 pairs
  # co-ran in one process. After: 807 (internet x internet 66, rest x rest
  # 741); 468 do not. The 255 pairs of a protocols module followed by a
  # root-level module (51 x 5 roots) all survive, since every cell still runs
  # the root modules after its own. The 10 modules sitting directly in
  # tests/protocols stay in the rest cell: moving them into internet would keep
  # 637 pairs instead of 807 and lengthen internet, the slower cell already.
  #
  # tests/vendor was first left out of ``leg`` because running it this way
  # surfaced an instance of the very defect this job exists to catch (issue
  # #985): a stale VendorRuntimeWarning generation made assertWarnsRegex fail
  # in tests/vendor/test_vendor_snapshot_restore_unit.py. That was fixed by
  # re-resolving the class fresh per test, so the directory is now a leg (297
  # tests in the leg, 118 of them tests/vendor's own, measured on this venv).
  #
  # Two directories are deliberately absent from ``leg``, for reasons that
  # are not this job's to fix:
  #
  #   * tests/corekit -- already known and already accepted, not a new
  #     finding. tests/_support.py's own purge_modules() docstring measures
  #     and documents exactly this: "python -m unittest discover -s
  #     tests/corekit fails 5 of that class's identity subtests, because
  #     test_module sorts first and purges". pytest is "the supported
  #     runner" for precisely this reason -- tests/conftest.py's autouse
  #     restore_module_table fixture reconciles the module-identity drift
  #     that plain unittest has no way to see coming. Running this leg
  #     against tests/corekit would be permanently red for a characteristic
  #     the suite's own documentation already treats as expected, not a
  #     regression this job would be reporting.
  #   * tests/integration -- needs generated captures this script does not
  #     build, and is already run whole, under pytest, by the `integration`
  #     job above. The exclusion lives here, in this matrix, and nowhere else:
  #     util/run_unittest_leg.py does not refuse the directory, it collects
  #     nothing from it. tests._tiers.is_unit_tier() rejects all 12 of its
  #     test_*.py files, so leg_modules('integration') returns an empty tuple
  #     and the leg would run the root-level modules alone -- green, while
  #     covering none of tests/integration. Adding it back here would buy that
  #     nothing, not a failure.
  #
  # Not added to ``required-checks`` below: a brand-new job earns a place in
  # the required set once its own track record justifies it, which is the
  # maintainer's call to make separately from landing it.
  unittest-ordering:
    name: Plain unittest ordering (${{ matrix.label || matrix.leg }})
    if: ${{ inputs.gate-only != true }}
    runs-on: ubuntu-latest
    # 45, not 20: `timeout-minutes` is job-level, so it has to cover
    # checkout/setup/install (~39s) as well as the leg itself, and this is
    # the only test job in this file with no xdist underneath it, so its
    # protocols leg (847s serial, measured above) carries the full cost
    # alone. A review pass measured medium legs at 1.22-1.31x that figure on
    # a contended machine, putting protocols at 17-18.5 minutes, and one
    # contended run of it hit 1275s outright -- over the old 20-minute cap.
    # 45 matches the `test`/`integration`/`pypcap-parity` jobs' own cap
    # rather than inventing a new number (`engine-tests` is 30, but runs
    # under xdist, which this job deliberately does not). 45 did stop fitting
    # comfortably (#1029: protocols at 30.4 minutes on CI), so `protocols` is
    # now split into sub-legs, as foreseen -- see the matrix comment above. The
    # cap is left at 45: CI measured the slowest cell, protocols/internet, at
    # 8.2m (run 37341197811), so even a slowdown like #1029's window leaves it
    # far inside the cap: that window's runs were cancelled at 45.3m or more,
    # so it ran at least 45.3/27.8, about 1.6x (a lower bound, the runs were
    # cut off), which would put the 8.2m cell near 13m. Lowering the cap
    # would only trade headroom for a tighter timeout. Raising it to 60
    # instead was the one-line alternative; it would have kept every
    # cross-module pair co-running but left the slowest cell at 28 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg:
          - cli
          - const
          - dumpkit
          - foundation
          - interface
          - project
          - protocols/internet
          - toolkit
          - utilities
          - vendor
        include:
          # The remainder of tests/protocols -- see the #1029 note above.
          - leg: protocols
            exclude: --exclude protocols/internet
            label: protocols (rest)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # DPKT/crypto/NGAP join `test` for the same reason the `test` job above
      # installs them: this leg's root-level modules and its own directory's
      # modules both reach gates that would otherwise skip silently rather
      # than run.
      - name: Install package and test dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[test,DPKT,crypto,NGAP]'

      - name: Report available parallelism
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"

      - name: Run tests/${{ matrix.leg }} and the root-level modules under plain unittest
        run: python util/run_unittest_leg.py ${{ matrix.leg }} ${{ matrix.exclude }}

  # ``CHANGELOG.md`` is generated from the newest entry under
  # ``docs/source/changelog/`` by ``util/changelog_md.py``, so it falls out of step
  # the moment an entry is edited without regenerating it. That is worth its own
  # job rather than leaving it to review, because ``Create Release`` feeds the file
  # to the GitHub Release body: a drifted copy is not merely wrong in the tree, it
  # is published.
  #
  # Deliberately *not* gated on ``gate-only``, unlike the four jobs above
  # (`test`, `integration`, `engine-tests`, `pypcap-parity`), and that is the
  # point of putting it here at all. ``create-release.yml`` calls this
  # workflow as its release gate, so an ungated job runs on the release path and
  # the release body cannot be built from a file that has drifted. The matrix is
  # skipped per caller because it is expensive and already ran for the commit;
  # this is neither expensive nor covered elsewhere on that path.
  #
  # ``tests/project/test_changelog_md.py`` asserts the same identity, so the
  # matrix covers it too -- but that test ``skipTest``s when either file is
  # absent, and reports a mismatch as two 17 KB strings. ``--check`` cannot skip,
  # exits 1 when the file is missing, and prints a unified diff.
  changelog:
    name: Changelog drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # No install step: the generator imports argparse, difflib, pathlib, re, sys
      # and typing and nothing else, so it runs against a bare interpreter.
      # Verified with ``python -S``.
      - name: Check CHANGELOG.md is in step with its source entry
        shell: bash
        run: |
          if ! python util/changelog_md.py --check; then
            echo "::error title=CHANGELOG.md has drifted::CHANGELOG.md is generated from the newest entry under docs/source/changelog/ and no longer matches it. Regenerate it with 'python util/changelog_md.py' and commit the result. The unified diff above shows what moved."
            exit 1
          fi

  # The verdict a shipping workflow asks for: the full suite, fixtures and
  # all, on one interpreter. It is deliberately not the matrix -- the matrix
  # has already run against this very commit, from this workflow's own push or
  # pull_request trigger, before anything reaches a release path.
  gate:
    name: Gate (full suite, Python 3.14)
    if: ${{ inputs.gate-only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # DPKT joins Scapy here for the same reason as the `integration` job
      # above -- this is the full, unfiltered suite, so it is the one place
      # where skipping the dpkt-gated tests would be most misleading. crypto,
      # cli and NGAP join it for the same reason and cover the three of #738's
      # remaining gates this change fixes, since an unfiltered `pytest` run (no
      # --ignore, no tier selection) reaches every one of them regardless of
      # which tier they live in -- unlike the `test` and `integration` jobs
      # above, which each cover only the subset their own selection reaches.
      # PyPCAPFile is deliberately NOT added here -- see the `test` job's
      # comment above for the bug that used to make installing it a
      # regression, now fixed by #743/#746. This job runs on 3.14 only, where
      # PyPCAPFile's marker resolves to nothing regardless, so adding it here
      # would be a no-op that misleadingly suggests the extra is exercised by
      # `gate`; #751's `engine-tests` and `pypcap-parity` jobs cover it for
      # real, on the 3.10-3.14 (and 3.10-3.11) legs where it actually installs.
      - name: Install package, test and generator dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[test,Scapy,DPKT,crypto,cli,NGAP]'

      # See the integration job above for why this step is shaped the way it is.
      - name: Regenerate sample captures
        shell: bash
        run: |
          if ! python examples/generators/make_samples.py 2>&1 | tee "$RUNNER_TEMP/make-samples.log"; then
            echo "::error title=Sample fixture generation failed::examples/generators/make_samples.py could not rebuild examples/captures/. This is a fixture-generation failure, not a test failure -- the test suite has not run."
            exit 1
          fi

          if grep -q '(download unavailable)' "$RUNNER_TEMP/make-samples.log"; then
            echo "::warning title=Sample fixtures degraded::The upstream Wireshark captures were unreachable, so synthesised stand-ins were used. The PCAP-NG tier ran, but not against the upstream bytes."
            grep '(download unavailable)' "$RUNNER_TEMP/make-samples.log"
          else
            echo "Upstream Wireshark captures were used, matching their pinned SHA-256 digests."
          fi

      # See the `test` job above for why this step exists.
      - name: Report available parallelism
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"

      # Deliberately still the whole suite, unlike the `integration` job above:
      # this is the shipping gate's own independent re-verification (see the
      # job comment above), not the same accidental duplication #715 measured
      # for `integration`. `gate` does not run per PR push -- only via
      # `create-release.yml`'s `gate-only: true` -- so it is not part of the
      # ~130 minutes/push #715 measured, and partitioning it would trade away
      # the "trust nothing, re-run everything" property this job exists for.
      # Whether `gate` should run at all on a commit the matrix already
      # covered is #715's separate item 2 ("stop the gate re-running on main
      # pushes"), a trigger-frequency question, not a selection one -- out of
      # scope here. `--dist load` is pinned explicitly; see the `test` job
      # above for why.
      - name: Run full test suite
        run: python -m pytest -q -n auto --dist load

  # Ruleset 23497679's required_status_checks names 22 exact contexts: five
  # each for `test` and `integration`, five for `Compat Python 3.10`-`3.14`
  # (live -- emitted by the `compatibility` job in
  # `.github/workflows/python-compatibility.yml`, on the same push/
  # pull_request triggers as this file, confirmed by reading that file --
  # NOT stale, and NOT something a `needs:` in this file could ever cover,
  # since a job cannot depend on a job in a different workflow file), five
  # for the old single-cell `Engines Python <version>` name that
  # `engine-tests` stopped producing once it became a Python x engine matrix
  # (the only five of the 22 that are genuinely dead), and two for
  # `pypcap-parity`. GitHub rulesets match check names literally and support
  # no wildcard, so the required list has to be hand-edited regardless -- to
  # drop the five dead `Engines Python <version>` names and to either
  # re-list every gating (3.10-3.14) `engine-tests` matrix cell name (30 of
  # them, growing or shrinking with the matrix) or replace that slot with
  # something that does not change shape when the matrix does. The
  # maintainer's ruling was the latter: one aggregate job that `needs:`
  # every gating job in *this* file, so the ruleset requires only this one
  # context in place of the `test`, `integration`, `Engines`, and
  # `pypcap-parity` slots (17 of the 22) -- the five live `Compat` names
  # stay required exactly as they are, since nothing here can stand in for
  # them.
  #
  # `if: ${{ always() && inputs.gate-only != true }}` and the explicit
  # per-job check below are both required, not decorative:
  #
  #   * Without `always()`, this job would itself be *skipped* -- not
  #     failed -- the instant any job it `needs:` failed or skipped, per
  #     "Using jobs in a workflow" > "Defining prerequisite jobs": "If a job
  #     fails or is skipped, all jobs that need it are skipped unless the
  #     jobs use a conditional expression that causes the job to continue."
  #     And a skipped required check is not automatically a blocked merge:
  #     GitHub's own "Troubleshooting required status checks" page lists
  #     `skipped` alongside `success` and `neutral` as a *passing* check
  #     status, and its "Handling skipped but required checks" table says
  #     plainly that when "A job depends on a failed job", the result is
  #     "The dependent job is skipped and may not block merging" -- exactly
  #     the silently-worse-than-no-gate failure this job exists to prevent.
  #     That page's own recommended fix is this job's shape: "Use always()
  #     with needs for required checks that depend on other jobs."
  #   * `inputs.gate-only != true` mirrors the four jobs this needs: below.
  #     They are all skipped by their own `if:` whenever this workflow is
  #     called with `gate-only: true` (from create-release.yml), so without
  #     this guard every needs.*.result below would read `skipped` on that
  #     path and this job would report a spurious failure -- on a release
  #     call, not a PR, which is not where ruleset 23497679 applies anyway.
  #   * The check itself inspects every dependency explicitly and prints each
  #     one's result before failing, so a red run names which leg broke
  #     instead of leaving that to be re-discovered from the four jobs' own
  #     logs.
  #
  # Note for whoever adds a second caller of this reusable workflow: under
  # `workflow_call`, GitHub prefixes a called workflow's check names with the
  # calling job's own name (`<caller job> / Required checks passed`), which
  # would not match a ruleset entry naming just `Required checks passed`.
  # Harmless today -- `create-release.yml`'s only call passes
  # `gate-only: true`, which skips this job via the guard above before that
  # renaming would ever matter -- but a future caller that does NOT set
  # `gate-only: true` would produce a differently-named, unrequired check.
  #
  # Deliberately NOT `needs: gate`: `gate` only ever runs when this workflow
  # is called with `gate-only: true` and is otherwise skipped by its own
  # `if:`, so depending on it would leave this job permanently skipped on
  # every ordinary PR -- the one case this job has to actually gate.
  # `changelog` is deliberately left out too: it is a drift check, not one of
  # the 22 contexts this job replaces, and folding it in here would silently
  # widen what merging requires beyond what this job exists to cover -- the
  # maintainer's call to make separately, not something to sneak in.
  # `test`, `integration`, `engine-tests` and `pypcap-parity` are the four
  # jobs in this file whose names the 17 live/dead contexts above (all but
  # `Compat`) stand in for.
  #
  # `engine-tests`'s 6 `unsupported` and 4 `not-installable` cells are not a
  # gap here, even though "some matrix cells succeed and others decline"
  # sounds like it should risk a false red. It doesn't, because that job's
  # own install step (see its comment) deliberately exits 0 for a cell that
  # declined exactly as expected, and only skips that cell's own later
  # *steps* via a step-level `if:` -- so every legitimately-declined cell
  # still contributes `success` to `needs.engine-tests.result`, not
  # `skipped`.
  #
  # `engine-tests` also carries `continue-on-error: ${{ matrix.python-version
  # == '3.15' }}` (its own comment above explains why: 3.15 is experimental
  # per #845's ruling, and a failure there must report without failing the
  # run or the required-check set -- `python-compatibility.yml` states the
  # same policy for its own 3.15 job). Whether a genuine 3.15-cell failure
  # still surfaces as `failure` in `needs.engine-tests.result` here, or is
  # neutralised to `success` the same way `continue-on-error` neutralises the
  # *workflow run's* own conclusion, is NOT stated by GitHub's docs for jobs.
  # The `continue-on-error` reference has four sentences: one scoping the
  # flag to a single job, one about a failing job letting its matrix
  # siblings keep running, two about letting the *workflow run* pass
  # despite this job failing -- none of the four say anything about what a
  # sibling job's `needs.<job>.result` sees.
  # Suggestive, not conclusive, but the asymmetry favours caution: the
  # Contexts reference documents this exact neutralisation for *steps*
  # (`steps.<step_id>.conclusion` is defined as the step's result "after
  # `continue-on-error` is applied", explicitly distinct from `.outcome`,
  # which stays `failure`) and says nothing of the kind for
  # `needs.<job_id>.result`, which lists only
  # `success`/`failure`/`cancelled`/`skipped` with no `outcome`/`conclusion`
  # split at all -- documented where it applies to steps, silent where the
  # same question would apply to jobs. One could still argue `result` is
  # simply the job-level analogue of `conclusion` and behaves the same way;
  # that argument is evidence for that reading, not proof of it. Requiring
  # exactly `success` below therefore carries one open, unverified risk: if
  # the undocumented case resolves to `failure`, a 3.15-only engine regression
  # would turn this sole required context red and block every merge --
  # worse than the gate it replaces, and directly against #845's ruling that
  # 3.15 must never block.
  #
  # Two ways to remove the dependence on that undocumented behaviour
  # outright, both considered and neither taken here. Moving
  # `continue-on-error` from the job level down to the individual steps
  # inside `engine-tests` that can fail on a 3.15 leg would close the gap in
  # about two lines, but it changes what "non-blocking" means: a step-level
  # flag makes a failing 3.15 leg's *step* report `success` too, so the leg
  # reads green instead of red -- hiding the regression rather than merely
  # declining to block on it, which throws away the "a regression stays
  # visible" half of #845's ruling that the current job-level flag
  # preserves. Splitting the 3.15 legs into their own, non-`needs:`-ed job
  # keeps that visibility, but means duplicating this job's system-package
  # install, per-engine install logic, and test invocation -- measured at
  # 182 raw lines across those three steps, and GitHub Actions has no YAML
  # anchors to shrink that with -- into a second job immediately after #845
  # rebuilt this one, to close a single unverified edge. Flagging the risk
  # here instead: if a `required-checks` run ever goes red with only a 3.15
  # `engine-tests` leg failing underneath it, that is this exact gap and not
  # a genuine regression -- re-run to confirm, and revisit one of the two
  # options above then.
  #
  # Excepting that one flagged case, there is no other path in this workflow
  # where a real dependency legitimately reports anything other than
  # `success` on a PR run, so requiring exactly `success` below is otherwise
  # the accurate choice, not merely the cautious one. (GitHub's docs never
  # spell out how one matrix job's several instances collapse into the
  # single result a downstream `needs.<job>.result` sees; the reasoning
  # above is from how `engine-tests` itself is built, not from a documented
  # aggregation rule.)
  required-checks:
    name: Required checks passed
    needs: [test, integration, engine-tests, pypcap-parity]
    if: ${{ always() && inputs.gate-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check every required job succeeded
        run: |
          set -eu
          echo "test: ${{ needs.test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "engine-tests: ${{ needs.engine-tests.result }}"
          echo "pypcap-parity: ${{ needs.pypcap-parity.result }}"

          failed=0
          [ "${{ needs.test.result }}" = "success" ] || { echo "::error title=test did not succeed::result was '${{ needs.test.result }}', not 'success'."; failed=1; }
          [ "${{ needs.integration.result }}" = "success" ] || { echo "::error title=integration did not succeed::result was '${{ needs.integration.result }}', not 'success'."; failed=1; }
          [ "${{ needs.engine-tests.result }}" = "success" ] || { echo "::error title=engine-tests did not succeed::result was '${{ needs.engine-tests.result }}', not 'success'."; failed=1; }
          [ "${{ needs.pypcap-parity.result }}" = "success" ] || { echo "::error title=pypcap-parity did not succeed::result was '${{ needs.pypcap-parity.result }}', not 'success'."; failed=1; }

          if [ "$failed" -ne 0 ]; then
            echo "::error title=Required checks did not all succeed::One or more of test, integration, engine-tests, pypcap-parity did not report 'success' -- see the per-job lines above. A skipped or cancelled dependency is not a pass; see this job's own comment for why that distinction is the point of this job existing."
            exit 1
          fi
          echo "All required jobs reported success."
