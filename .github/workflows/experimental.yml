name: Experimental Tests

# The experimental tier (#1660): free-threaded CPython and GraalPy, one leg each,
# here and in no other workflow. #1732, the owner's option 2: nothing waits on
# these legs. They used to be legs of unit-tests.yml, first of `test` and then of
# a job of their own there, and either way the Unit Tests run stayed in progress
# until GraalPy finished, up to 140 minutes. Every `workflow_run` consumer of
# "Unit Tests" -- coverage-comment.yml, deploy-pages.yml, cron-vendor.yml and
# cron-conda.yml -- fires only once that run completes, so each waited too. A
# workflow of their own reports separately: no `workflow_run` names it, it has no
# `workflow_call` trigger, and a job cannot `needs:` one in another workflow.
#
# Its check names are the ones the legs had in unit-tests.yml, `Python <version>
# (experimental)`. No required context names one: ruleset 23497679 requires
# `Required checks passed` and the `Compat` legs alone.
#
# The same events as unit-tests.yml's own, and the same `changes` job, so a
# docs-only pull request skips the legs here as it skips `test` there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# #1903 has a newer commit supersede a run, a pull request's or a push to
# main's: nothing waits on these legs, so the newest commit is the one worth
# testing. #1938, the owner's choice: a superseded run is skipped or stopped,
# never cancelled, since GitHub counts a cancelled check against its commit and
# marks it red. So there is no `concurrency:` block at all: without
# `cancel-in-progress` a group still holds one pending run and cancels it once
# a newer one arrives (docs.github.com, "Control the concurrency of workflows
# and jobs"), and `queue: max` would hold a new commit's run behind the
# superseded one until that one stops. Instead `current` skips every other job
# of a run whose commit is superseded before it starts, and `Run unit tests`
# stops one superseded while its tests run; util/superseded.py holds the rule
# for both. A run whose commit stays current is unaffected.

jobs:
  # #1938: the gate. util/superseded.py's `check` asks the API whether this
  # run's commit is still the head of main or of its open pull request, and
  # writes `current`; any other event, or an API it cannot read, is current.
  # Every other job needs this one and skips where `current` is `false`, so a
  # superseded run's checks read `skipped`, which marks no commit red. Both
  # steps are `continue-on-error`, so a step's failure leaves `current` empty,
  # which runs the rest; each job's `if:` opens with `!cancelled()`, so a
  # failure of the job itself, which replaces the implicit `success()`, runs
  # the rest too.
  current:
    name: Check the commit is still current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.check.outputs.current }}

    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          sparse-checkout: |
            util/superseded.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Ask whether this run's commit is still current
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 util/superseded.py check

  # unit-tests.yml's job of the same name, reading the one output this file needs.
  python-versions:
    name: Read the Python versions
    needs: current
    if: ${{ !cancelled() && needs.current.outputs.current != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      experimental: ${{ steps.read.outputs.experimental }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/python-versions.toml
            util/python_versions.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read .github/python-versions.toml
        id: read
        run: python3 util/python_versions.py --github-output

  # unit-tests.yml's `changes`, whose comment says how a file is classified; the
  # script is the same, byte for byte (tests/project/test_sweeps_on_latest_only_1732.py
  # pins it). This workflow is never called, so its own pull_request run is every
  # pull_request run.
  changes:
    name: Classify changed files
    needs: current
    if: ${{ !cancelled() && needs.current.outputs.current != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 2

      - name: Classify the diff
        id: classify
        env:
          OWN_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          CODE_DIRS = ('.github/', 'pcapkit/', 'tests/', 'util/', 'examples/')

          def is_docs(path):
              if path.startswith(CODE_DIRS):
                  return False
              return path.startswith('docs/') or path.endswith('.md')

          code = 'true'
          if os.environ['OWN_PR'] != 'true':
              print("Not this workflow's own pull_request run: everything runs.")
          else:
              # -z: names are NUL-terminated, so a name holding whitespace
              # (or one git would otherwise quote) stays one path.
              diff = subprocess.run(['git', 'diff', '--name-only', '-z', '--no-renames', 'HEAD^1', 'HEAD'],
                                    capture_output=True, text=True)
              files = [path for path in diff.stdout.split('\0') if path]
              if diff.returncode != 0 or not files:
                  print(f'::warning title=Could not list the changed files::git diff exited {diff.returncode} '
                        f'with {len(files)} files: {diff.stderr.strip()}. Treating the diff as code.')
              else:
                  code_files = [path for path in files if not is_docs(path)]
                  print(f'{len(files)} changed files, {len(code_files)} of them code:')
                  for path in files:
                      print(f"  {'code' if path in code_files else 'docs'}  {path}")
                  if not code_files:
                      code = 'false'
          print(f'code={code}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as file:
              print(f'code={code}', file=file)
          PY

  # Its legs never block, by the KTLO mechanics: every step that can fail has
  # `continue-on-error: true`, so the job concludes success, and `Experimental
  # summary` reports each failed step as a warning. A failure no step contains
  # -- a lost runner -- fails the job, and its job-level `continue-on-error`
  # then passes the run: "Prevents a workflow run from failing when a job
  # fails" (docs.github.com, Workflow syntax, `jobs.<job_id>.continue-on-error`,
  # whose own example is an experimental matrix leg). Its check run still reads
  # `failure`, so the step-level guards stay for every failure a step can hold.
  #
  # A job past its `timeout-minutes` is cancelled (same page,
  # `jobs.<job_id>.timeout-minutes`), and the page does not say whether the
  # job-level guard covers that. So setup-python, the install and the tests
  # carry caps of their own, 5, 10 and 120 minutes, under the job's 140: a step
  # past its cap fails rather than cancels, and `continue-on-error` then applies
  # as to any failure (actions/runner src/Runner.Worker/StepsRunner.cs:322-353,
  # at 5f0b3ddcc). That leaves 5 minutes for the rest, which took at most 0.32,
  # setup-python included, on every uncovered leg of runs
  # 38569321543-38569522442.
  #
  # The tests' 120: GraalPy 25.4's tests step reached 26% of the unit tier's
  # tests at its old 25-minute cap (job 115915976024; setup-python took 0.7
  # minutes, the install 3.3). Those tests hold 20-26% of the tier's time, and
  # the tier less the round-trip sweeps, which this job never runs (see `Run
  # unit tests`), holds 3.5-4.5 times as much, by per-module times from a local
  # 3.14 run and the 3.14, 3.15 and 3.14t legs of run 38581834697: 88-113
  # minutes on GraalPy (estimate). 3.14t, which shares the caps, took 5.8
  # minutes over the whole unit tier in that run.
  #
  # #1740 gives GraalPy 3 workers, not 4, so at 4/3 of that time its tests should
  # take about 117-151 minutes (an inference from the 88-113, not measured),
  # past the 110-minute `timeout` in `Run unit tests`. GraalPy's leg may then end
  # on that timeout, which `Containment summary` reports as a warning: that is
  # expected, blocks nothing, and leaves the caps as they are.
  experimental:
    name: Python ${{ matrix.python-version }} (experimental)
    # #1938: `!cancelled()` so a failed `current` skips nothing, and then the
    # two results stand in for the implicit `success()` it replaces: a failed
    # `changes` or `python-versions` still skips the legs.
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.python-versions.result == 'success'
      && needs.current.outputs.current != 'false' && needs.changes.outputs.code != 'false' }}
    needs: [current, changes, python-versions]
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 140
    continue-on-error: true
    # #1938: `Run unit tests` reads the pull request, as `current` does.
    permissions:
      contents: read
      pull-requests: read
    # #1672: every annotation a failing step writes is a warning.
    env:
      ANNOTATION_LEVEL: warning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python-versions.outputs.experimental) }}

    steps:
      - uses: actions/checkout@v7
        id: checkout
        continue-on-error: true

      - uses: actions/setup-python@v7
        id: python
        continue-on-error: true
        timeout-minutes: 5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # As unit-tests.yml `test`'s install, for the same reasons.
      - name: Install package and test dependencies
        id: install
        if: ${{ steps.python.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          LEG: Python ${{ matrix.python-version }} (experimental, non-blocking)
        run: |
          python -m pip install -U pip setuptools wheel
          if ! python -m pip install -e '.[test,DPKT,crypto,NGAP]' 2>&1 | tee "$RUNNER_TEMP/pip-install.log"; then
            reason=$(sed -n 's/^ERROR: //p' "$RUNNER_TEMP/pip-install.log" | tail -n 1)
            if [ -z "$reason" ]; then reason="pip failed without an ERROR line; see this step's log"; fi
            echo "::${ANNOTATION_LEVEL} title=pcapkit did not install on ${LEG//,/%2C}::${reason//%/%25}. The rest of this leg is skipped."
            exit 1
          fi

      - name: Report available parallelism
        id: parallelism
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"

      # #1740: GraalPy's leg loses its runner 18-30 minutes into its tests ("The
      # runner has received a shutdown signal"), under a 120-minute cap. So every
      # 30 s this samples `free -m`, `df -h` of `/` and the workspace's volume,
      # /proc/loadavg and the five processes with the most RSS, each line led by
      # `[monitor]`, into $RUNNER_TEMP/resource-monitor.log. The sampler holds none
      # of this step's output: the runner kills a step's process tree 5 s after
      # its shell exits while a child still holds it (actions/runner
      # src/Runner.Sdk/ProcessInvoker.cs:485-505, at 796cc18ff). `Run unit tests`
      # follows the file into its own log instead, which is the evidence a lost
      # runner leaves: once it has the shutdown signal, the runner evaluates no
      # later step's condition, `always()` included (src/Runner.Worker/StepsRunner.cs:205-208,
      # same commit), and job 116057255255 skipped every step after the tests.
      # `set +eo pipefail`: `shell: bash` sets both, and `ps | head` can end
      # `ps` with SIGPIPE. Started here, the sampler is outside the tests' memory
      # scope (`Run unit tests`), so an OOM kill there leaves it running; each
      # sample also holds the kernel's OOM-kill count and, while it exists, the
      # scope's own memory use and events.
      - name: Start the resource monitor
        id: monitor
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          log="$RUNNER_TEMP/resource-monitor.log"
          : > "$log"
          scope=/sys/fs/cgroup/system.slice/pcapkit-tests.scope
          sample() {
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) sample $1"
            free -m
            df -h / "$GITHUB_WORKSPACE"
            echo "loadavg $(cat /proc/loadavg)"
            echo "oom_kill $(awk '$1 == "oom_kill" { print $2 }' /proc/vmstat)"
            if [ -r "$scope/memory.events" ]; then
              echo "scope memory.current $(cat "$scope/memory.current") $(tr '\n' ' ' < "$scope/memory.events")"
            fi
            ps -eo pid,rss,vsz,etime,args --sort=-rss | head -6 | cut -c1-300
          }
          (
            set +eo pipefail
            trap 'kill "$sleeper" 2>/dev/null; exit 0' TERM
            count=0
            while :; do
              count=$((count + 1))
              # One write a sample, opening on a newline: `Run unit tests` copies
              # it into a log where pytest may have left a line unfinished. bash
              # line-buffers its builtins' output, so printf wrote a sample in
              # pieces, `tail -F` could copy them apart and pytest's output land
              # between them (#1888); `cat` reads the here-string whole and
              # writes it in one call.
              lines=$(sample "$count" 2>&1 | sed 's/^/[monitor] /')
              cat <<< $'\n'"$lines"
              sleep 30 &
              sleeper=$!
              wait "$sleeper"
            done
          ) >> "$log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/resource-monitor.pid"
          echo "Sampling every 30 s into $log, pid $!."

      # unit-tests.yml `test`'s selection on every leg but `latest`: no
      # experimental version is `latest`, which util/python_versions.py holds to
      # a supported CPython, so the round-trip sweeps (#1732) are always left out
      # here. #1740: `tail -F` copies the resource monitor's samples into this
      # step's log as they are taken, and stops with the step.
      #
      # #1740, containment: a lost runner fails the job, and so the check, which
      # no `continue-on-error` prevents, so the tests are held to what leaves the
      # runner alive, and a breach fails this step instead:
      # - GraalPy alone: a 2 GiB heap per process, read by every GraalPy
      #   process, xdist workers included (GRAAL_PYTHON_VM_ARGS), and 3 workers,
      #   which leaves a CPU of the 4 to the JIT and the runner. On the native
      #   standalone `--vm.Xmx` caps the Java heap alone, not thread stacks or
      #   JIT code (graalvm.org, Native Image, Memory Management), and a heap
      #   the GC cannot free raises OutOfMemoryError, which GraalPy turns into
      #   MemoryError (graalpython runtime/exception/ExceptionUtils.java:313-316,
      #   at graal-25.4.4).
      # - #1753: a worker's live heap grows with its tests. Job 116172356218's
      #   three workers reached 2.2-2.6 GB RSS in 16 minutes; four tests raised
      #   MemoryError, then gw1 raised one in pytest's own failure report,
      #   which ends the session (exit 3) with 7.9 GB still free. Locally
      #   (25.4.4, -n 0) the heap after a full GC rose from 199M to 1738M over
      #   11% of tests/const and tests/corekit, so no heap the 12G holds for 3
      #   workers lasts the tier. `-XX:+ExitOnOutOfMemoryError` ends that
      #   worker instead, xdist reports the test it ran as crashed and starts a
      #   fresh one. `--max-worker-restart=30` allows 30 restarts in all, where
      #   three heaps that last 16 minutes need about 21 in 110; xdist's default
      #   is 4 a worker, 12 at -n 3.
      #   Five corekit files at `--vm.Xmx450m -n 1`: exit 3 after 28 passed
      #   without the flag; with it, 3 workers replaced and the run finished.
      # - `timeout` sends SIGINT at 110 minutes, under the 120-minute cap, so
      #   pytest still writes the junit XML, and exits 124; SIGKILL 3 minutes on.
      # - `prlimit --fsize`: no file over 2 GiB.
      # - A transient scope, 12G and no swap, at a fifth of the runner's CPU
      #   weight, where `sudo -n` can start one; otherwise uncapped. A scope's
      #   command "will thus inherit the execution environment of the caller"
      #   (systemd-run(1), systemd v255 man/systemd-run.xml:70-71), but sudo
      #   resets PATH to its secure_path and drops `LD_*` even under
      #   --preserve-env (sudo plugins/sudoers/env.c:133-141, at 43defa130),
      #   where setup-python puts its lib/ (src/find-python.ts:163-170, at
      #   ff73b2463), so `env` sets those again, and the heap too. systemd-run
      #   drops to the runner's uid and gid itself, with no setgroups
      #   (src/run/run.c:1645-1683, v255). The probe is `scoped` itself, every
      #   flag included, under a throwaway unit and running `true`, and either
      #   way the tests run the one argv, in the scope or not.
      # `tests-status` holds the exit status, the scope and the probe's error,
      # the seconds the tests took, the kernel's OOM kills while they ran
      # (/proc/vmstat `oom_kill`), the MemoryError count (`-w`, so Java's
      # `OutOfMemoryError` and the flag are not counted) and the workers that
      # crashed, by xdist's `[gwN] node down:` lines (under `-q` it prints no
      # `replacing crashed worker`, xdist/dsession.py:78-80 at v3.8.0), for
      # `Containment summary`.
      #
      # #1938: util/superseded.py's `watch` runs the whole command -- the scope's
      # sudo where there is one, then prlimit, timeout and pytest -- in a
      # session of its own, outside the scope, and asks `current`'s question
      # every 60 s. Once the commit is superseded it sends SIGTERM, SIGKILL 30 s
      # on, to that session and, with `--scope`, to every process of
      # pcapkit-tests.scope through `systemctl kill`: the scope's processes run
      # as the runner's user under a root-owned sudo, which a signal to the
      # session cannot pass. Ubuntu's own /etc/sudoers sets `use_pty` (sudo
      # 1.9.9-1ubuntu2.7 and 1.9.15p5-3ubuntu5.24.04.4), and sudoers(5) says it
      # has no effect where sudo has no terminal, as in a step; the scope is
      # reached by name either way. Once the command exits it writes a
      # `Superseded` notice and a job-summary line and exits 0, so the step
      # succeeds and frees the runner; where it outlives SIGKILL by 15 s, a
      # warning and exit 70, since the tests may run on until `timeout` ends
      # them. Otherwise it exits with the command's own status, so a failure on
      # a current commit reads as it would unwatched, and an API it cannot read
      # counts as current. It runs on the runner's /usr/bin/python3, not the
      # leg's interpreter: under GraalPy every process starts a VM of its own.
      - name: Run unit tests
        id: tests
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 120
        env:
          GRAAL_PYTHON_VM_ARGS: ${{ startsWith(matrix.python-version, 'graalpy') && '--vm.Xmx2g --vm.XX:+ExitOnOutOfMemoryError' || '' }}
          WORKERS: ${{ startsWith(matrix.python-version, 'graalpy') && '3' || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n +1 -F "$RUNNER_TEMP/resource-monitor.log" 2>/dev/null &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set -- -q -n "$WORKERS" --dist load --max-worker-restart=30 \
            --durations=30 --durations-min=1.0 --junitxml="$RUNNER_TEMP/junit.xml" \
            --ignore=tests/integration \
            --ignore-glob='*_runtime.py' \
            --ignore-glob='*_regression.py' \
            --ignore-glob='*roundtrip*'
          set -- prlimit --fsize=2147483648 timeout --signal=INT --kill-after=3m 110m python -m pytest "$@"
          scoped() {
            unit=$1
            shift
            sudo -n --preserve-env systemd-run --scope --quiet --unit="$unit" \
              -p MemoryMax=12G -p MemorySwapMax=0 -p CPUWeight=20 --uid="$(id -u)" --gid="$(id -g)" \
              -- env PATH="$PATH" HOME="$HOME" LD_LIBRARY_PATH="${LD_LIBRARY_PATH-}" \
              GRAAL_PYTHON_VM_ARGS="$GRAAL_PYTHON_VM_ARGS" "$@"
          }
          if probe=$(scoped "pcapkit-probe-$$.scope" true 2>&1); then
            scope=12G
            probe=
            set -- scoped pcapkit-tests.scope "$@"
          else
            scope=none
            probe=$(echo "$probe" | tail -n 1)
            # A log line, not an annotation: on a lost runner this log is all that is left.
            echo "No 12G scope: the probe failed (${probe}), so the tests run uncapped."
          fi
          watched=
          if [ "$scope" = 12G ]; then
            # `scoped` is a function, which the watcher runs through a shell.
            export -f scoped
            set -- bash -c '"$@"' bash "$@"
            watched=pcapkit-tests.scope
          fi
          watcher=/usr/bin/python3
          [ -x "$watcher" ] || watcher=python3
          set -- "$watcher" util/superseded.py watch --interval 60 --grace 30 --scope "$watched" -- "$@"
          oom_kills() { awk '$1 == "oom_kill" { print $2 }' /proc/vmstat; }
          before=$(oom_kills)
          started=$SECONDS
          set +e
          "$@" 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          status=${PIPESTATUS[0]}
          set -e
          elapsed=$((SECONDS - started))
          after=$(oom_kills)
          memory_errors=$(grep -cw MemoryError "$RUNNER_TEMP/pytest.log" || true)
          crashed_workers=$(grep -c '\] node down: ' "$RUNNER_TEMP/pytest.log" || true)
          printf 'exit=%s\nscope=%s\nprobe=%s\nelapsed=%s\noom_kills=%s\nmemory_errors=%s\ncrashed_workers=%s\n' \
            "$status" "$scope" "$probe" "$elapsed" "$(( ${after:-0} - ${before:-0} ))" "$memory_errors" \
            "$crashed_workers" > "$RUNNER_TEMP/tests-status"
          exit "$status"

      # #1740: after a failed, timed-out or cancelled tests step too. A lost
      # runner skips it, as above, and its orphan cleanup ends the sampler.
      - name: Stop the resource monitor
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/resource-monitor.pid"
          if [ ! -s "$pidfile" ]; then
            echo 'The resource monitor did not start on this leg.'
            exit 0
          fi
          pid=$(cat "$pidfile")
          kill "$pid" 2>/dev/null || echo "The resource monitor, pid $pid, had already stopped."
          echo "$(grep -c '^\[monitor\] .* sample [0-9]*$' "$RUNNER_TEMP/resource-monitor.log") samples taken."

      # #1740: the monitor's file, where the runner survives the tests. docs.github.com
      # says `always()` runs a step "even when canceled" (Expressions, `always`)
      # and nothing about a runner's shutdown, which runs no later step (above):
      # job 116057255255 skipped even `Post Run actions/checkout@v7`, whose action
      # sets no `post-if`, which "defaults to `always()`" (Metadata syntax,
      # `runs.post-if`). So on a lost runner the samples are in the tests' log alone.
      - name: Upload the resource monitor's log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: resource-monitor-${{ matrix.python-version }}
          path: ${{ runner.temp }}/resource-monitor.log
          if-no-files-found: ignore
          retention-days: 14

      # As `test`'s, under a name of its own: ci-timing.yml reads `test`'s
      # `junit-unit-*` files alone, and this one is the record of GraalPy's
      # runtime.
      - name: Upload test timings
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: junit-experimental-${{ matrix.python-version }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 14

      # #1740: what `tests-status` and the monitor's last sample say about the
      # tests, ahead of `Experimental summary`, whose script stays the KTLO
      # summary's (tests/project/test_ktlo_legs_stay_green_1672.py) and which
      # still reports a failed `tests` step as it reports any. Each cause gets a
      # warning of its own: no 12G scope, an OOM kill, a MemoryError, a worker
      # xdist replaced (#1753), and a timeout -- exit 124, or 137 with no OOM
      # kill after 110 minutes, which is `--kill-after` ending a teardown that
      # SIGINT did not. An OOM kill of pytest itself also exits 137, so the OOM
      # count and the time tell them apart. Nothing here fails: a missing or
      # partial status is reported as what it is.
      - name: Containment summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          LEG: Python ${{ matrix.python-version }} (experimental, non-blocking)
        run: |
          status="$RUNNER_TEMP/tests-status"
          if [ ! -s "$status" ]; then
            echo "$LEG: the tests step wrote no tests-status."
            exit 0
          fi
          value() { sed -n "s/^$1=//p" "$status" | tail -n 1; }
          last=$(awk '/^\[monitor\] .* sample [0-9]+$/ { at = $2; n = $4; mem = "" }
                      /^\[monitor\] Mem:/ { mem = "used " $4 " MiB of " $3 ", " $8 " available" }
                      END { if (n) print "last sample " n " at " at ": " (mem ? mem : "no free -m line") }' \
                 "$RUNNER_TEMP/resource-monitor.log" 2>/dev/null || true)
          last=${last:-no resource-monitor sample}
          warn() {
            echo "::warning title=${1} on ${LEG//,/%2C}::${2//%/%25} Experimental legs never block (#1660), so this job still succeeds."
            echo "- ${LEG}: ${1}; non-blocking, so this job still succeeds." >> "$GITHUB_STEP_SUMMARY"
          }
          code=$(value exit) scope=$(value scope) elapsed=$(value elapsed)
          oom=$(value oom_kills) errors=$(value memory_errors) crashed=$(value crashed_workers)
          if [ "$scope" = none ]; then
            warn "No memory cap" "The probe, sudo -n systemd-run --scope with the tests' flags, failed ($(value probe)), so the tests ran without the 12G scope."
          fi
          if [ "$oom" -gt 0 ] 2>/dev/null; then
            warn "tests lost a process to the OOM killer" "${oom} OOM kill(s) while the tests ran, scope ${scope}, exit ${code}, ${elapsed} s; ${last}."
          fi
          if [ "$code" = 124 ]; then
            warn "tests timed out at 110 minutes" "timeout sent SIGINT (exit 124), scope ${scope}, ${elapsed} s; ${last}."
          elif [ "$code" = 137 ] && [ "$oom" -eq 0 ] 2>/dev/null && [ "$elapsed" -ge 6600 ] 2>/dev/null; then
            warn "tests timed out at 110 minutes" "SIGINT did not end them, so timeout sent SIGKILL 3 minutes on (exit 137, no OOM kill), scope ${scope}, ${elapsed} s; ${last}."
          fi
          if [ "$errors" -gt 0 ] 2>/dev/null; then
            warn "tests raised MemoryError" "${errors} MemoryError line(s) in the pytest output, exit ${code}, scope ${scope}; ${last}."
          fi
          if [ "$crashed" -gt 0 ] 2>/dev/null; then
            warn "tests lost an xdist worker" "${crashed} xdist worker(s) went down, each failing the test it ran, and xdist replaces up to 30; exit ${code}, scope ${scope}; ${last}."
          fi
          echo "$LEG: tests exited ${code} after ${elapsed} s, scope ${scope}, ${oom} OOM kill(s), ${errors} MemoryError line(s), ${crashed:-0} worker(s) down; ${last}."

      # #1660: an experimental leg's report, as unit-tests.yml `test`'s `KTLO
      # summary` is a KTLO leg's, and for the same reasons.
      - name: Experimental summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          LEG: Python ${{ matrix.python-version }} (experimental, non-blocking)
          STEPS: ${{ toJSON(steps) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<< "$STEPS")
          if [ -z "$failed" ]; then
            echo "$LEG: no step failed."
            exit 0
          fi
          while IFS= read -r id; do
            echo "::warning title=${id} failed on ${LEG//,/%2C}::Experimental legs never block (#1660), so this job still succeeds; see the ${id} step's log."
            echo "- ${LEG}: step \`${id}\` failed; non-blocking, so this job still succeeds." >> "$GITHUB_STEP_SUMMARY"
          done <<< "$failed"
