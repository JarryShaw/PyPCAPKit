name: Experimental Tests

# The experimental tier (#1660), free-threaded CPython and GraalPy, in a
# workflow of its own so that nothing waits on its legs (#1732): a
# `workflow_run` consumer of "Unit Tests" fires only once that run completes,
# and GraalPy's leg can take the job's whole cap. No `workflow_run` names this
# workflow but ci-reports.yml's, which posts a finished run's report and holds
# up nothing (#2030); it has no `workflow_call` trigger, and a job cannot
# `needs:` one in another workflow.
#
# Its check names, `Python <version> (experimental)`, are the ones the legs had
# in unit-tests.yml, and `windows`'s is `Python <latest> on Windows
# (experimental)` (#2060); no required context of ruleset 23497679 names one.
#
# The same events and `changes` job as unit-tests.yml, so a docs-only pull
# request skips the legs here as it skips `test` there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer commit supersedes a run (#1903), which is skipped or stopped, never
# cancelled (#1938), since GitHub counts a cancelled check against its commit
# and marks it red. So there is no `concurrency:` block: without
# `cancel-in-progress` a group still cancels its pending run once a newer one
# arrives (docs.github.com, "Control the concurrency of workflows and jobs"),
# and `queue: max` would hold the new run behind the superseded one. Instead
# `current` skips the jobs of a superseded run, and `Run unit tests` stops one
# superseded mid-run; util/superseded.py holds the rule for both.

jobs:
  # #1938: the gate. util/superseded.py's `check` writes `current`, `false`
  # only where this run's commit is no longer the head of main or of its open
  # pull request, and every other job skips on `false`, so a superseded run's
  # checks read `skipped`, which marks no commit red. Every step is
  # `continue-on-error` and each job's `if:` opens with `!cancelled()`, so a
  # failure here, of a step or of the job, runs the rest.
  current:
    name: Check the commit is still current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.check.outputs.current }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          sparse-checkout: |
            .github/python-versions.toml
            util/_actions.py
            util/python_versions.py
            util/superseded.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # #1660: `latest`, the interpreter util/superseded.py runs on.
      - name: Read the Python versions
        id: versions
        continue-on-error: true
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        continue-on-error: true
        with:
          python-version: ${{ steps.versions.outputs.latest }}

      - name: Install requests
        id: requests
        continue-on-error: true
        run: python -m pip install requests

      - name: Ask whether this run's commit is still current
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python util/superseded.py check

  # unit-tests.yml's job of the same name, for the outputs this file needs.
  python-versions:
    name: Read the Python versions
    needs: current
    if: ${{ !cancelled() && needs.current.outputs.current != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      experimental: ${{ steps.read.outputs.experimental }}
      # #1938: the watcher's own interpreter, apart from the leg's.
      latest: ${{ steps.read.outputs.latest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/python-versions.toml
            util/_actions.py
            util/python_versions.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read .github/python-versions.toml
        id: read
        run: python3 util/python_versions.py --github-output

  # unit-tests.yml's `changes`, the same util/classify_changes.py step (#1967;
  # tests/project/test_sweeps_on_latest_only_1732.py pins it). This workflow is
  # never called, so its own pull_request run is every pull_request run. Every
  # event checks out, as the script is in the tree.
  changes:
    name: Classify changed files
    needs: current
    if: ${{ !cancelled() && needs.current.outputs.current != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify the diff
        id: classify
        env:
          OWN_PR: ${{ github.event_name == 'pull_request' }}
        run: python3 util/classify_changes.py

  # Its legs never block, by the KTLO mechanics: every step that can fail has
  # `continue-on-error: true`, so the job concludes success, and `Experimental
  # summary` reports each failed step as a warning. A failure no step contains
  # -- a lost runner -- fails the job, and its job-level `continue-on-error`
  # then passes the run: "Prevents a workflow run from failing when a job
  # fails" (docs.github.com, Workflow syntax, `jobs.<job_id>.continue-on-error`).
  # Its check run still reads `failure`, so the step-level guards stay.
  #
  # A job past its `timeout-minutes` is cancelled (same page,
  # `jobs.<job_id>.timeout-minutes`), which does not say whether the
  # job-level guard covers that. So every step that can run long
  # carries a cap of its own under the job's: a step past its cap fails rather
  # than cancels, and `continue-on-error` then applies as to any failure
  # (actions/runner src/Runner.Worker/StepsRunner.cs:322-353, at 5f0b3ddcc).
  # tests/project/test_ktlo_legs_stay_green_1672.py pins the caps and the
  # minutes they leave the rest.
  #
  # The tests' cap is sized for GraalPy (#1732), whose leg may still end on the
  # 110-minute `timeout` in `Run unit tests`, which `Containment summary`
  # reports as a warning that blocks nothing.
  experimental:
    name: Python ${{ matrix.python-version }} (experimental)
    # #1938: `!cancelled()` so a failed `current` skips nothing, and then the
    # two results stand in for the implicit `success()` it replaces: a failed
    # `changes` or `python-versions` still skips the legs.
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.python-versions.result == 'success'
      && needs.current.outputs.current != 'false' && needs.changes.outputs.code != 'false' }}
    needs: [current, changes, python-versions]
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 140
    continue-on-error: true
    # #1938: `Run unit tests` reads the pull request, as `current` does.
    permissions:
      contents: read
      pull-requests: read
    # #1672: every annotation a failing step writes is a warning.
    env:
      ANNOTATION_LEVEL: warning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python-versions.outputs.experimental) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true

      # #1958: these legs run the `ALL` test tier alone, as `test`'s legs but
      # `latest` do. The runner's own `python3` asks tests/_tiers.py before
      # setup-python puts the leg's interpreter on PATH, so GraalPy does not
      # parse the tree. Where it fails, the tests run the `LATEST` tier too,
      # and `Experimental summary` names this step.
      - name: List the LATEST tier
        id: tier
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          latest=$(python3 -c "from tests._tiers import latest_tier_paths; print(' '.join(latest_tier_paths()))")
          echo "paths=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        continue-on-error: true
        timeout-minutes: 5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # As unit-tests.yml `test`'s install, for the same reasons: util/pip_install.py
      # annotates a failed install, at the job's `warning` (#1967).
      - name: Install package and test dependencies
        id: install
        if: ${{ steps.python.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          LEG: Python ${{ matrix.python-version }} (experimental, non-blocking)
        run: python util/pip_install.py -e '.[test,DPKT,crypto,NGAP]'

      - name: Report available parallelism
        id: parallelism
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"

      # #1938: the interpreter `Run unit tests` runs util/superseded.py on,
      # `latest`, so the leg's GraalPy or free-threaded build need not take
      # requests. `update-environment: false` leaves PATH, `pythonLocation` and
      # `LD_LIBRARY_PATH` as the leg's setup-python set them, so the tests see
      # the leg's interpreter alone; this one is run by its `python-path`, and
      # finds its own libpython by the rpath actions/python-versions builds
      # with (builders/ubuntu-python-builder.psm1). No `cache:` and
      # `--no-cache-dir`, so the leg's pip cache is untouched. A failure here
      # leaves the tests to run unwatched.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: watcher-python
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        with:
          python-version: ${{ needs.python-versions.outputs.latest }}
          update-environment: false

      - name: Install the watcher's requests
        id: watcher
        if: ${{ steps.install.outcome == 'success' && steps.watcher-python.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          WATCHER_PYTHON: ${{ steps.watcher-python.outputs.python-path }}
        run: '"$WATCHER_PYTHON" -m pip install --no-cache-dir requests'

      # #1740: GraalPy's leg can lose its runner mid-tests ("The runner has
      # received a shutdown signal"), and then the runner evaluates no later
      # step's condition, `always()` included (actions/runner
      # src/Runner.Worker/StepsRunner.cs:205-208, at 796cc18ff). So this samples
      # the runner every 30 s into resource-monitor.log, and `Run unit tests`
      # follows the file into its own log, the one record a lost runner leaves.
      # The sampler holds none of this step's output: the runner kills a step's
      # process tree 5 s after its shell exits while a child still holds it
      # (src/Runner.Sdk/ProcessInvoker.cs:485-505, same commit). `set +eo
      # pipefail`: `shell: bash` sets both, and `ps | head` can end `ps` with
      # SIGPIPE. Started here, the sampler is outside the tests' memory scope,
      # so an OOM kill there leaves it running.
      - name: Start the resource monitor
        id: monitor
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          log="$RUNNER_TEMP/resource-monitor.log"
          : > "$log"
          scope=/sys/fs/cgroup/system.slice/pcapkit-tests.scope
          sample() {
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) sample $1"
            free -m
            df -h / "$GITHUB_WORKSPACE"
            echo "loadavg $(cat /proc/loadavg)"
            echo "oom_kill $(awk '$1 == "oom_kill" { print $2 }' /proc/vmstat)"
            if [ -r "$scope/memory.events" ]; then
              echo "scope memory.current $(cat "$scope/memory.current") $(tr '\n' ' ' < "$scope/memory.events")"
            fi
            ps -eo pid,rss,vsz,etime,args --sort=-rss | head -6 | cut -c1-300
          }
          (
            set +eo pipefail
            trap 'kill "$sleeper" 2>/dev/null; exit 0' TERM
            count=0
            while :; do
              count=$((count + 1))
              # One write a sample, so `tail -F` cannot land pytest's output
              # inside one (#1888): bash's builtins write a sample in pieces,
              # and `cat` writes the here-string in one call. The leading
              # newline ends any line pytest left unfinished.
              lines=$(sample "$count" 2>&1 | sed 's/^/[monitor] /')
              cat <<< $'\n'"$lines"
              sleep 30 &
              sleeper=$!
              wait "$sleeper"
            done
          ) >> "$log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/resource-monitor.pid"
          echo "Sampling every 30 s into $log, pid $!."

      # unit-tests.yml `test`'s selection on every leg but `latest`, so the
      # `LATEST` tier (#1958) is always left out here: util/python_versions.py
      # holds `latest` to a supported CPython. #1740: `tail -F` copies the
      # resource monitor's samples into this step's log.
      #
      # #1740, containment: a lost runner fails the check, which no
      # `continue-on-error` prevents, so the tests are held to what leaves the
      # runner alive, and a breach fails this step instead:
      # - GraalPy alone: a 2 GiB heap per process, xdist workers included
      #   (GRAAL_PYTHON_VM_ARGS), and 3 workers, which leaves a CPU of the 4 to
      #   the JIT and the runner. On the native standalone `--vm.Xmx` caps the
      #   Java heap alone, not thread stacks or JIT code (graalvm.org, Native
      #   Image, Memory Management), and a heap the GC cannot free raises
      #   OutOfMemoryError, which GraalPy turns into MemoryError (graalpython
      #   runtime/exception/ExceptionUtils.java:313-316, at graal-25.4.4).
      # - #1753: a worker's live heap grows with its tests until no heap lasts
      #   the tier, and a MemoryError in pytest's own failure report ends the
      #   session. `-XX:+ExitOnOutOfMemoryError` ends that worker instead, and
      #   xdist reports the test it ran as crashed and starts a fresh one.
      #   `--max-worker-restart=30` counts restarts over the whole run, where
      #   three heaps that last 16 minutes need about 21 in 110; xdist's
      #   default is 4 a worker.
      # - #1963: util/pytest_shards.py runs pytest once per shard `SHARDS`
      #   names, a directory or a glob of one directory's entries, then once
      #   over the rest, so every run starts its workers afresh and none
      #   outlives its heap. Each shard is sized by its largest live heap after
      #   a full GC on GraalPy. The script runs inside the timeout, scope and
      #   watcher below, so they hold over the whole tier; on the timeout's
      #   SIGINT no later run starts. Each shard's run writes a JUnit file of
      #   its own beside junit.xml.
      # - `timeout` sends SIGINT at 110 minutes, under the step's cap, so pytest
      #   still writes the JUnit XML, and exits 124; SIGKILL 3 minutes on.
      #   #2020: GNU's `timeout`, which Ubuntu 26.04 installs as `gnutimeout`:
      #   its `timeout` is uutils' (0.10.0), whose `--kill-after` sends SIGKILL with the
      #   SIGINT, to its child alone, which leaves xdist's workers running.
      # - `prlimit --fsize`: no file over 2 GiB.
      # - A transient scope, 12G and no swap, at a fifth of the runner's CPU
      #   weight, where `sudo -n` can start one; otherwise uncapped. A scope's
      #   command inherits the caller's environment (systemd-run(1), systemd
      #   v255 man/systemd-run.xml:70-71), but sudo resets PATH and drops
      #   `LD_*` even under --preserve-env (sudo plugins/sudoers/env.c:133-141,
      #   at 43defa130), where setup-python puts its lib/
      #   (src/find-python.ts:163-170, at ff73b2463), so `env` sets those
      #   again, and the heap too. systemd-run drops to the runner's uid and
      #   gid itself (src/run/run.c:1645-1683, v255). The probe is `scoped`
      #   itself, every flag included, under a throwaway unit and running
      #   `true`, and either way the tests run the one argv, in the scope or not.
      # `tests-status` holds, for `Containment summary`, the exit status, the
      # scope and the probe's error, the seconds taken, the kernel's OOM kills
      # while the tests ran, the MemoryErrors raised and the workers that went
      # down. A MemoryError is a line `MemoryError` heads, alone or before a
      # `:`, at the line's start or after pytest's `E`, an `INTERNALERROR>` or
      # an exception group's `|`: a mention is not one (#1962), and nor is
      # Java's `OutOfMemoryError`. A worker down is xdist's `[gwN] node down:`
      # line, since under `-q` it prints no `replacing crashed worker`
      # (xdist/dsession.py:78-80, at v3.8.0).
      #
      # #1938: util/superseded.py's `watch` runs the whole command in a session
      # of its own, outside the scope, and asks `current`'s question every
      # 60 s. Once the commit is superseded it sends SIGTERM, SIGKILL 30 s on,
      # to that session and, with `--scope`, to every process of
      # pcapkit-tests.scope through `systemctl kill`, since a signal to the
      # session cannot pass the root-owned sudo they run under. Ubuntu's
      # /etc/sudoers sets `use_pty` (sudo 1.9.9-1ubuntu2.7 and
      # 1.9.15p5-3ubuntu5.24.04.4), which sudoers(5) says has no effect where
      # sudo has no terminal, as in a step; the scope is reached by name
      # either way. The step then
      # succeeds and frees the runner; where the command outlives SIGKILL, it
      # warns and exits 70. Otherwise it exits with the command's own status,
      # and an API it cannot read counts as current. Where `watcher-python` or
      # its requests did not install, the tests run unwatched.
      - name: Run unit tests
        id: tests
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 120
        env:
          GRAAL_PYTHON_VM_ARGS: ${{ startsWith(matrix.python-version, 'graalpy') && '--vm.Xmx2g --vm.XX:+ExitOnOutOfMemoryError' || '' }}
          WORKERS: ${{ startsWith(matrix.python-version, 'graalpy') && '3' || 'auto' }}
          # #1963: folded, so each line break reads as the space between two shards.
          SHARDS: >-
            ${{ startsWith(matrix.python-version, 'graalpy') && 'tests/const
            tests/corekit/test_fields_n* tests/corekit/test_[a-h]* tests/corekit/test_i* tests/corekit
            tests/foundation tests/protocols/internet tests/protocols/[a-m]* tests/protocols
            tests/toolkit' || '' }}
          GH_TOKEN: ${{ github.token }}
          WATCHER: ${{ steps.watcher.outcome }}
          WATCHER_PYTHON: ${{ steps.watcher-python.outputs.python-path }}
          LATEST_TIER: ${{ steps.tier.outputs.paths }}
        run: |
          tail -n +1 -F "$RUNNER_TEMP/resource-monitor.log" 2>/dev/null &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set -- -q -n "$WORKERS" --dist load --max-worker-restart=30 \
            --durations=30 --durations-min=1.0 --junitxml="$RUNNER_TEMP/junit.xml" \
            --ignore=tests/integration \
            --ignore-glob='*_runtime.py' \
            --ignore-glob='*_regression.py'
          # #1958: the `LATEST` tier, from `List the LATEST tier`.
          for module in $LATEST_TIER; do
            set -- "$@" --ignore="$module"
          done
          set -- python -m pytest "$@"
          # #1963: GraalPy's tier in runs that each start fresh workers, under the one cap below.
          if [ -n "$SHARDS" ]; then
            set -- /usr/bin/python3 util/pytest_shards.py "$SHARDS" -- "$@"
          fi
          # #2020: GNU's `timeout` on any image, `gnutimeout` where it exists.
          gnu_timeout=$(command -v gnutimeout || command -v timeout)
          set -- prlimit --fsize=2147483648 "$gnu_timeout" --signal=INT --kill-after=3m 110m "$@"
          scoped() {
            unit=$1
            shift
            sudo -n --preserve-env systemd-run --scope --quiet --unit="$unit" \
              -p MemoryMax=12G -p MemorySwapMax=0 -p CPUWeight=20 --uid="$(id -u)" --gid="$(id -g)" \
              -- env PATH="$PATH" HOME="$HOME" LD_LIBRARY_PATH="${LD_LIBRARY_PATH-}" \
              GRAAL_PYTHON_VM_ARGS="$GRAAL_PYTHON_VM_ARGS" "$@"
          }
          if probe=$(scoped "pcapkit-probe-$$.scope" true 2>&1); then
            scope=12G
            probe=
            set -- scoped pcapkit-tests.scope "$@"
          else
            scope=none
            probe=$(echo "$probe" | tail -n 1)
            # A log line, not an annotation: on a lost runner this log is all that is left.
            echo "No 12G scope: the probe failed (${probe}), so the tests run uncapped."
          fi
          if [ "$WATCHER" = success ] && [ -x "$WATCHER_PYTHON" ]; then
            watched=
            if [ "$scope" = 12G ]; then
              # `scoped` is a function, which the watcher runs through a shell.
              export -f scoped
              set -- bash -c '"$@"' bash "$@"
              watched=pcapkit-tests.scope
            fi
            # #2078: its summary line goes to the job's copy as well, through an
            # option, so the tests, which inherit its environment, never see it.
            set -- "$WATCHER_PYTHON" util/superseded.py watch --interval 60 --grace 30 --scope "$watched" \
              --summary-copy "$RUNNER_TEMP/job-summary.md" -- "$@"
          else
            echo "No watcher: its interpreter or requests did not install (${WATCHER:-skipped}), so the tests run unwatched."
          fi
          oom_kills() { awk '$1 == "oom_kill" { print $2 }' /proc/vmstat; }
          before=$(oom_kills)
          started=$SECONDS
          set +e
          "$@" 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          status=${PIPESTATUS[0]}
          set -e
          elapsed=$((SECONDS - started))
          after=$(oom_kills)
          memory_errors=$(grep -cE '^(INTERNALERROR> *)?(E +)?( *\| *)*MemoryError(:|[[:space:]]*$)' "$RUNNER_TEMP/pytest.log" || true)
          crashed_workers=$(grep -c '\] node down: ' "$RUNNER_TEMP/pytest.log" || true)
          printf 'exit=%s\nscope=%s\nprobe=%s\nelapsed=%s\noom_kills=%s\nmemory_errors=%s\ncrashed_workers=%s\n' \
            "$status" "$scope" "$probe" "$elapsed" "$(( ${after:-0} - ${before:-0} ))" "$memory_errors" \
            "$crashed_workers" > "$RUNNER_TEMP/tests-status"
          exit "$status"

      # #1740: after a failed, timed-out or cancelled tests step too. A lost
      # runner skips it, as above, and its orphan cleanup ends the sampler.
      - name: Stop the resource monitor
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          pidfile="$RUNNER_TEMP/resource-monitor.pid"
          if [ ! -s "$pidfile" ]; then
            echo 'The resource monitor did not start on this leg.'
            exit 0
          fi
          pid=$(cat "$pidfile")
          kill "$pid" 2>/dev/null || echo "The resource monitor, pid $pid, had already stopped."
          echo "$(grep -c '^\[monitor\] .* sample [0-9]*$' "$RUNNER_TEMP/resource-monitor.log") samples taken."

      # #1740: the monitor's file, where the runner survives the tests. A lost
      # runner runs no later step (see `Start the resource monitor`), not even
      # a post step, whose `post-if` "defaults to `always()`" (docs.github.com,
      # Metadata syntax, `runs.post-if`), so the samples are then in the
      # tests' log alone.
      - name: Upload the resource monitor's log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resource-monitor-${{ matrix.python-version }}
          path: ${{ runner.temp }}/resource-monitor.log
          if-no-files-found: ignore
          retention-days: 14

      # As `test`'s, under a name of its own: ci-timing.yml reads `test`'s
      # `junit-unit-*` files alone, and this one is the record of GraalPy's
      # runtime. The glob takes each shard's JUnit file too (#1963). #2073: a
      # run the watcher stopped as superseded has pytest killed before it
      # writes junit.xml, and its `Superseded` notice already says why, so the
      # watcher's `stopped=true` turns the missing-file warning off; a run that
      # ran to its end and wrote no file still warns.
      - name: Upload test timings
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-experimental-${{ matrix.python-version }}
          path: ${{ runner.temp }}/junit*.xml
          if-no-files-found: ${{ steps.tests.outputs.stopped == 'true' && 'ignore' || 'warn' }}
          retention-days: 14

      # #1740: what `tests-status` and the monitor's last sample say about the
      # tests, ahead of `Experimental summary`, whose script stays the KTLO
      # summary's (tests/project/test_ktlo_legs_stay_green_1672.py). Each cause
      # gets a warning of its own: no 12G scope, an OOM kill, a MemoryError, a
      # worker xdist replaced (#1753), and a timeout -- exit 124, or 137 with
      # no OOM kill after 110 minutes, `--kill-after` ending a teardown SIGINT
      # did not; an OOM kill of pytest itself also exits 137. Nothing here
      # fails. #2077: a run the watcher stopped as superseded exits 0, so the
      # watcher's `stopped=true` makes the closing line say the tests were
      # stopped, not that they exited 0; its `Superseded` notice already says
      # why, so the stop itself gets no warning.
      - name: Containment summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          LEG: Python ${{ matrix.python-version }} (experimental, non-blocking)
          STOPPED: ${{ steps.tests.outputs.stopped }}
        run: |
          status="$RUNNER_TEMP/tests-status"
          if [ ! -s "$status" ]; then
            echo "$LEG: the tests step wrote no tests-status."
            exit 0
          fi
          value() { sed -n "s/^$1=//p" "$status" | tail -n 1; }
          last=$(awk '/^\[monitor\] .* sample [0-9]+$/ { at = $2; n = $4; mem = "" }
                      /^\[monitor\] Mem:/ { mem = "used " $4 " MiB of " $3 ", " $8 " available" }
                      END { if (n) print "last sample " n " at " at ": " (mem ? mem : "no free -m line") }' \
                 "$RUNNER_TEMP/resource-monitor.log" 2>/dev/null || true)
          last=${last:-no resource-monitor sample}
          warn() {
            echo "::warning title=${1} on ${LEG//,/%2C}::${2//%/%25} Experimental legs never block (#1660), so this job still succeeds."
            echo "- ${LEG}: ${1}; non-blocking, so this job still succeeds." | tee -a "$RUNNER_TEMP/job-summary.md" >> "$GITHUB_STEP_SUMMARY"
          }
          code=$(value exit) scope=$(value scope) elapsed=$(value elapsed)
          oom=$(value oom_kills) errors=$(value memory_errors) crashed=$(value crashed_workers)
          if [ "$scope" = none ]; then
            warn "No memory cap" "The probe, sudo -n systemd-run --scope with the tests' flags, failed ($(value probe)), so the tests ran without the 12G scope."
          fi
          if [ "$oom" -gt 0 ] 2>/dev/null; then
            warn "tests lost a process to the OOM killer" "${oom} OOM kill(s) while the tests ran, scope ${scope}, exit ${code}, ${elapsed} s; ${last}."
          fi
          if [ "$code" = 124 ]; then
            warn "tests timed out at 110 minutes" "timeout sent SIGINT (exit 124), scope ${scope}, ${elapsed} s; ${last}."
          elif [ "$code" = 137 ] && [ "$oom" -eq 0 ] 2>/dev/null && [ "$elapsed" -ge 6600 ] 2>/dev/null; then
            warn "tests timed out at 110 minutes" "SIGINT did not end them, so timeout sent SIGKILL 3 minutes on (exit 137, no OOM kill), scope ${scope}, ${elapsed} s; ${last}."
          fi
          if [ "$errors" -gt 0 ] 2>/dev/null; then
            warn "tests raised MemoryError" "${errors} MemoryError line(s) in the pytest output, exit ${code}, scope ${scope}; ${last}."
          fi
          if [ "$crashed" -gt 0 ] 2>/dev/null; then
            warn "tests lost an xdist worker" "${crashed} xdist worker(s) went down, each failing the test it ran, and xdist replaces up to 30; exit ${code}, scope ${scope}; ${last}."
          fi
          if [ "$STOPPED" = true ]; then
            ended="were stopped as superseded"
          else
            ended="exited ${code}"
          fi
          echo "$LEG: tests ${ended} after ${elapsed} s, scope ${scope}, ${oom} OOM kill(s), ${errors} MemoryError line(s), ${crashed:-0} worker(s) down; ${last}."

      # #1660: an experimental leg's report, as unit-tests.yml `test`'s `KTLO
      # summary` is a KTLO leg's, and for the same reasons: the same script,
      # util/leg_summary.py, words its warning for this tier (#1967).
      - name: Experimental summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          LEG: Python ${{ matrix.python-version }} (experimental, non-blocking)
          STEPS: ${{ toJSON(steps) }}
          JOB_SUMMARY_COPY: ${{ runner.temp }}/job-summary.md
        run: /usr/bin/python3 util/leg_summary.py experimental

      # #2030: the job's summary, for the report ci-reports.yml posts, as in
      # unit-tests.yml's `test` job. `Containment summary` and `Experimental
      # summary` copy theirs to job-summary.md, and `Run unit tests` passes it
      # to util/superseded.py's `--summary-copy` (#2078) rather than setting
      # JOB_SUMMARY_COPY, as its tests write summaries of their own.
      - name: Name the job summary
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          JOB_NAME: Python ${{ matrix.python-version }} (experimental)
        run: if [ -s "$RUNNER_TEMP/job-summary.md" ]; then printf '%s\n' "$JOB_NAME" > "$RUNNER_TEMP/job-summary.name"; fi

      - name: Upload the job summary
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-summary-${{ github.job }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/job-summary.md
            ${{ runner.temp }}/job-summary.name
          if-no-files-found: ignore
          retention-days: 7

  # #2060: the unit tier on Windows before the win-64 conda package is
  # published, so its first release has had a test run. One leg, on `latest`,
  # the newest CPython the conda builds target. Non-blocking by `experimental`'s
  # mechanics: every step that can fail is `continue-on-error`, the long ones
  # have caps under the job's, `Experimental summary` reports each failure as a
  # warning, and the job-level guard covers a lost runner. None of
  # `experimental`'s Linux containment runs here: no scope or `prlimit`, nor
  # util/cap_file_size.py, which needs `resource`; no resource monitor, which
  # reads /proc; no superseded watcher, which signals a process group. So the
  # tests' cap is the step's own. Every `run:` is Git Bash's.
  windows:
    name: Python ${{ needs.python-versions.outputs.latest }} on Windows (experimental)
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.python-versions.result == 'success'
      && needs.current.outputs.current != 'false' && needs.changes.outputs.code != 'false' }}
    needs: [current, changes, python-versions]
    runs-on: windows-latest
    timeout-minutes: 80
    continue-on-error: true
    env:
      ANNOTATION_LEVEL: warning

    steps:
      # The image's Git checks text out with CRLF, which `* text=auto` leaves to
      # it; LF keeps the tree the tests read the one the other legs read.
      - name: Keep LF line endings
        id: eol
        continue-on-error: true
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          python-version: ${{ needs.python-versions.outputs.latest }}
          cache: pip

      - name: Install package and test dependencies
        id: install
        if: ${{ steps.python.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          LEG: Python ${{ needs.python-versions.outputs.latest }} on Windows (experimental, non-blocking)
        run: python util/pip_install.py -e '.[test,DPKT,crypto,NGAP]'

      - name: Report available parallelism
        id: parallelism
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: python -c "import os; print('cpu_count', os.cpu_count())"

      # `experimental`'s selection, the `ALL` tier (#1958), asked of
      # tests/_tiers.py on the leg's own CPython, as `test` asks it.
      - name: Run unit tests
        id: tests
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        run: |
          if ! skipped=$(python -c "from tests._tiers import latest_tier_paths; print(' '.join(latest_tier_paths()))"); then
            echo "::${ANNOTATION_LEVEL} title=Could not compute the LATEST tier::tests._tiers.latest_tier_paths() failed -- see the traceback above."
            exit 1
          fi
          set -- -q -n auto --dist load \
            --durations=30 --durations-min=1.0 --junitxml="$RUNNER_TEMP/junit.xml" \
            --ignore=tests/integration \
            --ignore-glob='*_runtime.py' \
            --ignore-glob='*_regression.py'
          for module in $skipped; do
            set -- "$@" --ignore="$module"
          done
          python -m pytest "$@"

      - name: Upload test timings
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-experimental-windows-${{ needs.python-versions.outputs.latest }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: warn
          retention-days: 14

      # `experimental`'s, on setup-python's `python`, or the image's where that
      # failed, since Windows has no /usr/bin/python3 (#2060).
      - name: Experimental summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          LEG: Python ${{ needs.python-versions.outputs.latest }} on Windows (experimental, non-blocking)
          STEPS: ${{ toJSON(steps) }}
          JOB_SUMMARY_COPY: ${{ runner.temp }}/job-summary.md
        run: python util/leg_summary.py experimental

      - name: Name the job summary
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          JOB_NAME: Python ${{ needs.python-versions.outputs.latest }} on Windows (experimental)
        run: if [ -s "$RUNNER_TEMP/job-summary.md" ]; then printf '%s\n' "$JOB_NAME" > "$RUNNER_TEMP/job-summary.name"; fi

      - name: Upload the job summary
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-summary-${{ github.job }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/job-summary.md
            ${{ runner.temp }}/job-summary.name
          if-no-files-found: ignore
          retention-days: 7
