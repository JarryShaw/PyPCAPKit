name: Python Versions

# #1660: keeps .github/python-versions.toml current. `detect` recomputes the
# tiers (util/update_python_versions.py's docstring gives the rules), rewrites
# the file and the prose the audit tests pin to it, and runs that audit. `pr`
# proposes any change on `bot/python-versions` for the owner to merge. Nothing
# here pushes `main` or edits ruleset 23497679: the pull request body lists the
# required contexts to change by hand.
#
# `pr` pushes with the release App's token, not GITHUB_TOKEN, whose pushes
# start nothing, so the pull request's own checks run; none of them runs this
# workflow again.
on:
  schedule:
    - cron: '41 5 * * 1' # Mondays at 05:41 UTC
  workflow_dispatch:

permissions: {}

# One run at a time, so two runs cannot race for the branch. A queued run is
# kept, not cancelled: it recomputes from the sources and skips what the branch
# already proposes.
concurrency:
  group: python-versions
  cancel-in-progress: false

jobs:
  # No secret and a read-only token. The computation reads the network and
  # writes only this checkout, and the audit is the repository's own tests.
  detect:
    name: Recompute the Python version tiers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      publish: ${{ steps.update.outputs.publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `latest` for this job, like every single-interpreter job (#1661).
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # PyYAML, from the `test` extra, for the workflow readers and the audit;
      # neither imports pcapkit. requests fetches the sources and markdown-it-py
      # reads the runner-images table (#1894); only `update` imports either, so
      # `pr`'s `publish` runs without them.
      - name: Install PyYAML, requests and markdown-it-py
        run: python -m pip install PyYAML requests markdown-it-py

      # Writes the proposal to $RUNNER_TEMP/proposal. `publish` is false when
      # nothing changed, or when `bot/python-versions`' open pull request
      # already proposes these tiers, so an unmerged proposal is not re-pushed,
      # nor its approval asked for, every week. A branch holding commits it did
      # not make that proposes other tiers fails here, before any approval, as
      # `publish` would refuse it. The token reads the pull request's state.
      - name: Recompute the tiers
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python util/update_python_versions.py update --write --out "$RUNNER_TEMP/proposal"
          --proposal-branch bot/python-versions --github-output

      # The modules that pin the workflows and the prose to the file, on
      # the rewritten tree. A failure here does not stop the proposal: a tier
      # move can need hand edits the script names, and the body lists what failed.
      - name: Run the audit tests
        id: audit
        continue-on-error: true
        shell: bash
        run: >-
          python -m unittest -v tests.project.test_python_versions_1660
          tests.project.test_python_matrix_tiers_1633 tests.project.test_ktlo_legs_stay_green_1672
          2>&1 | tee "$RUNNER_TEMP/audit.log"

      - name: Write the pull request body
        if: ${{ steps.update.outputs.changed == 'true' }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python util/update_python_versions.py body "$RUNNER_TEMP/proposal"
          --audit-outcome "$AUDIT_OUTCOME" --audit-log "$RUNNER_TEMP/audit.log" --run-url "$RUN_URL"

      # Kept for as long as an environment approval can wait. The proposal holds
      # files/.github/..., which upload-artifact leaves out unless told otherwise.
      - name: Upload the proposal
        if: ${{ steps.update.outputs.publish == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-versions-proposal
          path: ${{ runner.temp }}/proposal
          include-hidden-files: true
          retention-days: 30

      - name: Say why no pull request opens
        if: ${{ steps.update.outputs.publish == 'true' && vars.RELEASE_APP_CLIENT_ID == '' }}
        run: >-
          echo "::warning title=No pull request without the release App::vars.RELEASE_APP_CLIENT_ID is unset,
          so the pr job skips. Set up the App as docs/source/contributing/releasing.rst describes."

      # With nothing changed the tree is main's, so a failing audit is main's own
      # failure: the run says so rather than passing green over it.
      - name: Fail on a failing audit of an unchanged tree
        if: ${{ steps.update.outputs.changed != 'true' && steps.audit.outcome == 'failure' }}
        run: |
          echo "::error title=The audit fails on main::the tiers need no change, but the audit fails; see above."
          exit 1

  # The release App's key is a secret of the `github-release` environment,
  # which needs the owner's approval, so he is asked only when there is
  # something to propose. The token has no `workflows` permission, so it cannot
  # push a workflow file, and `update` writes none. `publish` force-pushes
  # `bot/python-versions` alone, refusing while its pull request is open if it
  # holds commits it did not make; with none open it recreates it from main.
  pr:
    name: Open or update the pull request
    needs: detect
    if: >-
      ${{ needs.detect.outputs.publish == 'true' && vars.RELEASE_APP_CLIENT_ID != '' &&
      github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    # GITHUB_TOKEN only downloads `detect`'s artifact; the App's token does the rest.
    permissions:
      actions: read

    steps:
      - name: Mint the release App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The commit `detect` read, with full history for the branch's merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Download the proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name python-versions-proposal
          --dir "$RUNNER_TEMP/proposal"

      - name: Push the proposal and open or update its pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_BOT_ID: ${{ vars.RELEASE_APP_BOT_ID }}
        run: python3 util/update_python_versions.py publish "$RUNNER_TEMP/proposal"
