name: "Conda Update"

permissions:
  contents: read

on:
  schedule:
    - cron: '0 10 * * 6' # Saturdays at 10:00 UTC
  # No `push: branches: [main]` here. `unit-tests.yml`'s own push trigger
  # already runs the full matrix for this commit; calling it again below with
  # `gate-only: true` re-ran the single-version "Gate" job a second time for
  # the same tree (#715). Chaining off `Unit Tests`' completion means the gate
  # never runs twice, and `conda-update` below just reads the verdict that
  # already exists. `.event == 'push'` is checked in that job's `if` rather
  # than here, because `workflow_run` fires for a pull request's completion
  # too and a `branches:` filter here would be the only thing stopping that.
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]

# This workflow commits and pushes, so a cancelled run can leave the bump
# half-applied. Kept keyed on the ref, unlike the validation workflows: this
# publishes to Anaconda, and letting two runs upload the same version
# concurrently is worse than dropping a superseded duplicate.
#
# A `workflow_run` is keyed on the commit `Unit Tests` verified instead (#1643).
# Each `Unit Tests` completion raises a run here, and one whose verdict is for an
# older commit only runs `verdict` and skips -- but in a shared group it would
# still displace a pending run whose verdict matches, since "any existing pending
# job or workflow in the same concurrency group will be canceled" (GitHub,
# "Control the concurrency of workflows and jobs").
#
# Note this group is not what serialises the repository writes -- the
# `conda-update` job below carries its own `repository-maintenance` group, shared
# with cron-vendor, and that is what actually stops two jobs committing at once.
concurrency:
  group: conda-update-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  # Only earns its runners on the schedule trigger now: `Unit Tests` has no
  # schedule trigger of its own, so Saturday's cron run is the one case left
  # where nothing else has already verified this tree. `workflow_run` carries
  # its own verdict instead -- see `conda-update` below.
  unit-tests:
    name: Conda test gate
    if: ${{ github.event_name != 'workflow_run' }}
    permissions:
      contents: read
    uses: ./.github/workflows/unit-tests.yml
    with:
      gate-only: true

  # #1643: `github.sha`, which every checkout here takes, is main's tip when the
  # `workflow_run` was raised -- not the commit the completed `Unit Tests` run
  # verified, and in a merge wave the two differ. This job compares them with
  # util/verdict_covers_checkout.py, whose docstring gives the rule, and the job
  # below acts on a `workflow_run` only when `verified` is 'true'. Its `if:` is
  # that job's `workflow_run` clause, so a run raised by a pull request's or a
  # failed `Unit Tests` run still concludes `skipped`, as before.
  verdict:
    name: Verdict covers this commit
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verdict.outputs.verified }}
    steps:
      # The default ref, as the job below uses, so both see the same `github.sha`.
      # Twenty commits leaves room for the bot commits the rule accepts; a verdict
      # further back is not found, and so not accepted.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Compare the verified commit with this checkout
        id: verdict
        env:
          VERDICT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 util/verdict_covers_checkout.py

  conda-update:
    name: Update requirements.txt
    runs-on: ubuntu-latest
    needs: [ unit-tests, verdict ]
    # `needs` cannot itself be conditional, so a skipped gate (`workflow_run`)
    # has to be accepted explicitly -- by default this job would inherit the
    # skip. `!cancelled()` rather than `always()` so that cancelling the run
    # still cancels the update; a gate that actually failed still blocks.
    #
    # The `workflow_run` clause is the real gate for a push to main now: it
    # reads the verdict `Unit Tests` already reached instead of re-running it,
    # and `verdict` says whether that verdict covers the commit checked out
    # below (#1643). `.event == 'push'` and `.head_branch == 'main'`
    # both matter -- `workflow_run` fires for *every* completion of that
    # workflow, including one triggered by a pull request, and without this
    # check a green PR would upload a conda distribution built from that PR's
    # tree.
    if: >-
      !cancelled() && needs.unit-tests.result != 'failure' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        needs.verdict.outputs.verified == 'true'
      ))
    concurrency:
      group: repository-maintenance
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      - uses: actions/checkout@v7
        with:
          # Deliberately the default `github.sha` (main's tip), not
          # `github.event.workflow_run.head_sha`. Pinning to the latter once
          # ran here and CodeQL flagged it as "checkout of untrusted code in a
          # privileged context" -- `workflow_run` can also be raised by a pull
          # request's `Unit Tests` run, and that field would then be a fork's
          # commit. The `if:` above already keeps that path from reaching this
          # step, but making the ref itself always resolve to a trusted
          # default-branch commit removes the pattern outright rather than
          # relying on CodeQL tracing through the guard. The push below rebases
          # onto main's actual tip before writing, or does not write at all, so
          # pinning to the exact tested sha would have bought nothing here
          # either. Whether this commit is one that verdict covers is
          # `verdict`'s question (#1643); whether what lands after it is, Push
          # Changes' (#1632).
          #
          # The push below re-points `origin` at an SSH remote and authenticates
          # with the loaded deploy key, not with this checkout's credential --
          # so there is nothing here for a persisted token to do, and one less
          # live credential for anything running in between to find.
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # `.[all,dev]`, not `.[all]` alone: `util/conda-dist.py` below only
      # *refreshes* the version pin of every package already named in
      # `conda/requirements.txt` -- via `importlib.metadata.version(name)`,
      # which raises unless that distribution is installed here -- and that
      # file names `dpkt`, `scapy`, `pyshark`, `requests` and `beautifulsoup4`
      # with no marker. #910 narrowed `all` to core addons only, so those five
      # now come from `dev` instead; without it this step would install
      # cleanly and the next one would crash on the first missing name.
      - name: Install and Setup
        run: |
          set -x

          python -m pip install -U pip setuptools wheel packaging
          python -m pip install -e .[all,dev]
          #python -m pip install pathlib2 typing_extensions

      - name: Setup Conda Distribution
        run: |
          export PCAPKIT_DEVMODE=1
          export PCAPKIT_VERBOSE=1

          python util/conda-dist.py

      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@v17
        id: verify-changed-files

      - name: Bump Version
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          python util/conda-build.py

      - name: Commit Changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -am"Bumped build to $(cat conda/build)

          Updated conda distribution at $(date). The following files have been changed:
            ${{ steps.verify-changed-files.outputs.changed_files }}"

      # Writes `pushed` and `commit`, which `CONDA_CHANGED` and `CONDA_COMMIT`
      # below hand to `conda-tag` and `conda-dist` (#1632).
      #
      # The verdict this run acted on -- `verdict`'s, or on the schedule the
      # gate's -- covers `$GITHUB_SHA`, the checkout, and nothing after it. A
      # commit that lands on `main` during the run would otherwise be rebased
      # under the bump, pushed, tagged and uploaded with no verdict of its own.
      # So the tip is fetched first and the commits a rebase onto it would bring
      # in are put to #1643's rule, util/verdict_covers_checkout.py, run from
      # this checkout and not from the tip it is judging. If they are not
      # covered, nothing is pushed: the tip's own `Unit Tests` run raises this
      # workflow again, and that run bumps. Otherwise the rebase is onto that
      # same fetched commit, so what is pushed is what was judged.
      #
      # A bump then counts only while `conda/build` still differs from the tip.
      # Two runs can compute the same bump from one checkout -- the schedule and
      # a `workflow_run`, or a re-run, which uses "the same `GITHUB_SHA`"
      # (GitHub, "Re-running workflows and jobs") -- and the second one's rebase
      # drops it as "previously applied", while `files_changed` still reads
      # 'true'. Conda Update 38325136710 and 38325153882 were such a pair, both
      # on 2e941bbb7 and raised 2 s after two different `Unit Tests` runs, for
      # 9083163f5 and for 01151b13f, completed; `verdict` now refuses both.
      # Asking about that file rather than "is a commit left to push" also
      # covers a rebase that keeps part of the commit but drops its bump: that
      # remainder would land under a build already tagged, so it is not pushed,
      # and the next run recomputes it under a fresh build.
      - name: Push Changes
        id: push-changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git fetch origin "${GITHUB_REF#refs/heads/}"
          tip="$(git rev-parse FETCH_HEAD)"

          status=0
          reason="$(VERDICT_SHA="$GITHUB_SHA" python3 util/verdict_covers_checkout.py --head "$tip" --exit-code)" || status=$?
          case "$status" in
            0)
              echo "$reason"
              ;;
            3)
              echo "::notice title=Not pushed as main moved past this checkout::$reason The bump is left to the Conda Update that $tip's own Unit Tests run raises."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "$reason"
              exit "$status"
              ;;
          esac

          git rebase "$tip"

          status=0
          git diff --quiet "$tip" HEAD -- conda/build || status=$?
          case "$status" in
            0)
              echo "::notice title=Build already on main::conda/build $(cat conda/build) was pushed by another run; nothing to push, tag or upload"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              commit="$(git rev-parse HEAD)"
              status=0
              git push origin "${commit}:${GITHUB_REF}" || status=$?
              if [ "$status" -ne 0 ]; then
                # #1649: a merge landing after the fetch above has the push
                # refused as a non-fast-forward. That is main moving past this
                # checkout one step later than the rule can see, so it ends as
                # the rule's refusal does. Only main moved to a commit without
                # `$commit` in its history is that race: at `$tip` the push
                # failed for another reason, and over `$commit` it landed though
                # git says it did not. Those, and a fetch that fails, fail the
                # step.
                git fetch origin "${GITHUB_REF#refs/heads/}" || exit "$status"
                moved="$(git rev-parse FETCH_HEAD)"
                ancestry=0
                git merge-base --is-ancestor "$commit" "$moved" || ancestry=$?
                if [ "$moved" = "$tip" ] || [ "$ancestry" -ne 1 ]; then
                  exit "$status"
                fi
                echo "::notice title=Not pushed as main moved during the push::main moved from $tip to $moved after the fetch, so $commit is not a fast-forward. The bump is left to the Conda Update that $moved's own Unit Tests run raises."
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "commit=${commit}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$status"
              ;;
          esac

      - name: Get Version
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        id: get_version
        run: |
          set -ex

          echo "PCAPKIT_VERSION=$(python -c 'import pcapkit; print(pcapkit.__version__)')" >> $GITHUB_OUTPUT
          echo "PCAPKIT_CONDA_LABEL=$(python -c 'from packaging.version import Version; import pcapkit; print("dev" if Version(pcapkit.__version__).is_prerelease else "main")')" >> $GITHUB_OUTPUT
          echo "PCAPKIT_BUILD=$(cat conda/build)" >> $GITHUB_OUTPUT

    outputs:
      # Not `files_changed`: see Push Changes above.
      CONDA_CHANGED: ${{ steps.push-changes.outputs.pushed }}
      # The commit Push Changes put on `main`, and the one `conda-tag` tags.
      CONDA_COMMIT: ${{ steps.push-changes.outputs.commit }}
      PCAPKIT_VERSION: ${{ steps.get_version.outputs.PCAPKIT_VERSION }}
      PCAPKIT_CONDA_LABEL: ${{ steps.get_version.outputs.PCAPKIT_CONDA_LABEL }}
      PCAPKIT_BUILD: ${{ steps.get_version.outputs.PCAPKIT_BUILD }}

  conda-tag:
    # See create-release.yml: "(update)" keeps this apart from the Conda Tag job
    # there, which runs on the same commits.
    name: Conda Tag (update)
    runs-on: ubuntu-latest
    needs: [ conda-update ]
    # `!cancelled()` is what makes this job reachable at all on the
    # `workflow_run` path (#1632). `unit-tests` above skips on that event, and
    # "a default status check of `success()` is applied unless you include one
    # of these functions" (GitHub, "Evaluate expressions in workflows and
    # actions", Status check functions). The skip it reacts to is not only a
    # direct `needs:` entry's: "If a run contains a series of jobs that need
    # each other, a failure or skip applies to all jobs in the dependency chain
    # from the point of failure or skip onwards" (GitHub, "Workflow syntax for
    # GitHub Actions", `jobs.<job_id>.needs`). So `conda-update` escaping it
    # with its own `!cancelled()` does not escape it for this job. Run
    # 38325136710 shows it: "Update requirements.txt" succeeded, pushing
    # f4f94bcad, and both this job and `conda-dist` reported `skipped` with
    # their own conditions true. So the five bumps #1632 lists were committed
    # and never tagged or uploaded.
    #
    # `needs.conda-update.result == 'success'` is then what the lost implicit
    # check was doing, and it has to be said explicitly: `!cancelled()` bypasses
    # the cascade for a legitimate skip, so without it a failed or cancelled
    # update -- which still publishes the outputs of the steps that did run --
    # would have this job tag from a half-finished run, e.g. one whose push
    # landed and whose Get Version then failed, leaving no build. Same shape as
    # create-release.yml's `tag` job (:494-498).
    if: >-
      !cancelled() && needs.conda-update.result == 'success' &&
      needs.conda-update.outputs.CONDA_CHANGED == 'true'
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      # The commit Push Changes pushed, not `main`'s tip: a commit landing after
      # the push is neither the bump nor covered by this run's verdict, and
      # tagging the tip -- a `git pull` and `HEAD`, as this job did -- would have
      # `conda-dist` build and upload it (#1632). `fetch-depth: 0` fetches "all
      # history for all branches and tags" (actions/checkout), so Create Tag sees
      # a tag that already exists.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.conda-update.outputs.CONDA_COMMIT }}
          token: ${{ secrets.PYPCAPKIT }}
          fetch-depth: 0

      # `env:` rather than splicing `needs.*.outputs` straight into the script --
      # CodeQL flags the latter as code injection, since Actions substitutes
      # `${{ }}` into the script text before the shell ever parses it, so a
      # value containing shell metacharacters runs as script rather than data.
      # Routing it through `env:` and reading `$PCAPKIT_VERSION`/`$PCAPKIT_BUILD`
      # keeps it a shell variable, which the shell can only ever treat as data.
      #
      # Tags `$CONDA_COMMIT` by name rather than `HEAD`. A tag that already tags
      # it is left alone and the job stays green, so a re-run of this job goes
      # on to `conda-dist`; a tag on any other commit means this build number
      # already names another tree, so the job fails, the tag is not moved, and
      # nothing is uploaded under it.
      - name: Create Tag
        env:
          CONDA_COMMIT: ${{ needs.conda-update.outputs.CONDA_COMMIT }}
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        run: |
          set -x

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          tag="conda-${PCAPKIT_VERSION}+${PCAPKIT_BUILD}"
          if tagged="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
            if [ "$tagged" != "$CONDA_COMMIT" ]; then
              echo "::error title=Tag already names another commit::${tag} tags ${tagged}, not ${CONDA_COMMIT}, which this run pushed; the tag is left as it is and nothing is uploaded"
              exit 1
            fi
            echo "::notice title=Already tagged::${tag} already tags ${CONDA_COMMIT}, which this run pushed"
          else
            git tag "$tag" "$CONDA_COMMIT" -m"Conda Build"
          fi

      - name: Push Tag
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git push origin "conda-${PCAPKIT_VERSION}+${PCAPKIT_BUILD}"

  conda-dist:
    name: Conda deployment (update) on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [ conda-tag, conda-update ]
    # #1632, exactly as for `conda-tag` above -- this job was skipped by the
    # same implicit `success()` on the same runs.
    #
    # `needs.conda-tag.result == 'success'` strictly, with no `|| 'skipped'`
    # escape hatch of the kind create-release.yml's `conda` job grants its
    # `tag`: the checkout below pins `ref: conda-<version>+<build>`, a tag known
    # to name the pushed commit only once `conda-tag` has succeeded. There `tag`
    # skips when the tag already exists, which is a reason to carry on; here
    # `conda-tag` skips only when no bump was pushed, so carrying on would mean
    # failing in `actions/checkout` instead of skipping cleanly.
    if: >-
      !cancelled() && needs.conda-update.result == 'success' &&
      needs.conda-tag.result == 'success' &&
      needs.conda-update.outputs.CONDA_CHANGED == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          # - windows-latest  # skip for now
        # #1633: the supported tier; create-release.yml's ``conda`` job says why
        # there is no KTLO 3.10 leg.
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: conda-${{ needs.conda-update.outputs.PCAPKIT_VERSION }}+${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and Setup
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          set -x

          python -m pip install -U pip setuptools wheel
          python -m pip install -e .[all]
          python -m pip install pathlib2 typing_extensions

      - name: Install and Setup (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e .[all]
          python -m pip install pathlib2 typing_extensions

      - name: Setup Conda Distribution
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          set -x

          mkdir -p conda/wheels
          python -m pip download -r conda/requirements.txt -d conda/wheels

      - name: Setup Conda Distribution (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          mkdir -p conda/wheels
          python -m pip download -r conda/requirements.txt -d conda/wheels

      # See create-release.yml's step of the same name for the 3.15 exception.
      - name: Conda environment creation and activation
        uses: conda-incubator/setup-miniconda@v4.0.1
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        with:
          python-version: ${{ matrix.python-version != '3.15' && matrix.python-version || '' }}
          activate-environment: base
          auto-update-conda: false
          auto-activate: true
          channels: conda-forge,defaults
          conda-remove-defaults: false
          show-channel-urls: true

      - name: Install conda build tools
        run: |
          conda install -n base --override-channels -c conda-forge -y conda-build
          conda build --version

      - name: Build conda packages
        id: conda_build
        shell: bash -el {0}
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        working-directory: conda/pypcapkit
        run: |
          set -euo pipefail

          out_dir="$(mktemp -d -t compilation-XXXXXXXXXX)"
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"

          conda build . --package-format .tar.bz2 --no-anaconda-upload --output-folder "$out_dir" --python "${{ matrix.python-version }}"
          host_package="$(find "$out_dir" -type f \( -name '*.tar.bz2' -o -name '*.conda' \) -print | sort | sed -n '1p')"
          if [ -z "$host_package" ]; then
            echo "::error::No conda package was built"
            exit 1
          fi

          case "${{ matrix.os }}" in
            macos-latest)
              target_platform="osx-64"
              ;;
            ubuntu-latest)
              target_platform="linux-64"
              ;;
            windows-latest)
              target_platform="win-64"
              ;;
            *)
              target_platform=""
              ;;
          esac

          host_platform="$(basename "$(dirname "$host_package")")"
          if [ -n "$target_platform" ] && [ "$target_platform" != "$host_platform" ]; then
            conda convert "$host_package" -o "$out_dir" -p "$target_platform"
          fi

          package_paths="$(find "$out_dir" -type f \( -name '*.tar.bz2' -o -name '*.conda' \) -print | sort)"
          if [ -z "$package_paths" ]; then
            echo "::error::No conda packages were found"
            exit 1
          fi

          printf '%s\n' "$package_paths"
          package_paths_csv="$(printf '%s\n' "$package_paths" | paste -sd ',' -)"
          echo "packages_csv=$package_paths_csv" >> "$GITHUB_OUTPUT"
          {
            echo 'packages<<EOF'
            printf '%s\n' "$package_paths"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload conda packages to Anaconda
        uses: anaconda/actions/upload-package@v0.3.1
        with:
          token: ${{ secrets.ANACONDA_TOKEN }}
          channel: jarryshaw
          packages: ${{ steps.conda_build.outputs.packages }}
          labels: ${{ needs.conda-update.outputs.PCAPKIT_CONDA_LABEL }}
          force: true

      # #1634: the upload below never makes the release. ncipollo/release-action
      # v1.21.0 creates a missing one, and its tag, at ``commit``
      # (src/Action.ts:72-92), and publishes a draft, since an unset ``draft``
      # is false on update (src/Inputs.ts:210-213). A bump made while Create
      # Release waits on approval would then tag the pending version at main's
      # tip, and Create Release's tag check would fail. Only the GitHub upload
      # is skipped; the build is on anaconda.org regardless.
      - name: Check the GitHub release exists
        id: release
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PCAPKIT_RELEASE_TAG: v${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
        run: |
          errors="$(mktemp)"
          status=0
          draft="$(gh release view "$PCAPKIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$errors")" || status=$?
          if [ "$status" -eq 0 ] && [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 0 ] && [ "$draft" = true ]; then
            why="is a draft, which the upload would publish"
          elif [ "$(cat "$errors")" = 'release not found' ]; then
            why="does not exist, and the upload would create it"
          else
            cat "$errors" >&2
            echo "::error title=Could not read ${PCAPKIT_RELEASE_TAG}::gh release view exited ${status}."
            exit 1
          fi
          echo "::notice title=No GitHub upload for ${PCAPKIT_RELEASE_TAG}::${PCAPKIT_RELEASE_TAG} ${why}, tagging main's tip. Create Release makes it, at the commit its run was created for (#1634); this build is on anaconda.org only."
          echo "published=false" >> "$GITHUB_OUTPUT"

      # ``commit`` is sent to Update a release as ``target_commitish``
      # (src/Action.ts:107-120, src/Releases.ts:150-174), and
      # ``github.ref_name`` is the default branch on both triggers here, so
      # GitHub's workflow-file rule checks main, not the commit Create Release
      # made the release at. The tag stays: the target is "Unused if the Git
      # tag already exists" (REST docs, Update a release).
      - name: Upload package to GitHub Release
        if: ${{ matrix.os == 'ubuntu-latest' && steps.release.outputs.published == 'true' }}
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: ${{ steps.conda_build.outputs.packages_csv }}
          commit: ${{ github.ref_name }}
          tag: "v${{ needs.conda-update.outputs.PCAPKIT_VERSION }}"
          token: "${{ secrets.GITHUB_TOKEN }}"
