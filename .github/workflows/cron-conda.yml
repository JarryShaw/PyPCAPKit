name: "Conda Update"

permissions:
  contents: read

on:
  schedule:
    - cron: '0 10 * * 6' # everyday at 10am
  # No `push: branches: [main]` here. `unit-tests.yml`'s own push trigger
  # already runs the full matrix for this commit; calling it again below with
  # `gate-only: true` re-ran the single-version "Gate" job a second time for
  # the same tree (#715). Chaining off `Unit Tests`' completion means the gate
  # never runs twice, and `conda-update` below just reads the verdict that
  # already exists. `.event == 'push'` is checked in that job's `if` rather
  # than here, because `workflow_run` fires for a pull request's completion
  # too and a `branches:` filter here would be the only thing stopping that.
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]

# This workflow commits and pushes, so a cancelled run can leave the bump
# half-applied. Kept keyed on the ref, unlike the validation workflows: this
# publishes to Anaconda, and letting two runs upload the same version
# concurrently is worse than dropping a superseded duplicate.
#
# Note this group is not what serialises the repository writes -- the
# `conda-update` job below carries its own `repository-maintenance` group, shared
# with cron-vendor, and that is what actually stops two jobs committing at once.
concurrency:
  group: conda-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only earns its runners on the schedule trigger now: `Unit Tests` has no
  # schedule trigger of its own, so Saturday's cron run is the one case left
  # where nothing else has already verified this tree. `workflow_run` carries
  # its own verdict instead -- see `conda-update` below.
  unit-tests:
    name: Conda test gate
    if: ${{ github.event_name != 'workflow_run' }}
    permissions:
      contents: read
    uses: ./.github/workflows/unit-tests.yml
    with:
      gate-only: true

  conda-update:
    name: Update requirements.txt
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    # `needs` cannot itself be conditional, so a skipped gate (`workflow_run`)
    # has to be accepted explicitly -- by default this job would inherit the
    # skip. `!cancelled()` rather than `always()` so that cancelling the run
    # still cancels the update; a gate that actually failed still blocks.
    #
    # The `workflow_run` clause is the real gate for a push to main now: it
    # reads the verdict `Unit Tests` already reached for this exact commit
    # instead of re-running it. `.event == 'push'` and `.head_branch == 'main'`
    # both matter -- `workflow_run` fires for *every* completion of that
    # workflow, including one triggered by a pull request, and without this
    # check a green PR would upload a conda distribution built from that PR's
    # tree.
    if: >-
      !cancelled() && needs.unit-tests.result != 'failure' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      ))
    concurrency:
      group: repository-maintenance
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      - uses: actions/checkout@v7
        with:
          # Deliberately the default `github.sha` (main's tip), not
          # `github.event.workflow_run.head_sha`. Pinning to the latter once
          # ran here and CodeQL flagged it as "checkout of untrusted code in a
          # privileged context" -- `workflow_run` can also be raised by a pull
          # request's `Unit Tests` run, and that field would then be a fork's
          # commit. The `if:` above already keeps that path from reaching this
          # step, but making the ref itself always resolve to a trusted
          # default-branch commit removes the pattern outright rather than
          # relying on CodeQL tracing through the guard. The push below rebases
          # onto main's actual tip before writing regardless, so pinning to the
          # exact tested sha would have bought nothing here either.
          #
          # The push below re-points `origin` at an SSH remote and authenticates
          # with the loaded deploy key, not with this checkout's credential --
          # so there is nothing here for a persisted token to do, and one less
          # live credential for anything running in between to find.
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install and Setup
        run: |
          set -x

          python -m pip install -U pip setuptools wheel packaging
          python -m pip install -e .[all]
          #python -m pip install pathlib2 typing_extensions

      - name: Setup Conda Distribution
        run: |
          export PCAPKIT_DEVMODE=1
          export PCAPKIT_VERBOSE=1

          python util/conda-dist.py

      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@v17
        id: verify-changed-files

      - name: Bump Version
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          python util/conda-build.py

      - name: Commit Changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -am"Bumped build to $(cat conda/build)

          Updated conda distribution at $(date). The following files have been changed:
            ${{ steps.verify-changed-files.outputs.changed_files }}"

      - name: Push Changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${GITHUB_REF}"

      - name: Get Version
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        id: get_version
        run: |
          set -ex

          echo "PCAPKIT_VERSION=$(python -c 'import pcapkit; print(pcapkit.__version__)')" >> $GITHUB_OUTPUT
          echo "PCAPKIT_CONDA_LABEL=$(python -c 'from packaging.version import Version; import pcapkit; print("dev" if Version(pcapkit.__version__).is_prerelease else "main")')" >> $GITHUB_OUTPUT
          echo "PCAPKIT_BUILD=$(cat conda/build)" >> $GITHUB_OUTPUT

    outputs:
      CONDA_CHANGED: ${{ steps.verify-changed-files.outputs.files_changed }}
      PCAPKIT_VERSION: ${{ steps.get_version.outputs.PCAPKIT_VERSION }}
      PCAPKIT_CONDA_LABEL: ${{ steps.get_version.outputs.PCAPKIT_CONDA_LABEL }}
      PCAPKIT_BUILD: ${{ steps.get_version.outputs.PCAPKIT_BUILD }}

  conda-tag:
    # See create-release.yml: "(update)" keeps this apart from the Conda Tag job
    # there, which runs on the same commits.
    name: Conda Tag (update)
    runs-on: ubuntu-latest
    needs: [ conda-update ]
    if: needs.conda-update.outputs.CONDA_CHANGED == 'true'
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PYPCAPKIT }}
          fetch-depth: 0

      # `env:` rather than splicing `needs.*.outputs` straight into the script --
      # CodeQL flags the latter as code injection, since Actions substitutes
      # `${{ }}` into the script text before the shell ever parses it, so a
      # value containing shell metacharacters runs as script rather than data.
      # Routing it through `env:` and reading `$PCAPKIT_VERSION`/`$PCAPKIT_BUILD`
      # keeps it a shell variable, which the shell can only ever treat as data.
      - name: Create Tag
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        run: |
          set -x

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git pull
          git tag "conda-${PCAPKIT_VERSION}+${PCAPKIT_BUILD}" -m"Conda Build"

      - name: Push Tag
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git push origin "conda-${PCAPKIT_VERSION}+${PCAPKIT_BUILD}"

  conda-dist:
    name: Conda deployment (update) on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [ conda-tag, conda-update ]
    if: needs.conda-update.outputs.CONDA_CHANGED == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          # - windows-latest  # skip for now
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: conda-${{ needs.conda-update.outputs.PCAPKIT_VERSION }}+${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and Setup
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          set -x

          python -m pip install -U pip setuptools wheel
          python -m pip install -e .[all]
          python -m pip install pathlib2 typing_extensions

      - name: Install and Setup (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e .[all]
          python -m pip install pathlib2 typing_extensions

      - name: Setup Conda Distribution
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          set -x

          mkdir -p conda/wheels
          python -m pip download -r conda/requirements.txt -d conda/wheels

      - name: Setup Conda Distribution (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          mkdir -p conda/wheels
          python -m pip download -r conda/requirements.txt -d conda/wheels

      - name: Conda environment creation and activation
        uses: conda-incubator/setup-miniconda@v4.0.1
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: base
          auto-update-conda: false
          auto-activate: true
          channels: conda-forge,defaults
          conda-remove-defaults: false
          show-channel-urls: true

      - name: Install conda build tools
        run: |
          conda install -n base --override-channels -c conda-forge -y conda-build
          conda build --version

      - name: Build conda packages
        id: conda_build
        shell: bash -el {0}
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        working-directory: conda/pypcapkit
        run: |
          set -euo pipefail

          out_dir="$(mktemp -d -t compilation-XXXXXXXXXX)"
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"

          conda build . --package-format .tar.bz2 --no-anaconda-upload --output-folder "$out_dir" --python "${{ matrix.python-version }}"
          host_package="$(find "$out_dir" -type f \( -name '*.tar.bz2' -o -name '*.conda' \) -print | sort | sed -n '1p')"
          if [ -z "$host_package" ]; then
            echo "::error::No conda package was built"
            exit 1
          fi

          case "${{ matrix.os }}" in
            macos-latest)
              target_platform="osx-64"
              ;;
            ubuntu-latest)
              target_platform="linux-64"
              ;;
            windows-latest)
              target_platform="win-64"
              ;;
            *)
              target_platform=""
              ;;
          esac

          host_platform="$(basename "$(dirname "$host_package")")"
          if [ -n "$target_platform" ] && [ "$target_platform" != "$host_platform" ]; then
            conda convert "$host_package" -o "$out_dir" -p "$target_platform"
          fi

          package_paths="$(find "$out_dir" -type f \( -name '*.tar.bz2' -o -name '*.conda' \) -print | sort)"
          if [ -z "$package_paths" ]; then
            echo "::error::No conda packages were found"
            exit 1
          fi

          printf '%s\n' "$package_paths"
          package_paths_csv="$(printf '%s\n' "$package_paths" | paste -sd ',' -)"
          echo "packages_csv=$package_paths_csv" >> "$GITHUB_OUTPUT"
          {
            echo 'packages<<EOF'
            printf '%s\n' "$package_paths"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload conda packages to Anaconda
        uses: anaconda/actions/upload-package@v0.3.1
        with:
          token: ${{ secrets.ANACONDA_TOKEN }}
          channel: jarryshaw
          packages: ${{ steps.conda_build.outputs.packages }}
          labels: ${{ needs.conda-update.outputs.PCAPKIT_CONDA_LABEL }}
          force: true

      - name: Upload package to GitHub Release
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: ${{ steps.conda_build.outputs.packages_csv }}
          tag: "v${{ needs.conda-update.outputs.PCAPKIT_VERSION }}"
          token: "${{ secrets.GITHUB_TOKEN }}"
