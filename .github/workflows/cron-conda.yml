name: "Conda Update"

permissions:
  contents: read

on:
  # #1967: eight hours after Vendor Update, so its upload finds the release
  # Create Release made after that (#1634); cron-vendor.yml's schedule says more.
  schedule:
    - cron: '0 18 * * 6' # Saturdays at 18:00 UTC
  # No `push` trigger, and pull requests' runs refused in `conda-update`'s
  # `if`, as in cron-vendor.yml (#715).
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]

# Never cancelled in progress: a cancelled run can leave the bump half-applied,
# and two runs uploading one version to Anaconda is worse than dropping a
# superseded duplicate. Keyed as cron-vendor.yml's group is, and why (#1643);
# `conda-update`'s `repository-maintenance` group serialises the writes.
concurrency:
  group: conda-update-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

# #2030: one Discussions category holds every report with no pull request to
# comment on, one thread per job; cron-vendor.yml's `discussion` job says more.
env:
  REPORT_CATEGORY: CI reports

jobs:
  # #1967: the test gate on the schedule, `verdict` on a `workflow_run`;
  # shared with Vendor Update and GitHub Pages.
  head:
    name: Conda gate
    permissions:
      contents: read
    uses: ./.github/workflows/cron-head.yml

  conda-update:
    name: Update requirements.txt
    runs-on: ubuntu-latest
    # #1968: as for cron-vendor.yml's `vendor-update`.
    environment: conda-tag
    needs: [ head ]
    # As cron-vendor.yml's `vendor-update` (#1643); without the `push`/`main`
    # checks a green PR would upload a conda distribution built from its tree.
    if: >-
      !cancelled() && needs.head.result != 'failure' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        needs.head.outputs.verified == 'true'
      ))
    concurrency:
      group: repository-maintenance
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.sha`, and no persisted token, as in cron-vendor.yml. Whether
          # the verdict covers this commit is `head`'s question (#1643); whether
          # it covers what lands after it, Push Changes' (#1632).
          persist-credentials: false
          fetch-depth: 0

      # #1660: `latest` for this job and `conda-dist`'s versions, from
      # .github/python-versions.toml, read with the runner's own python3.
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # `.[all]` is what util/conda_vendor.py vendors (#1814), pinning each
      # package at the version installed here but for its `PLATFORM_PINS`
      # (#1827), so this install resolves the newest releases. `requests` is
      # for the next step, the script's only run that reads the network.
      - name: Install and Setup
        run: |
          set -x

          python -m pip install -U pip setuptools wheel packaging requests
          python -m pip install -e '.[all]'

      # #1851: moves each `PLATFORM_PINS` pin in conda/platform-pins.toml up to
      # PyPI's newest release with a wheel for the pinned platform, no further
      # than the one installed above, and renews its review-by date; a pin that
      # reaches the installed release goes. Not one of
      # util/verdict_covers_checkout.py's bot-managed paths, which says why
      # (#1643). An unreadable package keeps its pin, as does a pin no release
      # can move to (#2025) and a pin whose own release has lost a wheel while
      # an older one still qualifies (#2028), and each warns, as does a pin past
      # its review-by date; none fails the step. The log keeps those lines for
      # the run report (#2030); `pipefail`, so `tee` cannot hide the script's
      # own exit status.
      - name: Refresh the platform pins
        run: |
          set -o pipefail
          python util/conda_vendor.py --refresh-pins | tee "$RUNNER_TEMP/platform-pins.log"

      - name: Setup Conda Distribution
        run: |
          export PCAPKIT_DEVMODE=1
          export PCAPKIT_VERBOSE=1

          python util/conda_vendor.py

      # #1968: `git status` in place of tj-actions/verify-changed-files@v17, so
      # no third-party code runs while the deploy key is loaded. The script and
      # its outputs are cron-vendor.yml's, whose comment gives the rules.
      - name: Verify Changed files
        id: verify-changed-files
        run: |
          listing="$(git -c core.quotepath=on status --porcelain --untracked-files=all --no-renames)"
          printf '%s\n' "$listing"
          changed="$(printf '%s\n' "$listing" | cut -c4- | LC_ALL=C sort -u | paste -sd ' ' -)"
          if [ -n "$changed" ]; then
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=$changed" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Version
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          python util/conda-build.py

      - name: Commit Changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -am"Bumped build to $(cat conda/build)

          Updated conda distribution at $(date). The following files have been changed:
            $CHANGED_FILES"

      # #1632: writes `pushed` and `commit` for `conda-tag` and `conda-dist`.
      # The verdict covers `$GITHUB_SHA` only, so the commits a rebase onto the
      # fetched tip would bring in are put to #1643's rule, run from this
      # checkout. Not covered: nothing is pushed, and the tip's own Unit Tests
      # run raises this workflow again. Covered: rebase onto that same commit,
      # so what is pushed is what was judged.
      #
      # A bump counts only while `conda/build` still differs from the tip. Two
      # runs from one checkout -- the schedule and a `workflow_run`, or a
      # re-run, which uses "the same `GITHUB_SHA`" (GitHub, "Re-running
      # workflows and jobs") -- compute the same bump, and the second's rebase
      # drops it while `files_changed` still reads 'true' (Conda Update
      # 38325136710 and 38325153882, both on 2e941bbb7). Asking about the file
      # also refuses a rebase that keeps part of the commit but drops its bump,
      # which would land under a build already tagged.
      - name: Push Changes
        id: push-changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git fetch origin "${GITHUB_REF#refs/heads/}"
          tip="$(git rev-parse FETCH_HEAD)"

          status=0
          reason="$(VERDICT_SHA="$GITHUB_SHA" python3 util/verdict_covers_checkout.py --head "$tip" --exit-code)" || status=$?
          case "$status" in
            0)
              echo "$reason"
              ;;
            3)
              echo "::notice title=Not pushed as main moved past this checkout::$reason The bump is left to the Conda Update that $tip's own Unit Tests run raises."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "$reason"
              exit "$status"
              ;;
          esac

          git rebase "$tip"

          status=0
          git diff --quiet "$tip" HEAD -- conda/build || status=$?
          case "$status" in
            0)
              echo "::notice title=Build already on main::conda/build $(cat conda/build) was pushed by another run; nothing to push, tag or upload"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              commit="$(git rev-parse HEAD)"
              status=0
              git push origin "${commit}:${GITHUB_REF}" || status=$?
              if [ "$status" -ne 0 ]; then
                # #1649: a merge after the fetch makes this a non-fast-forward,
                # which ends as the rule's refusal does. Only main moved to a
                # commit lacking `$commit` is that race; main still at `$tip`,
                # main already holding `$commit`, or a failed fetch fail the step.
                git fetch origin "${GITHUB_REF#refs/heads/}" || exit "$status"
                moved="$(git rev-parse FETCH_HEAD)"
                ancestry=0
                git merge-base --is-ancestor "$commit" "$moved" || ancestry=$?
                if [ "$moved" = "$tip" ] || [ "$ancestry" -ne 1 ]; then
                  exit "$status"
                fi
                echo "::notice title=Not pushed as main moved during the push::main moved from $tip to $moved after the fetch, so $commit is not a fast-forward. The bump is left to the Conda Update that $moved's own Unit Tests run raises."
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "commit=${commit}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$status"
              ;;
          esac

      - name: Get Version
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        id: get_version
        run: |
          set -ex

          {
            echo "PCAPKIT_VERSION=$(python -c 'import pcapkit; print(pcapkit.__version__)')"
            echo "PCAPKIT_CONDA_LABEL=$(python -c 'from packaging.version import Version; import pcapkit; print("dev" if Version(pcapkit.__version__).is_prerelease else "main")')"
            echo "PCAPKIT_BUILD=$(cat conda/build)"
          } >> "$GITHUB_OUTPUT"

      # #2030: the run's outcome for the `discussion` job to post: what the pin
      # refresh moved or warned about, the files the run changed, and the build
      # it pushed. `status=warning` where a pin warned, which is what needs a
      # hand. `continue-on-error` on both, so a report never fails the bump.
      - name: Write the run report
        id: run-report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FILES_CHANGED: ${{ steps.verify-changed-files.outputs.files_changed }}
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
          PUSH: ${{ steps.push-changes.outcome }}
          COMMIT: ${{ steps.push-changes.outputs.commit }}
        run: |
          pins="$RUNNER_TEMP/platform-pins.log"
          if grep -q '^::warning title=Platform pins::' "$pins" 2> /dev/null; then
            echo "status=warning" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### Conda Update'
            echo
            if [ ! -f "$pins" ]; then
              echo '- Platform pins: not refreshed, as the job stopped first'
            elif grep -q '^::[a-z]* title=Platform pins::' "$pins"; then
              echo '- Platform pins:'
              # The workflow command's data escapes, undone; `%25` last.
              grep '^::[a-z]* title=Platform pins::' "$pins" |
                sed -e 's/^::\([a-z]*\) title=Platform pins::/  - \1: /' \
                    -e 's/%0D//g' -e 's/%0A/ /g' -e 's/%25/%/g'
            else
              echo '- Platform pins: none moved, and none warned'
            fi
            if [ "$FILES_CHANGED" = true ]; then
              echo "- Changed: $CHANGED_FILES"
            elif [ "$FILES_CHANGED" = false ]; then
              echo '- Changed: nothing, so no build was bumped'
            fi
            # `commit` is written only beside `pushed=true`.
            if [ -n "$COMMIT" ]; then
              echo "- Pushed: build $(cat conda/build) as $COMMIT"
            elif [ "$PUSH" = success ]; then
              echo "- Pushed: nothing; Push Changes' notice says why"
            elif [ "$PUSH" = failure ]; then
              echo '- Pushed: nothing, as Push Changes failed'
            elif [ "$FILES_CHANGED" != false ]; then
              echo '- Pushed: nothing, as the job stopped first'
            fi
          } > "$RUNNER_TEMP/conda-report.md"
          cat "$RUNNER_TEMP/conda-report.md"

      - name: Upload the run report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-report
          path: ${{ runner.temp }}/conda-report.md
          retention-days: 14

    outputs:
      # Not `files_changed`: see Push Changes above.
      CONDA_CHANGED: ${{ steps.push-changes.outputs.pushed }}
      # The commit Push Changes put on `main`, and the one `conda-tag` tags.
      CONDA_COMMIT: ${{ steps.push-changes.outputs.commit }}
      PCAPKIT_VERSION: ${{ steps.get_version.outputs.PCAPKIT_VERSION }}
      PCAPKIT_CONDA_LABEL: ${{ steps.get_version.outputs.PCAPKIT_CONDA_LABEL }}
      PCAPKIT_BUILD: ${{ steps.get_version.outputs.PCAPKIT_BUILD }}
      PYTHON_CONDA: ${{ steps.python-versions.outputs.conda }}
      # #2030: `warning` where a platform pin warned without failing the job.
      status: ${{ steps.run-report.outputs.status }}

  conda-tag:
    # See create-release.yml: "(update)" keeps this apart from the Conda Tag job
    # there, which runs on the same commits.
    name: Conda Tag (update)
    runs-on: ubuntu-latest
    # #1968: the deploy key and the `PYPCAPKIT` PAT are `conda-tag` environment
    # secrets, as for create-release.yml's `tag`; keep it free of reviewers.
    environment: conda-tag
    needs: [ conda-update ]
    # #1632: `!cancelled()`, since `head`'s jobs skip on every path (#1967) and
    # without a status-check function "a default status check of `success()`
    # is applied" (GitHub, "Evaluate expressions in workflows and actions").
    # The skip cascades past `conda-update`'s own `!cancelled()`: "a failure or
    # skip applies to all jobs in the dependency chain from the point of
    # failure or skip onwards" (GitHub, "Workflow syntax for GitHub Actions",
    # `jobs.<job_id>.needs`). Run 38325136710: "Update requirements.txt"
    # pushed f4f94bcad, and this job and `conda-dist` reported `skipped` with
    # their own conditions true, so the bump was never tagged or uploaded.
    #
    # `needs.conda-update.result == 'success'` restores the lost check, so a
    # failed or cancelled update, which still publishes its finished steps'
    # outputs, is never tagged. Same shape as create-release.yml's `tag` job.
    if: >-
      !cancelled() && needs.conda-update.result == 'success' &&
      needs.conda-update.outputs.CONDA_CHANGED == 'true'
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      # The commit Push Changes pushed, not main's tip, which is neither the
      # bump nor covered by this run's verdict (#1632). `fetch-depth: 0` fetches
      # "all history for all branches and tags" (actions/checkout), so Create
      # Tag sees a tag that already exists.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.conda-update.outputs.CONDA_COMMIT }}
          token: ${{ secrets.PYPCAPKIT }}
          fetch-depth: 0

      # `env:`, not `${{ }}` in the script, which CodeQL flags as code
      # injection. Tags `$CONDA_COMMIT` by name: a tag already on it is left
      # and the job stays green, so a re-run goes on to `conda-dist`; a tag on
      # another commit means the build number names another tree, so the job
      # fails, the tag stays, and nothing is uploaded under it.
      - name: Create Tag
        env:
          CONDA_COMMIT: ${{ needs.conda-update.outputs.CONDA_COMMIT }}
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        run: |
          set -x

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          tag="conda-${PCAPKIT_VERSION}+${PCAPKIT_BUILD}"
          if tagged="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
            if [ "$tagged" != "$CONDA_COMMIT" ]; then
              echo "::error title=Tag already names another commit::${tag} tags ${tagged}, not ${CONDA_COMMIT}, which this run pushed; the tag is left as it is and nothing is uploaded"
              exit 1
            fi
            echo "::notice title=Already tagged::${tag} already tags ${CONDA_COMMIT}, which this run pushed"
          else
            git tag "$tag" "$CONDA_COMMIT" -m"Conda Build"
          fi

      - name: Push Tag
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git push origin "conda-${PCAPKIT_VERSION}+${PCAPKIT_BUILD}"

  conda-dist:
    name: Conda deployment (update) on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # #1968: `ANACONDA_TOKEN` is an `anaconda` environment secret, as for
    # create-release.yml's `conda`; keep it free of reviewers.
    environment: anaconda
    needs: [ conda-tag, conda-update ]
    # #1632, as for `conda-tag`. `conda-tag` must succeed, with no `skipped`
    # escape as create-release.yml's `conda` job grants its `tag`: the checkout
    # pins the tag, which names the pushed commit only then, and `conda-tag`
    # skips only when no bump was pushed.
    if: >-
      !cancelled() && needs.conda-update.result == 'success' &&
      needs.conda-tag.result == 'success' &&
      needs.conda-update.outputs.CONDA_CHANGED == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # #1822: each leg builds and publishes its own runner's platform only,
        # as create-release.yml's `conda` job says.
        os:
          - macos-latest
          - macos-26-intel
          - ubuntu-latest
          # - windows-latest  # skip for now
        # #1633: the supported tier, from .github/python-versions.toml through
        # `conda-update` (#1660); create-release.yml's ``conda`` job says why
        # there is no KTLO 3.10 leg.
        python-version: ${{ fromJSON(needs.conda-update.outputs.PYTHON_CONDA) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: conda-${{ needs.conda-update.outputs.PCAPKIT_VERSION }}+${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # #1854: pcapkit is not installed here; see create-release.yml's step of
      # the same name.
      - name: Install and Setup
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          set -x

          python -m pip install -U pip setuptools wheel

      - name: Install and Setup (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          python -m pip install -U pip setuptools wheel

      # #1827: pip evaluates conda/requirements.txt's platform markers here,
      # on this leg's own runner, so Intel macOS fetches its own cryptography
      # pin; the recipe's build.sh installs whatever this downloaded.
      - name: Setup Conda Distribution
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          set -x

          mkdir -p conda/wheels
          python -m pip download -r conda/requirements.txt -d conda/wheels

      - name: Setup Conda Distribution (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          mkdir -p conda/wheels
          python -m pip download -r conda/requirements.txt -d conda/wheels

      # See create-release.yml's step of the same name for the 3.15 exception.
      - name: Conda environment creation and activation
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        with:
          python-version: ${{ matrix.python-version != '3.15' && matrix.python-version || '' }}
          activate-environment: base
          auto-update-conda: false
          auto-activate: true
          channels: conda-forge,defaults
          conda-remove-defaults: false
          show-channel-urls: true

      - name: Install conda build tools
        run: |
          conda install -n base --override-channels -c conda-forge -y conda-build
          conda build --version

      - name: Build conda packages
        id: conda_build
        shell: bash -el {0}
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        working-directory: conda/pypcapkit
        run: |
          set -euo pipefail

          out_dir="$(mktemp -d -t compilation-XXXXXXXXXX)"
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"

          conda build . --package-format .tar.bz2 --no-anaconda-upload --output-folder "$out_dir" --python "${{ matrix.python-version }}"
          host_package="$(find "$out_dir" -type f \( -name '*.tar.bz2' -o -name '*.conda' \) -print | sort | sed -n '1p')"
          if [ -z "$host_package" ]; then
            echo "::error::No conda package was built"
            exit 1
          fi

          case "${{ matrix.os }}" in
            macos-latest)
              target_platform="osx-arm64"
              ;;
            macos-26-intel)
              target_platform="osx-64"
              ;;
            ubuntu-latest)
              target_platform="linux-64"
              ;;
            windows-latest)
              target_platform="win-64"
              ;;
            *)
              target_platform=""
              ;;
          esac

          echo "host_package=$host_package" >> "$GITHUB_OUTPUT"

          # #1822: never `conda convert` across architectures. It relabels the
          # package and copies its binaries unchanged, so the osx-64 package it
          # made from the arm64 build carried arm64 extensions.
          host_platform="$(basename "$(dirname "$host_package")")"
          if [ "$host_platform" != "$target_platform" ]; then
            echo "::error title=${host_platform} package on a ${target_platform:-unmapped} leg (#1822)::${{ matrix.os }} publishes ${target_platform:-nothing}, and conda built ${host_platform} here; a package is published only for the platform it was built on."
            exit 1
          fi

          package_paths="$(find "$out_dir" -type f \( -name '*.tar.bz2' -o -name '*.conda' \) -print | sort)"
          if [ -z "$package_paths" ]; then
            echo "::error::No conda packages were found"
            exit 1
          fi

          printf '%s\n' "$package_paths"
          package_paths_csv="$(printf '%s\n' "$package_paths" | paste -sd ',' -)"
          echo "packages_csv=$package_paths_csv" >> "$GITHUB_OUTPUT"
          {
            echo 'packages<<EOF'
            printf '%s\n' "$package_paths"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # #1814: the package's only run requirement is Python, so it has only what
      # it vendors in `pcapkit/_extern`, and package discovery alone ships those
      # without their data files. This checks every vendored distribution has
      # every file its RECORD lists and imports from there, with no
      # site-packages on the path. #1822: it also fails unless the package and
      # every native binary in it are for this runner's platform.
      # setup-python's interpreter, not conda's: it is the matrix version the
      # package was built for, which conda's base is not on 3.15.
      - name: Smoke-test the vendored packages
        env:
          PCAPKIT_CONDA_PACKAGE: ${{ steps.conda_build.outputs.host_package }}
        run: |
          "${pythonLocation}/bin/python" util/conda_vendor.py --smoke "$PCAPKIT_CONDA_PACKAGE"

      - name: Upload conda packages to Anaconda
        uses: anaconda/actions/upload-package@a6f488910b4a1e4f3fe01736241ca1b92b4b355a # v0.3.1
        with:
          token: ${{ secrets.ANACONDA_TOKEN }}
          channel: jarryshaw
          packages: ${{ steps.conda_build.outputs.packages }}
          labels: ${{ needs.conda-update.outputs.PCAPKIT_CONDA_LABEL }}
          force: true

      # #1634: the upload below never makes the release. ncipollo/release-action
      # v1.21.0 creates a missing one, and its tag, at ``commit``
      # (src/Action.ts:72-92), so a bump made while Create Release waits on
      # approval would tag the pending version at main's tip and fail Create
      # Release's tag check. It also retargets a draft at ``commit``
      # (:85-92,107-120), though Create Release's ``workflow_run`` run resets a
      # draft's target to its sha (softprops/action-gh-release v3.0.2,
      # src/github.ts:636-646,832-866); skipping a draft is a precaution. Only
      # the GitHub upload is skipped; the build is on anaconda.org regardless.
      - name: Check the GitHub release exists
        id: release
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PCAPKIT_RELEASE_TAG: v${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
        run: |
          errors="$(mktemp)"
          status=0
          draft="$(gh release view "$PCAPKIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$errors")" || status=$?
          if [ "$status" -eq 0 ] && [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 0 ] && [ "$draft" = true ]; then
            why="is a draft, which the upload would retarget at main"
          elif [ "$(cat "$errors")" = 'release not found' ]; then
            why="does not exist, and the upload would create it, tagging main's tip"
          else
            cat "$errors" >&2
            echo "::error title=Could not read ${PCAPKIT_RELEASE_TAG}::gh release view exited ${status}."
            exit 1
          fi
          echo "::notice title=No GitHub upload for ${PCAPKIT_RELEASE_TAG}::${PCAPKIT_RELEASE_TAG} ${why}. Create Release makes it, at the commit its run was created for (#1634); this build is on anaconda.org only."
          echo "published=false" >> "$GITHUB_OUTPUT"

      # ``commit`` is sent to Update a release as ``target_commitish``
      # (src/Action.ts:107-120, src/Releases.ts:150-174), and
      # ``github.ref_name`` is the default branch on both triggers here, so
      # GitHub's workflow-file rule checks main, not the commit Create Release
      # made the release at. The tag stays: the target is "Unused if the Git
      # tag already exists" (REST docs, Update a release).
      #
      # #1657: that update also sends ``name``, ``body``, ``prerelease`` and
      # ``draft``, which unset inputs make the tag, "" and false
      # (src/Inputs.ts:70-92,128-135,210-240), so each bump wiped the release's
      # name and notes. Each ``omit*DuringUpdate`` leaves its field undefined
      # (:210-252), and Octokit drops it (dist/index.js:38369-38388).
      - name: Upload package to GitHub Release
        if: ${{ matrix.os == 'ubuntu-latest' && steps.release.outputs.published == 'true' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifacts: ${{ steps.conda_build.outputs.packages_csv }}
          commit: ${{ github.ref_name }}
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          tag: "v${{ needs.conda-update.outputs.PCAPKIT_VERSION }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

  # #2030: posts `conda-update`'s report with the tag and upload results, and a
  # short one of its own where `head` failed or was cancelled, as cron-vendor.yml's
  # `discussion` job does, whose comment gives the rules. It waits for
  # `conda-dist`, so the report says whether the build reached Anaconda.
  discussion:
    name: Post the conda report
    needs: [ head, conda-update, conda-tag, conda-dist ]
    if: >-
      ${{ always() && (needs.conda-update.result != 'skipped' ||
      needs.head.result == 'failure' || needs.head.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A run that never wrote a report uploaded none; the script then warns.
      - name: Download the report
        if: needs.conda-update.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-report
          path: report

      # As cron-vendor.yml's: a `workflow_run` posts as a push run, the
      # schedule every run. A failed tag or upload fails the report too, and a
      # green `conda-update` that warned reports `warning`.
      - name: Post the report to Discussions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_run' && 'push' || 'scheduled' }}
          HEAD_RESULT: ${{ needs.head.result }}
          UPDATE_RESULT: ${{ needs.conda-update.result }}
          UPDATE_STATUS: ${{ needs.conda-update.outputs.status }}
          TAG_RESULT: ${{ needs.conda-tag.result }}
          DIST_RESULT: ${{ needs.conda-dist.result }}
        run: |
          if [ "$UPDATE_RESULT" = skipped ]; then
            status="$HEAD_RESULT"
            mkdir -p report
            {
              echo '### Conda Update'
              echo
              echo "- Gate: $HEAD_RESULT, so conda-update did not run and nothing was built or pushed"
            } > report/conda-report.md
          else
            if [ "$UPDATE_RESULT" != success ]; then
              status="$UPDATE_RESULT"
            elif [ "$TAG_RESULT" = failure ] || [ "$DIST_RESULT" = failure ]; then
              status=failure
            elif [ "$TAG_RESULT" = cancelled ] || [ "$DIST_RESULT" = cancelled ]; then
              status=cancelled
            else
              status="${UPDATE_STATUS:-success}"
            fi
            # Both skip unless a build was pushed.
            if [ "$TAG_RESULT" != skipped ] && [ -f report/conda-report.md ]; then
              {
                echo "- Tag: $TAG_RESULT"
                echo "- Upload: $DIST_RESULT"
              } >> report/conda-report.md
            fi
          fi
          python3 util/discussion_report.py --category "$REPORT_CATEGORY" \
            --title 'cron-conda: conda distribution update report' --report report/conda-report.md \
            --mode "$MODE" --status "$status"
