name: "Conda Update"

permissions:
  contents: read

on:
  # #1967: eight hours after Vendor Update, so its upload finds the release
  # Create Release made after that (#1634); cron-vendor.yml's schedule says more.
  schedule:
    - cron: '0 18 * * 6' # Saturdays at 18:00 UTC
  # No `push` trigger, and pull requests' runs refused in `conda-update`'s
  # `if`, as in cron-vendor.yml (#715).
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]
  # A build-only run of the dispatched ref, so the schedule's build and smoke
  # tests can be debugged without waiting for Saturday: `conda-update`
  # refreshes and bumps but pushes nothing, and
  # `conda-build` builds that tree. No step that pushes, tags, uploads or posts
  # runs, and no job enters an environment -- unless `publish` is set (#2060),
  # which `mode` refuses off `main`, and which then publishes as a scheduled
  # bump does, with the build bumped even when nothing changed.
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish main's released version: bump the build even when nothing
          changed, push and tag the bump, then build the v<version> tag's tree,
          upload the noarch package and post the report. Refused on any other ref,
          and where main's version has no v tag or names other dependencies.
          Unset, the run only builds.
        type: boolean
        required: false
        default: false

# Never cancelled in progress: a cancelled run can leave the bump half-applied,
# and two runs uploading one version to Anaconda is worse than dropping a
# superseded duplicate. Keyed as cron-vendor.yml's group is, and why (#1643);
# `conda-update`'s `repository-maintenance` group serialises the writes. A manual
# run is keyed on itself here, so it never displaces a pending scheduled run.
# One without `publish` writes nothing, so it is keyed on itself in
# `conda-update` too, as in cron-vendor.yml; one with it joins that group.
concurrency:
  group: conda-update-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

# #2030: one Discussions category holds every report with no pull request to
# comment on, one thread per job; cron-vendor.yml's `discussion` job says more.
env:
  REPORT_CATEGORY: CI reports

jobs:
  # #2060: whether this run publishes, and the only job reading the `publish`
  # input. `publishes` is 'true' on the schedule, on a `workflow_run`, and on a
  # manual run with `publish` from `main`; 'false' on any other manual run. One
  # with `publish` from another ref fails here, which fails the run and stops
  # `conda-update` and every job after it. Each step and job that pushes,
  # tags, uploads, posts or names an environment opens only on a 'true', so
  # this job's skip on a pull request's Unit Tests run, which `conda-update`
  # refuses anyway, publishes nothing either.
  mode:
    name: Conda run mode
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      publishes: ${{ steps.mode.outputs.publishes }}
    steps:
      - name: Decide whether this run publishes
        id: mode
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "publishes=true" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" != true ]; then
            echo "publishes=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "::notice title=Publishing manual run::publish is set on main, so this run bumps the build and pushes, tags, uploads and posts as a scheduled bump does"
            echo "publishes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=publish is for main only::${GITHUB_REF} was dispatched with publish set; dispatch main to publish, or leave publish unset for a build-only run"
            exit 1
          fi

  # #1967: the test gate on the schedule and a manual run, `verdict` on a
  # `workflow_run`; shared with Vendor Update and GitHub Pages, and called the
  # same way from each, so it does not wait for `mode`.
  head:
    name: Conda gate
    permissions:
      contents: read
    uses: ./.github/workflows/cron-head.yml

  conda-update:
    name: Update requirements.txt
    runs-on: ubuntu-latest
    # #1968: as for cron-vendor.yml's `vendor-update`, which says why a
    # manual run names none; one with `publish` does (#2060).
    environment: ${{ needs.mode.outputs.publishes == 'true' && 'conda-tag' || '' }}
    needs: [ head, mode ]
    # As cron-vendor.yml's `vendor-update` (#1643); without the `push`/`main`
    # checks a green PR would upload a conda distribution built from its tree.
    # `mode` must succeed, so a refused manual run builds nothing.
    if: >-
      !cancelled() && needs.mode.result == 'success' && needs.head.result != 'failure' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        needs.head.outputs.verified == 'true'
      ))
    concurrency:
      group: ${{ needs.mode.outputs.publishes == 'true' && 'repository-maintenance' || format('repository-maintenance-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        if: needs.mode.outputs.publishes == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.sha`, and no persisted token, as in cron-vendor.yml. Whether
          # the verdict covers this commit is `head`'s question (#1643); whether
          # it covers what lands after it, Push Changes' (#1632).
          persist-credentials: false
          fetch-depth: 0

      # #1660: `latest` for this job and `conda-build`, `conda-test`'s versions, from
      # .github/python-versions.toml, read with the runner's own python3.
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # The core dependencies are what util/conda_vendor.py vendors, but for
      # those conda-forge has (#1814, #3133), pinning each at the version
      # installed here, so this install resolves the newest releases.
      - name: Install and Setup
        run: |
          set -x

          python -m pip install -U pip setuptools wheel packaging
          python -m pip install -e .

      - name: Setup Conda Distribution
        run: |
          export PCAPKIT_DEVMODE=1
          export PCAPKIT_VERBOSE=1

          python util/conda_vendor.py

      # #1968: `git status` in place of tj-actions/verify-changed-files@v17, so
      # no third-party code runs while the deploy key is loaded. The script and
      # its outputs are cron-vendor.yml's, whose comment gives the rules.
      - name: Verify Changed files
        id: verify-changed-files
        run: |
          listing="$(git -c core.quotepath=on status --porcelain --untracked-files=all --no-renames)"
          printf '%s\n' "$listing"
          changed="$(printf '%s\n' "$listing" | cut -c4- | LC_ALL=C sort -u | paste -sd ' ' -)"
          if [ -n "$changed" ]; then
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=$changed" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # #2060: a manual run with `publish` bumps even when nothing changed, so
      # its build is one Anaconda has no file for and `conda-dist`
      # uploads; util/conda_vendor.py regenerates the same recipe when no
      # dependency moved. Any other run bumps only on a change. `forced` says
      # which, for Push Changes and the run report: no later run repeats a
      # forced bump that is not pushed.
      - name: Decide whether to bump
        id: bump
        env:
          FILES_CHANGED: ${{ steps.verify-changed-files.outputs.files_changed }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' && needs.mode.outputs.publishes == 'true' }}
        run: |
          if [ "$FILES_CHANGED" = true ] || [ "$FORCED" = true ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi
          echo "forced=$FORCED" >> "$GITHUB_OUTPUT"

      # #2841: every publishing bump is built from the tree `v<version>` names,
      # so unreleased code on main never ships under a released version. With
      # no such tag, as for a dev version, a forced bump fails here before
      # anything is pushed, and any other bump is pushed but neither tagged nor
      # uploaded. The checkout's `fetch-depth: 0` brings every tag.
      - name: Find the release tag
        id: release-tag
        if: needs.mode.outputs.publishes == 'true' && steps.bump.outputs.bump == 'true'
        env:
          FORCED: ${{ steps.bump.outputs.forced }}
        run: |
          version="$(python -c 'import pcapkit; print(pcapkit.__version__)')"
          tag="v${version}"
          if ! commit="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
            if [ "$FORCED" = true ]; then
              echo "::error title=No ${tag} tag::main's version is ${version}, which no ${tag} tag names, so there is no released tree to publish; a manual run with publish republishes only a released version"
              exit 1
            fi
            echo "::notice title=No ${tag} tag::main's version is ${version}, which no ${tag} tag names, so the bump is pushed but neither tagged nor uploaded: a conda build packages only a released version's tree"
            exit 0
          fi
          echo "::notice title=Publishing ${tag}::this run builds ${tag}'s tree, ${commit}, under the build it bumps on main"
          {
            echo "tag=${tag}"
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"

      # #2841: the tag's tree is built with the bump's vendored requirements,
      # derived from main's pyproject.toml, so a release whose dependencies
      # main has since changed is not built. A forced bump fails here, before
      # anything is pushed; any other warns, and is pushed but neither tagged
      # nor uploaded, as an untagged version is. Only a match hands on the tag.
      - name: Check the release tag's dependencies
        id: release-deps
        if: steps.release-tag.outputs.tag != ''
        env:
          FORCED: ${{ steps.bump.outputs.forced }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release-tag.outputs.commit }}
        run: |
          status=0
          reason="$(python util/conda_vendor.py --same-dependencies "$RELEASE_TAG")" || status=$?
          case "$status" in
            0)
              echo "$reason"
              {
                echo "same=true"
                echo "tag=${RELEASE_TAG}"
                echo "commit=${RELEASE_COMMIT}"
              } >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "same=false" >> "$GITHUB_OUTPUT"
              if [ "$FORCED" = true ]; then
                echo "::error title=Dependencies differ from ${RELEASE_TAG}::$reason A manual run with publish therefore publishes nothing."
                exit 1
              fi
              echo "::warning title=Dependencies differ from ${RELEASE_TAG}::$reason The bump is pushed but neither tagged nor uploaded."
              ;;
            *)
              echo "$reason"
              exit "$status"
              ;;
          esac

      - name: Bump Version
        if: steps.bump.outputs.bump == 'true'
        run: |
          python util/conda-build.py

      # #2841: the message records the tree the build packages, which the
      # `conda-*` tag on this commit cannot.
      - name: Commit Changes
        if: steps.bump.outputs.bump == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
          RELEASE_TAG: ${{ steps.release-deps.outputs.tag }}
        run: |
          provenance=""
          if [ -n "$RELEASE_TAG" ]; then
            provenance="

          The build packages ${RELEASE_TAG}'s tree, with conda/ and util/ from this commit."
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -am"Bumped build to $(cat conda/build)

          Updated conda distribution at $(date). The following files have been changed:
            ${CHANGED_FILES:-none, as a manual run with publish bumps regardless}${provenance}"

      # #1632: writes `pushed` and `commit` for `conda-tag`, `conda-build` and `conda-dist`.
      # The verdict covers `$GITHUB_SHA` only, so the commits a rebase onto the
      # fetched tip would bring in are put to #1643's rule, run from this
      # checkout. Not covered: nothing is pushed, and the tip's own Unit Tests
      # run raises this workflow again. Covered: rebase onto that same commit,
      # so what is pushed is what was judged.
      #
      # A bump counts only while `conda/build` still differs from the tip. Two
      # runs from one checkout -- the schedule and a `workflow_run`, or a
      # re-run, which uses "the same `GITHUB_SHA`" (GitHub, "Re-running
      # workflows and jobs") -- compute the same bump, and the second's rebase
      # drops it while `files_changed` still reads 'true' (Conda Update
      # 38325136710 and 38325153882, both on 2e941bbb7). Asking about the file
      # also refuses a rebase that keeps part of the commit but drops its bump,
      # which would land under a build already tagged.
      #
      # #2060: a forced bump is one no later run repeats, so where it is not
      # pushed each notice is a warning instead: nothing was published, and
      # Conda Update has to be dispatched again with `publish` on `main`, which
      # builds the release tag's tree whatever main has merged since (#2841).
      # Where another run already pushed the build, that run tags and uploads it.
      - name: Push Changes
        id: push-changes
        if: needs.mode.outputs.publishes == 'true' && steps.bump.outputs.bump == 'true'
        env:
          FORCED: ${{ steps.bump.outputs.forced }}
          RELEASE_TAG: ${{ steps.release-deps.outputs.tag }}
        run: |
          again="dispatch Conda Update again with publish on main, which builds ${RELEASE_TAG}'s tree, not main's"
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git fetch origin "${GITHUB_REF#refs/heads/}"
          tip="$(git rev-parse FETCH_HEAD)"

          status=0
          reason="$(VERDICT_SHA="$GITHUB_SHA" python3 util/verdict_covers_checkout.py --head "$tip" --exit-code)" || status=$?
          case "$status" in
            0)
              echo "$reason"
              ;;
            3)
              if [ "$FORCED" = true ]; then
                echo "::warning title=Nothing published as main moved past this checkout::$reason No later run repeats this forced bump, so nothing was published: $again."
              else
                echo "::notice title=Not pushed as main moved past this checkout::$reason The bump is left to the Conda Update that $tip's own Unit Tests run raises."
              fi
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "$reason"
              exit "$status"
              ;;
          esac

          git rebase "$tip"

          status=0
          git diff --quiet "$tip" HEAD -- conda/build || status=$?
          case "$status" in
            0)
              if [ "$FORCED" = true ]; then
                echo "::warning title=Nothing published as the build is already on main::conda/build $(cat conda/build) was pushed by another run, which tags and uploads it, so this run published nothing; if that run did not publish it, $again"
              else
                echo "::notice title=Build already on main::conda/build $(cat conda/build) was pushed by another run; nothing to push, tag or upload"
              fi
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              commit="$(git rev-parse HEAD)"
              status=0
              git push origin "${commit}:${GITHUB_REF}" || status=$?
              if [ "$status" -ne 0 ]; then
                # #1649: a merge after the fetch makes this a non-fast-forward,
                # which ends as the rule's refusal does. Only main moved to a
                # commit lacking `$commit` is that race; main still at `$tip`,
                # main already holding `$commit`, or a failed fetch fail the step.
                git fetch origin "${GITHUB_REF#refs/heads/}" || exit "$status"
                moved="$(git rev-parse FETCH_HEAD)"
                ancestry=0
                git merge-base --is-ancestor "$commit" "$moved" || ancestry=$?
                if [ "$moved" = "$tip" ] || [ "$ancestry" -ne 1 ]; then
                  exit "$status"
                fi
                if [ "$FORCED" = true ]; then
                  echo "::warning title=Nothing published as main moved during the push::main moved from $tip to $moved after the fetch, so $commit is not a fast-forward. No later run repeats this forced bump, so nothing was published: $again."
                else
                  echo "::notice title=Not pushed as main moved during the push::main moved from $tip to $moved after the fetch, so $commit is not a fast-forward. The bump is left to the Conda Update that $moved's own Unit Tests run raises."
                fi
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "commit=${commit}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$status"
              ;;
          esac

      # A build-only run builds whether or not anything changed.
      #
      # #2458: `PCAPKIT_DEV_RELEASE` is `is_devrelease`, not `is_prerelease` --
      # the latter is also `true` for a deliberately-tagged alpha/beta/rc this
      # project has shipped for real (e.g. 1.5.0b14), and gating on it would
      # silently block one. `is_devrelease` is `true` only for a PEP 440
      # dev-release suffix (X.Y.Z.devN), the work-in-progress signal `conda-tag`
      # and the conda jobs read below so that a scheduled or `workflow_run`
      # trigger never tags or uploads a dev version with no human in the path.
      # Independent of the equivalent `PCAPKIT_DEV_RELEASE` gate proposed for
      # create-release.yml's `version_check` job in #2452 (not yet merged):
      # this workflow has no `version_check` job to share that output with,
      # so it is computed here too.
      - name: Get Version
        if: steps.bump.outputs.bump == 'true' || needs.mode.outputs.publishes != 'true'
        id: get_version
        run: |
          set -ex

          {
            echo "PCAPKIT_VERSION=$(python -c 'import pcapkit; print(pcapkit.__version__)')"
            echo "PCAPKIT_DEV_RELEASE=$(python -c 'from packaging.version import Version; import pcapkit; print(str(Version(pcapkit.__version__).is_devrelease).lower())')"
            echo "PCAPKIT_CONDA_LABEL=$(python -c 'from packaging.version import Version; import pcapkit; print("dev" if Version(pcapkit.__version__).is_prerelease else "main")')"
            echo "PCAPKIT_BUILD=$(cat conda/build)"
          } >> "$GITHUB_OUTPUT"

      # A build-only run pushes nothing, so `conda-build` gets this job's changes
      # as a patch on the dispatched commit. The first line keeps the file from
      # being empty when nothing changed.
      - name: Save the changes for conda-build
        if: needs.mode.outputs.publishes != 'true'
        run: |
          {
            echo "Conda Update's changes to $GITHUB_SHA"
            git diff --binary "$GITHUB_SHA"
          } > "$RUNNER_TEMP/conda-changes.patch"

      - name: Upload the changes for conda-build
        if: needs.mode.outputs.publishes != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-changes
          path: ${{ runner.temp }}/conda-changes.patch
          retention-days: 1

      # #2030: the run's outcome for the `discussion` job to post: the files
      # the run changed, and the build it pushed. `status=warning` where a
      # forced bump was not pushed (#2060), which is what needs a hand.
      # `continue-on-error` on both, so a report never fails the bump.
      - name: Write the run report
        id: run-report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PUBLISHES: ${{ needs.mode.outputs.publishes }}
          BUMP: ${{ steps.bump.outputs.bump }}
          FORCED: ${{ steps.bump.outputs.forced }}
          FILES_CHANGED: ${{ steps.verify-changed-files.outputs.files_changed }}
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
          PUSH: ${{ steps.push-changes.outcome }}
          COMMIT: ${{ steps.push-changes.outputs.commit }}
          # #2841: 'false' where the release tag names other dependencies.
          SAME_DEPENDENCIES: ${{ steps.release-deps.outputs.same }}
        run: |
          if [ "$FORCED" = true ] && [ -z "$COMMIT" ]; then
            echo "status=warning" >> "$GITHUB_OUTPUT"
          elif [ "$SAME_DEPENDENCIES" = false ]; then
            echo "status=warning" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### Conda Update'
            echo
            if [ "$FILES_CHANGED" = true ]; then
              echo "- Changed: $CHANGED_FILES"
            elif [ "$BUMP" = true ]; then
              echo '- Changed: nothing, and the build was bumped anyway, as a manual run with publish asks'
            elif [ "$FILES_CHANGED" = false ]; then
              echo '- Changed: nothing, so no build was bumped'
            fi
            # `commit` is written only beside `pushed=true`.
            if [ "$PUBLISHES" != true ]; then
              echo '- Pushed: nothing, as a manual run only builds'
            elif [ -n "$COMMIT" ]; then
              echo "- Pushed: build $(cat conda/build) as $COMMIT"
            elif [ "$PUSH" = success ] && [ "$FORCED" = true ]; then
              echo "- Pushed: nothing, so this manual run with publish published nothing; Push Changes' warning says why, and when to dispatch it again"
            elif [ "$PUSH" = success ]; then
              echo "- Pushed: nothing; Push Changes' notice says why"
            elif [ "$PUSH" = failure ]; then
              echo '- Pushed: nothing, as Push Changes failed'
            elif [ "$FILES_CHANGED" != false ]; then
              echo '- Pushed: nothing, as the job stopped first'
            fi
          } > "$RUNNER_TEMP/conda-report.md"
          cat "$RUNNER_TEMP/conda-report.md"

      - name: Upload the run report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-report
          path: ${{ runner.temp }}/conda-report.md
          retention-days: 14

    outputs:
      # Not `files_changed`: see Push Changes above.
      CONDA_CHANGED: ${{ steps.push-changes.outputs.pushed }}
      # The commit Push Changes put on `main`, and the one `conda-tag` tags.
      CONDA_COMMIT: ${{ steps.push-changes.outputs.commit }}
      # #2841: the commit `v<version>` names, written on a publishing bump whose
      # version has that tag and its dependencies, and the tree `conda-build`
      # then builds. The tag is written wherever it was found, so the report can
      # say which of the two left the commit unwritten.
      PCAPKIT_RELEASE_COMMIT: ${{ steps.release-deps.outputs.commit }}
      PCAPKIT_RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
      PCAPKIT_VERSION: ${{ steps.get_version.outputs.PCAPKIT_VERSION }}
      # #2458: read by `conda-tag` and the conda jobs below, to block tagging and
      # uploading a dev-release version.
      PCAPKIT_DEV_RELEASE: ${{ steps.get_version.outputs.PCAPKIT_DEV_RELEASE }}
      PCAPKIT_CONDA_LABEL: ${{ steps.get_version.outputs.PCAPKIT_CONDA_LABEL }}
      PCAPKIT_BUILD: ${{ steps.get_version.outputs.PCAPKIT_BUILD }}
      PYTHON_LATEST: ${{ steps.python-versions.outputs.latest }}
      # #3133: `conda-test`'s Python axis, and the entries marking its KTLO legs.
      PYTHON_CONDA: ${{ steps.python-versions.outputs.conda }}
      PYTHON_CONDA_KTLO: ${{ steps.python-versions.outputs.conda-ktlo }}
      # #2030: `warning` where the run needs a hand without failing the job.
      status: ${{ steps.run-report.outputs.status }}

  conda-tag:
    # See create-release.yml: "(update)" keeps this apart from the Conda Tag job
    # there, which runs on the same commits.
    name: Conda Tag (update)
    runs-on: ubuntu-latest
    # #1968: the deploy key and the `PYPCAPKIT` PAT are `conda-tag` environment
    # secrets, as for create-release.yml's `tag`; keep it free of reviewers.
    environment: conda-tag
    needs: [ conda-update, mode ]
    # #1632: `!cancelled()`, since `head`'s jobs skip on every path (#1967) and
    # without a status-check function "a default status check of `success()`
    # is applied" (GitHub, "Evaluate expressions in workflows and actions").
    # The skip cascades past `conda-update`'s own `!cancelled()`: "a failure or
    # skip applies to all jobs in the dependency chain from the point of
    # failure or skip onwards" (GitHub, "Workflow syntax for GitHub Actions",
    # `jobs.<job_id>.needs`). Run 38325136710: "Update requirements.txt"
    # pushed f4f94bcad, and this job and `conda-dist` reported `skipped` with
    # their own conditions true, so the bump was never tagged or uploaded.
    #
    # `needs.conda-update.result == 'success'` restores the lost check, so a
    # failed or cancelled update, which still publishes its finished steps'
    # outputs, is never tagged. Same shape as create-release.yml's `tag` job.
    #
    # Never on a build-only run, which pushed nothing to tag.
    #
    # #2458: nor on a dev-release version (`__version__` carrying a PEP 440
    # `.devN` suffix) -- a scheduled run or the `workflow_run` trigger above is
    # enough to reach this job with no human in the path, which mirrors the
    # equivalent gate proposed for create-release.yml's publishers in #2452
    # (not yet merged).
    #
    # #2841: nor without a `v<version>` tag whose tree it can build: none, or
    # one naming other dependencies than main, as conda-update's steps say.
    if: >-
      !cancelled() && needs.mode.outputs.publishes == 'true' &&
      needs.conda-update.result == 'success' &&
      needs.conda-update.outputs.CONDA_CHANGED == 'true' &&
      needs.conda-update.outputs.PCAPKIT_RELEASE_COMMIT != '' &&
      needs.conda-update.outputs.PCAPKIT_DEV_RELEASE != 'true'
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      # The commit Push Changes pushed, not main's tip, which is neither the
      # bump nor covered by this run's verdict (#1632). `fetch-depth: 0` fetches
      # "all history for all branches and tags" (actions/checkout), so Create
      # Tag sees a tag that already exists.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.conda-update.outputs.CONDA_COMMIT }}
          token: ${{ secrets.PYPCAPKIT }}
          fetch-depth: 0

      # `env:`, not `${{ }}` in the script, which CodeQL flags as code
      # injection. Tags `$CONDA_COMMIT` by name: a tag already on it is left
      # and the job stays green, so a re-run goes on to `conda-build`; a tag on
      # another commit means the build number names another tree, so the job
      # fails, the tag stays, and nothing is uploaded under it.
      - name: Create Tag
        env:
          CONDA_COMMIT: ${{ needs.conda-update.outputs.CONDA_COMMIT }}
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        run: |
          set -x

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          tag="conda-${PCAPKIT_VERSION}+${PCAPKIT_BUILD}"
          if tagged="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
            if [ "$tagged" != "$CONDA_COMMIT" ]; then
              echo "::error title=Tag already names another commit::${tag} tags ${tagged}, not ${CONDA_COMMIT}, which this run pushed; the tag is left as it is and nothing is uploaded"
              exit 1
            fi
            echo "::notice title=Already tagged::${tag} already tags ${CONDA_COMMIT}, which this run pushed"
          else
            git tag "$tag" "$CONDA_COMMIT" -m"Conda Build"
          fi

      - name: Push Tag
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git push origin "conda-${PCAPKIT_VERSION}+${PCAPKIT_BUILD}"

  # #3133: the one `noarch: python` package, as create-release.yml builds,
  # tests and publishes it: `conda-build` builds it once, `conda-test` installs
  # that file on each platform and Python, and `conda-dist` publishes it once
  # every supported leg passed. A build-only run builds and tests alone.
  conda-build:
    name: Conda build (update)
    runs-on: ubuntu-latest
    # No `environment:`: it builds, and publishes nothing.
    needs: [ conda-tag, conda-update, mode ]
    # #1632, as for `conda-tag`. `conda-tag` must succeed, with no `skipped`
    # escape as create-release.yml's conda jobs grant its `tag`: the checkout
    # pins the tag, which names the pushed commit only then, and `conda-tag`
    # skips only when no bump was pushed. A build-only run, which never tags,
    # builds the dispatched commit with `conda-update`'s changes applied.
    #
    # #2458: the dev-release check is checked again here, inside the
    # publishing branch only, so a build-only run still builds and
    # smoke-tests a dev version -- it uploads nothing regardless. On the
    # publishing path it is also redundant with `conda-tag`'s own gate, which
    # already leaves `needs.conda-tag.result` at `'skipped'` rather than
    # `'success'`; kept explicit anyway, mirroring how the equivalent gate
    # proposed for create-release.yml's publishers in #2452 (not yet merged)
    # has each read it rather than relying on one another's cascade. #2841's
    # release commit is read again the same way.
    if: >-
      !cancelled() && needs.conda-update.result == 'success' &&
      (needs.mode.outputs.publishes != 'true' || (
        needs.conda-tag.result == 'success' &&
        needs.conda-update.outputs.CONDA_CHANGED == 'true' &&
        needs.conda-update.outputs.PCAPKIT_RELEASE_COMMIT != '' &&
        needs.conda-update.outputs.PCAPKIT_DEV_RELEASE != 'true'
      ))
    permissions:
      contents: read
    steps:
      # No persisted token: nothing here runs `git` with credentials (#2060).
      - id: checkout
        if: needs.mode.outputs.publishes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: conda-${{ needs.conda-update.outputs.PCAPKIT_VERSION }}+${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
          fetch-depth: 0
          persist-credentials: false

      # A build-only run: no tag exists, so the dispatched commit, and then the
      # changes `conda-update` made to it and did not push.
      - id: checkout-dispatched
        if: needs.mode.outputs.publishes != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download conda-update's changes
        id: download-changes
        if: needs.mode.outputs.publishes != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-changes
          path: ${{ runner.temp }}/conda-changes

      - name: Apply conda-update's changes
        id: apply-changes
        if: needs.mode.outputs.publishes != 'true'
        shell: bash
        env:
          PATCH_FILE: ${{ runner.temp }}/conda-changes/conda-changes.patch
        run: |
          if grep -q '^diff --git ' "$PATCH_FILE"; then
            git apply "$PATCH_FILE"
          fi

      # #2841: a publishing run builds the tree `v<version>` names, and takes
      # only conda/ and util/ from the bump checked out above: the build number,
      # vendored requirements and recipe that can build what the tag's own legs
      # could not (#2140), and the scripts these steps call. `git restore` also
      # deletes a file there that the bump lacks.
      - name: Check out the release tag's tree
        id: release-tree
        if: needs.mode.outputs.publishes == 'true' && needs.conda-update.outputs.PCAPKIT_RELEASE_COMMIT != ''
        shell: bash
        env:
          PCAPKIT_RELEASE_COMMIT: ${{ needs.conda-update.outputs.PCAPKIT_RELEASE_COMMIT }}
        run: |
          bump="$(git rev-parse HEAD)"
          git checkout --quiet --detach "$PCAPKIT_RELEASE_COMMIT"
          git restore --source="$bump" --staged --worktree -- conda util

      - id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.conda-update.outputs.PYTHON_LATEST }}

      # #1854: pcapkit is not installed here; see create-release.yml's step of
      # the same name.
      - name: Install and Setup
        id: install
        shell: bash
        run: |
          set -x

          python -m pip install -U pip setuptools wheel

      # The recipe's build.sh installs whatever this downloaded.
      - name: Setup Conda Distribution
        id: download
        shell: bash
        run: |
          set -x

          mkdir -p conda/wheels
          python -m pip download -r conda/requirements.txt -d conda/wheels

      # Base keeps its own Python, as in create-release.yml's step of the same name.
      - name: Conda environment creation and activation
        id: miniconda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
        with:
          activate-environment: base
          auto-update-conda: false
          auto-activate: true
          channels: conda-forge,defaults
          conda-remove-defaults: false
          show-channel-urls: true

      # A login shell, as for the build below, which activates base.
      - name: Install conda build tools
        id: conda-build-tools
        shell: bash -el {0}
        run: |
          conda install -n base --override-channels -c conda-forge -y conda-build
          conda build --version

      # #1967: util/release_conda.py, as create-release.yml's step of the same
      # name, on conda's base `python`, which the login shell activates. #1822:
      # it fails a package built for another platform than noarch.
      - name: Build conda packages
        id: conda_build
        shell: bash -el {0}
        env:
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
          PCAPKIT_BUILD: ${{ needs.conda-update.outputs.PCAPKIT_BUILD }}
          PCAPKIT_CONDA_OS: ubuntu-latest
          PCAPKIT_PYTHON_VERSION: ${{ needs.conda-update.outputs.PYTHON_LATEST }}
        working-directory: conda/pypcapkit
        run: python ../../util/release_conda.py build

      # #1814: package discovery alone ships the vendored distributions in
      # `pcapkit/_extern` without their data files. This checks every one has
      # every file its RECORD lists and imports from there, with nothing else
      # on the path, and #1822, #3133, that the package is noarch: python with
      # no native binary. The recipe's own test imports pcapkit beside its
      # conda-forge run requirements. On setup-python's interpreter, as the
      # script needs tomllib.
      - name: Smoke-test the vendored packages
        id: smoke
        shell: bash
        env:
          PCAPKIT_CONDA_PACKAGE: ${{ steps.conda_build.outputs.host_package }}
        run: '"${pythonLocation}/bin/python" util/conda_vendor.py --smoke "$PCAPKIT_CONDA_PACKAGE"'

      # The file `conda-test` installs and `conda-dist` publishes, so both have
      # the one this job built.
      - name: Upload the conda package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-package
          path: ${{ steps.conda_build.outputs.packages }}
          if-no-files-found: error

  # #3133: the package `conda-build` built, installed from a local channel
  # beside conda-forge on each platform and each Python of both tiers. Every
  # step is #1672's: a KTLO leg's failure is a warning on a green leg, so only a
  # supported leg's failure fails the job and holds `conda-dist` back.
  conda-test:
    name: Conda install on ${{ matrix.os }} with Python ${{ matrix.python-version }}${{ matrix.ktlo && ' (KTLO)' || '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    needs: [ conda-build, conda-update ]
    if: ${{ !cancelled() && needs.conda-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # create-release.yml's `conda-test` says why these.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
        # #1633, #1660: CPython's KTLO and supported tiers, the KTLO legs marked.
        python-version: ${{ fromJSON(needs.conda-update.outputs.PYTHON_CONDA) }}
        include: ${{ fromJSON(needs.conda-update.outputs.PYTHON_CONDA_KTLO) }}
    steps:
      - name: Checkout code
        id: checkout
        continue-on-error: ${{ matrix.ktlo == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: util
          persist-credentials: false

      - name: Download the conda package
        id: download
        continue-on-error: ${{ matrix.ktlo == true }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-package
          path: ${{ runner.temp }}/conda-channel/noarch

      - name: Conda environment creation and activation
        id: miniconda
        if: ${{ steps.download.outcome == 'success' }}
        continue-on-error: ${{ matrix.ktlo == true }}
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          # #2044: Miniforge on the Intel leg; see create-release.yml's step of
          # the same name.
          miniforge-version: ${{ matrix.os == 'macos-26-intel' && 'latest' || '' }}
          activate-environment: base
          auto-update-conda: false
          auto-activate: true
          channels: conda-forge
          conda-remove-defaults: true
          show-channel-urls: true

      # A login shell, which activates base, and on Windows defines `conda`.
      - name: Index the local channel
        id: index
        if: ${{ steps.miniconda.outcome == 'success' }}
        continue-on-error: ${{ matrix.ktlo == true }}
        shell: bash -el {0}
        run: |
          conda install -n base --override-channels -c conda-forge -y conda-index
          python -m conda_index "$RUNNER_TEMP/conda-channel"

      - name: Install the conda package
        id: install
        if: ${{ steps.index.outcome == 'success' }}
        continue-on-error: ${{ matrix.ktlo == true }}
        shell: bash -el {0}
        env:
          PCAPKIT_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          conda create -y -p "$RUNNER_TEMP/conda-test" --override-channels \
            -c "$RUNNER_TEMP/conda-channel" -c conda-forge "python=$PCAPKIT_PYTHON_VERSION" pypcapkit

      # The recipe's test commands, conda/pypcapkit/meta.yaml's `test:`.
      - name: Test the conda package
        id: test
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: ${{ matrix.ktlo == true }}
        shell: bash -el {0}
        run: |
          conda activate "$RUNNER_TEMP/conda-test"
          python -c "import pcapkit"
          pcapkit-cli --help
          python -c "import os, pcapkit, dictdumper, tbtrim; assert all(os.path.realpath(m.__file__).startswith(os.path.realpath(pcapkit._extern) + os.sep) for m in (dictdumper, tbtrim))"

      # #1672, on the runner's own interpreter: `python` on Windows, which
      # has no `python3`, and `python3` where there is no `python`.
      - name: KTLO summary
        if: ${{ !cancelled() && matrix.ktlo == true }}
        continue-on-error: ${{ matrix.ktlo == true }}
        shell: bash
        env:
          LEG: Python ${{ matrix.python-version }}${{ matrix.ktlo && ' (KTLO, non-blocking)' || '' }}
          STEPS: ${{ toJSON(steps) }}
        run: '"$(command -v python || command -v python3)" util/leg_summary.py ktlo'

  # #3133: publishes the package `conda-build` built, once every supported leg
  # of `conda-test` installed it; never on a build-only run.
  conda-dist:
    name: Conda deployment (update)
    runs-on: ubuntu-latest
    # #1968: `ANACONDA_TOKEN` is an `anaconda` environment secret, as for
    # create-release.yml's `conda`; keep it free of reviewers.
    environment: ${{ needs.mode.outputs.publishes == 'true' && 'anaconda' || '' }}
    needs: [ conda-build, conda-test, conda-tag, conda-update, mode ]
    # `conda-build`'s gates, on the publishing branch alone, and every supported
    # leg of `conda-test` green (#1632, #2458, #2841).
    if: >-
      !cancelled() && needs.mode.outputs.publishes == 'true' &&
      needs.conda-update.result == 'success' &&
      needs.conda-build.result == 'success' && needs.conda-test.result == 'success' &&
      needs.conda-tag.result == 'success' &&
      needs.conda-update.outputs.CONDA_CHANGED == 'true' &&
      needs.conda-update.outputs.PCAPKIT_RELEASE_COMMIT != '' &&
      needs.conda-update.outputs.PCAPKIT_DEV_RELEASE != 'true'
    permissions:
      contents: write
    steps:
      # util/ alone, for the script below; no persisted token (#2060).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: util
          persist-credentials: false

      - name: Download the conda package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-package
          path: ${{ runner.temp }}/conda-package

      - name: Find the conda package
        id: conda_package
        shell: bash
        run: python3 util/release_conda.py downloaded "$RUNNER_TEMP/conda-package"

      - name: Upload conda packages to Anaconda
        if: ${{ needs.mode.outputs.publishes == 'true' }}
        uses: anaconda/actions/upload-package@a6f488910b4a1e4f3fe01736241ca1b92b4b355a # v0.3.1
        with:
          token: ${{ secrets.ANACONDA_TOKEN }}
          channel: jarryshaw
          packages: ${{ steps.conda_package.outputs.packages }}
          labels: ${{ needs.conda-update.outputs.PCAPKIT_CONDA_LABEL }}
          force: true

      # #1634: the upload below never makes the release. ncipollo/release-action
      # v1.21.0 creates a missing one, and its tag, at ``commit``
      # (``Action.checkForMissingReleaseError`` and
      # ``Action.updateDraftOrCreateRelease`` in src/Action.ts), so a bump made
      # while Create Release waits on approval would tag the pending version at
      # main's tip and fail Create Release's tag check. It also retargets a
      # draft at ``commit`` (``updateDraftOrCreateRelease`` and
      # ``updateRelease``), though Create Release's ``workflow_run`` run resets
      # a draft's target to its sha (softprops/action-gh-release v3.0.4,
      # ``release`` and ``findTagFromReleases`` in src/github.ts); skipping a
      # draft is a precaution. Only the GitHub upload is skipped; the build is
      # on anaconda.org regardless.
      - name: Check the GitHub release exists
        id: release
        if: ${{ needs.mode.outputs.publishes == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PCAPKIT_RELEASE_TAG: v${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
        run: |
          errors="$(mktemp)"
          status=0
          draft="$(gh release view "$PCAPKIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$errors")" || status=$?
          if [ "$status" -eq 0 ] && [ "$draft" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 0 ] && [ "$draft" = true ]; then
            why="is a draft, which the upload would retarget at main"
          elif [ "$(cat "$errors")" = 'release not found' ]; then
            why="does not exist, and the upload would create it, tagging main's tip"
          else
            cat "$errors" >&2
            echo "::error title=Could not read ${PCAPKIT_RELEASE_TAG}::gh release view exited ${status}."
            exit 1
          fi
          echo "::notice title=No GitHub upload for ${PCAPKIT_RELEASE_TAG}::${PCAPKIT_RELEASE_TAG} ${why}. Create Release makes it, at the commit its run was created for (#1634); this build is on anaconda.org only."
          echo "published=false" >> "$GITHUB_OUTPUT"

      # ``commit`` is sent to Update a release as ``target_commitish``
      # (``Action.updateRelease`` in src/Action.ts, ``GithubReleases.update`` in
      # src/Releases.ts), and
      # ``github.ref_name`` is the default branch on every run that publishes, so
      # GitHub's workflow-file rule checks main, not the commit Create Release
      # made the release at. The tag stays: the target is "Unused if the Git
      # tag already exists" (REST docs, Update a release).
      #
      # #1657: that update also sends ``name``, ``body``, ``prerelease`` and
      # ``draft``, which unset inputs make the tag, "" and false (the
      # ``CoreInputs`` getters ``name``, ``body``, ``createdPrerelease`` and
      # ``createdDraft`` in src/Inputs.ts, read through its ``updated*``
      # getters), so unguarded each bump wipes the release's name and notes. Each
      # ``omit*DuringUpdate`` leaves its field undefined (the same ``updated*``
      # getters), and Octokit drops it (@octokit/endpoint's
      # ``removeUndefinedProperties``, called from its ``merge``, bundled in
      # dist/index.js).
      - name: Upload package to GitHub Release
        if: ${{ needs.mode.outputs.publishes == 'true' && steps.release.outputs.published == 'true' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifacts: ${{ steps.conda_package.outputs.packages_csv }}
          commit: ${{ github.ref_name }}
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          tag: "v${{ needs.conda-update.outputs.PCAPKIT_VERSION }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

  # #2030: posts `conda-update`'s report with the tag, build, test and upload
  # results, and a short one of its own where `head` failed or was cancelled, as
  # cron-vendor.yml's `discussion` job does, whose comment gives the rules. It
  # waits for `conda-dist`, so the report says whether the build reached
  # Anaconda, and for `conda-build` and `conda-test` (#3133). Never on a
  # build-only run, which the thread would read as a real one; a manual run
  # with `publish` posts as the schedule does (#2060).
  discussion:
    name: Post the conda report
    needs: [ head, conda-update, conda-tag, conda-build, conda-test, conda-dist, mode ]
    if: >-
      ${{ always() && needs.mode.outputs.publishes == 'true' && (needs.conda-update.result != 'skipped' ||
      needs.head.result == 'failure' || needs.head.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A run that never wrote a report uploaded none; the script then warns.
      - name: Download the report
        if: needs.conda-update.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-report
          path: report

      # As cron-vendor.yml's: a `workflow_run` posts as a push run, the
      # schedule, and a manual run with `publish`, every run. A failed tag or
      # upload fails the report too, and a green `conda-update` that warned
      # reports `warning`.
      - name: Post the report to Discussions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_run' && 'push' || 'scheduled' }}
          HEAD_RESULT: ${{ needs.head.result }}
          UPDATE_RESULT: ${{ needs.conda-update.result }}
          UPDATE_STATUS: ${{ needs.conda-update.outputs.status }}
          TAG_RESULT: ${{ needs.conda-tag.result }}
          BUILD_RESULT: ${{ needs.conda-build.result }}
          TEST_RESULT: ${{ needs.conda-test.result }}
          DIST_RESULT: ${{ needs.conda-dist.result }}
          # #2458: needed to tell "skipped, nothing was pushed" apart from
          # "skipped, a build was pushed but it is a dev release" below.
          CONDA_CHANGED: ${{ needs.conda-update.outputs.CONDA_CHANGED }}
          DEV_RELEASE: ${{ needs.conda-update.outputs.PCAPKIT_DEV_RELEASE }}
          # #2841: the commit is empty where no tag was found, or where the
          # tag found names other dependencies.
          RELEASE_COMMIT: ${{ needs.conda-update.outputs.PCAPKIT_RELEASE_COMMIT }}
          RELEASE_TAG: ${{ needs.conda-update.outputs.PCAPKIT_RELEASE_TAG }}
          PCAPKIT_VERSION: ${{ needs.conda-update.outputs.PCAPKIT_VERSION }}
        run: |
          if [ "$UPDATE_RESULT" = skipped ]; then
            status="$HEAD_RESULT"
            mkdir -p report
            {
              echo '### Conda Update'
              echo
              echo "- Gate: $HEAD_RESULT, so conda-update did not run and nothing was built or pushed"
            } > report/conda-report.md
          else
            if [ "$UPDATE_RESULT" != success ]; then
              status="$UPDATE_RESULT"
            elif [ "$TAG_RESULT" = failure ] || [ "$BUILD_RESULT" = failure ] || [ "$TEST_RESULT" = failure ] ||
                 [ "$DIST_RESULT" = failure ]; then
              status=failure
            elif [ "$TAG_RESULT" = cancelled ] || [ "$BUILD_RESULT" = cancelled ] || [ "$TEST_RESULT" = cancelled ] ||
                 [ "$DIST_RESULT" = cancelled ]; then
              status=cancelled
            else
              status="${UPDATE_STATUS:-success}"
            fi
            # a pushed dev-release build (`DEV_RELEASE` = 'true') skips Tag and
            # Upload on purpose, so it gets its own line below (#2458)
            if [ "$TAG_RESULT" != skipped ] && [ -f report/conda-report.md ]; then
              {
                echo "- Tag: $TAG_RESULT"
                echo "- Build: $BUILD_RESULT"
                echo "- Test: $TEST_RESULT"
                echo "- Upload: $DIST_RESULT"
              } >> report/conda-report.md
            elif [ "$CONDA_CHANGED" = true ] && [ "$DEV_RELEASE" = true ] && [ -f report/conda-report.md ]; then
              echo "- Tag: skipped, and Upload: skipped -- ${PCAPKIT_VERSION} carries a PEP 440 dev-release suffix (.devN), so PCAPKIT_DEV_RELEASE withheld both deliberately" >> report/conda-report.md
            elif [ "$CONDA_CHANGED" = true ] && [ -z "$RELEASE_COMMIT" ] && [ -n "$RELEASE_TAG" ] && [ -f report/conda-report.md ]; then
              echo "- Tag: skipped, and Upload: skipped -- ${RELEASE_TAG} names other dependencies than main, whose vendored requirements the build uses, so Check the release tag's dependencies withheld both" >> report/conda-report.md
            elif [ "$CONDA_CHANGED" = true ] && [ -z "$RELEASE_COMMIT" ] && [ -f report/conda-report.md ]; then
              echo "- Tag: skipped, and Upload: skipped -- no v${PCAPKIT_VERSION} tag names a tree to build, so Find the release tag withheld both" >> report/conda-report.md
            fi
          fi
          python3 util/discussion_report.py --category "$REPORT_CATEGORY" \
            --title 'cron-conda: conda distribution update report' --report report/conda-report.md \
            --mode "$MODE" --status "$status"
