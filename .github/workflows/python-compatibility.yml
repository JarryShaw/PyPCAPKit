name: "Python Compatibility"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 6'

permissions:
  contents: read

# Only pull-request runs may be superseded. Keying every event on the ref (as
# this did) coalesces all of main's pushes into one group, and GitHub cancels a
# *pending* run whenever a newer one joins the group -- `cancel-in-progress:
# false` protects a run that has already started, never one still queued. So a
# commit merged while its predecessor was still running lost its validation
# entirely. Keying non-PR events on the run id gives each one its own group,
# which is what "validate every commit" actually requires.
concurrency:
  group: python-compatibility-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    # Named "Python ${{ matrix.python-version }}" until now, which collided
    # exactly with the Unit Tests matrix job of the same name: `gh pr checks`
    # showed two rows reading `Python 3.10`, one a 13-second import smoke test
    # and one a three-minute test run, with nothing to tell them apart.
    #
    # #1633: two tiers. The supported tier, 3.11-3.15, keeps the plain name,
    # which is what ruleset 23497679 requires one context per version of. The
    # KTLO tier -- end-of-life versions that still run, 3.8-3.10 -- is suffixed
    # ` (KTLO)`, so no required context can ever match one, and carries
    # `continue-on-error`, so a failed leg shows red without failing the run.
    # 3.6 and 3.7 are left out: neither can install and import pcapkit (see the
    # note on `requires-python` in pyproject.toml).
    name: Compat Python ${{ matrix.python-version }}${{ matrix.ktlo && ' (KTLO)' || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    continue-on-error: ${{ matrix.ktlo == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        # setup-python publishes 3.8 and 3.9 builds up to Ubuntu 24.04 only, and
        # `ubuntu-latest` moves to 26.04 from 2026-10-19, hence the pin.
        include:
          - python-version: "3.8"
            ktlo: true
            os: ubuntu-24.04
          - python-version: "3.9"
            ktlo: true
            os: ubuntu-24.04
          - python-version: "3.10"
            ktlo: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e .

      - name: Verify package
        run: |
          python -m compileall -q pcapkit
          python -c 'import pcapkit; print(pcapkit.__version__)'
