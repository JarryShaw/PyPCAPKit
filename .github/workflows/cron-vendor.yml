name: "Vendor Update"

on:
  schedule:
    - cron: '0 10 * * 6' # Saturdays at 10:00 UTC
  # No `push: branches: [main]` here. `unit-tests.yml`'s own push trigger
  # already runs the full matrix for this commit; calling it again below with
  # `gate-only: true` re-ran the single-version "Gate" job a second time for
  # the same tree (#715). Chaining off `Unit Tests`' completion means the gate
  # never runs twice, and `vendor-update` below just reads the verdict that
  # already exists. `.event == 'push'` is checked in that job's `if` rather
  # than here, because `workflow_run` fires for a pull request's completion
  # too and a `branches:` filter here would be the only thing stopping that.
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]

# Least privilege by default, since `workflow_run` is in the trigger list --
# that event can be raised by a pull request's `Unit Tests` run completing, so
# the ambient token this workflow gets should default to nothing rather than
# whatever the repository's default is. Every job below already declares its
# own narrower `permissions:`, so this changes nothing they rely on; it only
# closes the gap for anything added later that forgets to.
permissions: {}

# This workflow commits and pushes, so a cancelled run can leave the bump
# half-applied. Kept keyed on the ref, unlike the validation workflows: a dropped
# run here just means a crawl that did not happen twice, and the next schedule
# picks the registries up again, whereas a dropped validation run means a commit
# nobody ever checked.
#
# A `workflow_run` is keyed on the commit `Unit Tests` verified instead (#1643).
# Each `Unit Tests` completion raises a run here, and one whose verdict is for an
# older commit only runs `verdict` and skips -- but in a shared group it would
# still displace a pending run whose verdict matches, since "any existing pending
# job or workflow in the same concurrency group will be canceled" (GitHub,
# "Control the concurrency of workflows and jobs").
#
# Note this group is not what serialises the repository writes -- the
# `vendor-update` job below carries its own `repository-maintenance` group, shared
# with cron-conda, and that is what actually stops two jobs committing at once.
concurrency:
  group: vendor-update-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  # Only earns its runners on the schedule trigger: `Unit Tests` has no
  # schedule trigger of its own, so Saturday's cron run is the one case left
  # where nothing else has already verified this tree. `workflow_run` carries
  # its own verdict instead -- see `vendor-update` below.
  unit-tests:
    name: Vendor test gate
    if: ${{ github.event_name != 'workflow_run' }}
    permissions:
      contents: read
    uses: ./.github/workflows/unit-tests.yml
    with:
      gate-only: true

  # #1643: `github.sha`, which every checkout here takes, is main's tip when the
  # `workflow_run` was raised -- not the commit the completed `Unit Tests` run
  # verified, and in a merge wave the two differ. This job compares them with
  # util/verdict_covers_checkout.py, whose docstring gives the rule, and the job
  # below acts on a `workflow_run` only when `verified` is 'true'. Its `if:` is
  # that job's `workflow_run` clause, so a run raised by a pull request's or a
  # failed `Unit Tests` run still concludes `skipped`, as before.
  verdict:
    name: Verdict covers this commit
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verdict.outputs.verified }}
    steps:
      # The default ref, as the job below uses, so both see the same `github.sha`.
      # Twenty commits leaves room for the bot commits the rule accepts; a verdict
      # further back is not found, and so not accepted.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Compare the verified commit with this checkout
        id: verdict
        env:
          VERDICT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 util/verdict_covers_checkout.py

  vendor-update:
    runs-on: macos-latest
    needs: [ unit-tests, verdict ]
    # `needs` cannot itself be conditional, so a skipped gate (`workflow_run`)
    # has to be accepted explicitly -- by default this job would inherit the
    # skip. `!cancelled()` rather than `always()` so that cancelling the run
    # still cancels the update; a gate that actually failed still blocks.
    #
    # The `workflow_run` clause is the real gate for a push to main: it
    # reads the verdict `Unit Tests` already reached instead of re-running it,
    # and `verdict` says whether that verdict covers the commit checked out
    # below (#1643). `.event == 'push'` and `.head_branch == 'main'`
    # both matter -- `workflow_run` fires for *every* completion of that
    # workflow, including one triggered by a pull request, and without this
    # check a green PR would push a vendor-registry commit from that PR's tree.
    if: >-
      !cancelled() && needs.unit-tests.result != 'failure' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        needs.verdict.outputs.verified == 'true'
      ))
    concurrency:
      group: repository-maintenance
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      - uses: actions/checkout@v7
        with:
          # Deliberately the default `github.sha` (main's tip), not
          # `github.event.workflow_run.head_sha`. Pinning to the latter once
          # ran here and CodeQL flagged it as "checkout of untrusted code in a
          # privileged context" -- `workflow_run` can also be raised by a pull
          # request's `Unit Tests` run, and that field would then be a fork's
          # commit. The `if:` above already keeps that path from reaching this
          # step, but making the ref itself always resolve to a trusted
          # default-branch commit removes the pattern outright rather than
          # relying on CodeQL tracing through the guard. The push below rebases
          # onto main's actual tip before writing regardless, so pinning to the
          # exact tested sha would have bought nothing here either. Whether this
          # commit is one that verdict covers is `verdict`'s question (#1643).
          # The push below re-points `origin` at an SSH remote and authenticates
          # with the loaded deploy key, not with this checkout's credential --
          # so there is nothing here for a persisted token to do, and one less
          # live credential for anything running in between to find.
          persist-credentials: false

      # #1660: `latest` from .github/python-versions.toml, read with the
      # runner's own python3.
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      - name: Install and Setup
        run: |
          set -x

          python -m pip install -U pip setuptools wheel packaging
          python -m pip install -U isort

          # `all` carries `pycrate`, a core addon under #910 (see its
          # own comment in pyproject.toml), but not `requests`/`beautifulsoup4`:
          # #910 moved those to the `dev` extra instead, which is
          # for the toolchain rather than for a vendor crawl. `vendor` is
          # installed alongside `all` for those two: `pcapkit-vendor` below
          # regenerates every crawler with no target given, and some of them
          # import `bs4` at module scope while `pcapkit.vendor.default` imports
          # `requests` the same way (#507). See the `vendor` extra's own
          # comment in pyproject.toml for the full reasoning.
          python -m pip install -e .[all,vendor]

      - name: Update Vendor
        run: |
          set -x

          export PCAPKIT_VENDOR_RETRY=10
          export PCAPKIT_CI_MODE=1

          # `pcapkit-vendor` (#872) exits non-zero if any target raised, and
          # the owner's ruling on that is: discard a failed sub-vendor's own
          # changes, keep every zero-exited one's, and never fail the whole
          # job over it -- the targets that DID succeed still need isort,
          # diff, commit and push below. `set +e`/`set -e` around the one
          # command (not a bare `pcapkit-vendor || true`) so $vendor_exit
          # actually carries the exit code instead of it being thrown away.
          set +e
          pcapkit-vendor 2> "$RUNNER_TEMP/vendor-stderr.log"
          vendor_exit=$?
          set -e

          # Always replayed into the step log, success or failure: this is
          # each failing target's qualified name and exception repr (from
          # __main__.py's run()) plus its VendorRuntimeWarning line, i.e.
          # exactly what a live, uncaptured `pcapkit-vendor` would have
          # written to stderr directly. `|| true` deliberately: this line
          # runs after `set -e` is restored above, and if $RUNNER_TEMP were
          # ever unset or unwritable the redirect on the previous command
          # would already have failed to create the log file at all --
          # `cat` on a missing file returns 1 under `-e` and would abort the
          # whole step right here, exactly the "one dead crawler kills every
          # good regeneration" failure mode this handling exists to remove.
          cat "$RUNNER_TEMP/vendor-stderr.log" >&2 || true

          if [ "$vendor_exit" -ne 0 ]; then
            # Anchored at the start of the line: the unanchored `failed: `
            # also matches inside the VendorRuntimeWarning line whenever the
            # exception's own text happens to contain "failed: " (e.g.
            # ConnectionError('request failed: 503')), since that line embeds
            # the same {error!r} __main__.py's run() already put in the
            # print() line above it -- double-counting one failure as two
            # ::warning:: annotations. Only the print() line starts with the
            # bare qualified name; the warning line starts with a file path.
            failed_targets=$(grep -E '^[A-Za-z_][A-Za-z0-9_.]* failed: ' \
                                  "$RUNNER_TEMP/vendor-stderr.log" || true)

            {
              echo "### :warning: \`pcapkit-vendor\` reported failing target(s) (exit $vendor_exit)"
              echo
              echo '```'
              if [ -n "$failed_targets" ]; then
                echo "$failed_targets"
              else
                echo '(no target name could be extracted from stderr; see the step log above)'
              fi
              echo '```'
              echo
              echo 'Const files from targets that exited zero are still isorted, tested, diffed, committed and pushed below -- only the failing target(s) above were left as they were.'
            } >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$failed_targets" ]; then
              while IFS= read -r line; do
                echo "::warning title=pcapkit-vendor target failed::${line}"
              done <<< "$failed_targets"
            else
              echo "::warning title=pcapkit-vendor exited $vendor_exit::see the step log above for which target(s) failed"
            fi
          fi

          # `find -mindepth 2`, not a `pcapkit/const/*/*.py` shell glob (#765):
          # this job runs on `macos-latest`, whose default `bash` on PATH is
          # the system's, unlike the Makefile's own `SHELL := $(shell command
          # -v bash ...)`, which is confirmed (elsewhere) to pick up a modern
          # one -- `shopt -s globstar` is not a safe assumption here, and
          # `find` needs neither globstar nor a modern bash to reach any
          # depth. `-mindepth 2` keeps the same floor the old glob had: it
          # still skips `pcapkit/const/__init__.py` itself.
          isort -l100 -ppcapkit $(find pcapkit/const -mindepth 2 -name '*.py')

      # #1853: neither gate above sees the regenerated tree -- `unit-tests` runs
      # on the schedule alone, and `verdict` accepts the Unit Tests result for
      # the commit from before the crawl -- so 1.5.0b13 was committed with a test
      # failing on it. The owner's ruling: test the regenerated tree here, before
      # anything is committed, under #872's rule above. A module the tests fail
      # with is put back as HEAD has it and the rest go on to be committed, as
      # for a sub-vendor that raised. util/vendor_test_gate.py, whose docstring
      # gives the rule, decides which modules those are.
      #
      # `continue-on-error`, so the tests never fail the job. The script exits
      # zero once it has decided; if this step fails or times out instead, the
      # tree may hold modules no run passed with, and the next step discards
      # every regenerated module. The test extra is installed here because only
      # this step needs it; it carries psutil too, which the script samples a
      # run's memory with (#1894). The script's budget bounds its runs together,
      # and `timeout-minutes` sits above it as the backstop. Run serially, pytest
      # peaked at 0.7 GB resident over tests/const, measured locally, so the
      # memory cap leaves headroom on this runner; files are capped at 2 GiB, as
      # in experimental.yml.
      - name: Test the regenerated tree
        id: vendor-tests
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -x

          python -m pip install -e '.[test]'
          python util/vendor_test_gate.py --budget-minutes 40 \
              --max-memory-mib 4096 --max-file-size-mib 2048 -- \
              python -m pytest -q -p no:cacheprovider tests/const tests/vendor

      # What the step above left is untested if it did not finish, so HEAD's
      # copy of every module goes back, new modules are removed, and nothing
      # from this crawl is committed. Not a failure either, per #872.
      - name: Discard untested const changes
        if: steps.vendor-tests.outcome != 'success'
        run: |
          git checkout HEAD -- pcapkit/const
          git clean -fdq -- pcapkit/const
          echo "::warning title=Vendor test gate did not finish::the regenerated tree could not be tested, so every regenerated module was discarded; see the step log"
          {
            echo '### :warning: Vendor test gate did not finish'
            echo
            echo 'The step that tests the regenerated tree failed or timed out, so nothing from this crawl is committed.'
          } >> "$GITHUB_STEP_SUMMARY"

      # #1968: `git status` in place of tj-actions/verify-changed-files@v17, so
      # no third-party code runs while the deploy key is loaded. The outputs are
      # the action's with no `files:` input, which it never had here:
      # `files_changed`, and `changed_files`, the paths joined by spaces and
      # written only when there are some. Every changed tracked file counts,
      # untracked files are listed one by one, and ignored files are left out.
      # A staged change counts too, which the action's `git diff` missed;
      # nothing before this step stages one. git C-quotes a path holding a
      # space, a quote, a control character or a non-ASCII byte, so the list is
      # one line. Such a path still splits on its space, and
      # util/vendor_code_changed.py counts a name it cannot read as code. The
      # steps below read the list through `env:`, so a path is never shell text.
      # cron-conda.yml runs the same script.
      - name: Verify Changed files
        id: verify-changed-files
        run: |
          listing="$(git -c core.quotepath=on status --porcelain --untracked-files=all --no-renames)"
          printf '%s\n' "$listing"
          changed="$(printf '%s\n' "$listing" | cut -c4- | LC_ALL=C sort -u | paste -sd ' ' -)"
          if [ -n "$changed" ]; then
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=$changed" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # #1674: only a code change cuts a beta. util/vendor_code_changed.py,
      # whose docstring gives the rule, writes `code_changed=false` when every
      # change is to comments or docstrings; those are committed below without
      # a bump. Anything else bumps, as before, including this step failing:
      # `continue-on-error` leaves `code_changed` unset, and the bump reads
      # `!= 'false'`.
      - name: Classify Changed files
        id: classify
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: python util/vendor_code_changed.py

      - name: Bump Version
        if: >-
          steps.verify-changed-files.outputs.files_changed == 'true' &&
          steps.classify.outputs.code_changed != 'false'
        run: |
          set -x

          python util/bump_version.py
          isort -l100 -ppcapkit --skip-glob '**/__init__.py' pcapkit
          isort -l100 -ppcapkit $(find pcapkit/const -mindepth 2 -name '*.py')
          isort -l100 -ppcapkit $(find pcapkit/vendor -mindepth 2 -name '*.py')

      - name: Commit changes
        id: commit
        if: >-
          steps.verify-changed-files.outputs.files_changed == 'true' &&
          steps.classify.outputs.code_changed != 'false'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # #1685: `-a` stages tracked files only, so a module the crawl added
          # for a new registry was bumped for but never committed, and every
          # later crawl bumped for it again. Stage pcapkit-vendor's output first,
          # new and deleted modules included; `-a` still takes the bump's files.
          # Quoted, so git matches the pattern at any depth, not the shell at
          # one; `.py` only, so a backup pcapkit-vendor could not remove stays out.
          git add -A -- 'pcapkit/const/*.py'
          git commit -am"Bumped version to $(python -c 'import pcapkit; print(pcapkit.__version__)')

          Updated vendor constant enumerations at $(date). The following files
          have been changed: $CHANGED_FILES"

      # #1674: the same commit without the bump. Create Release still runs when
      # this workflow completes, as after a crawl that changed nothing, and sees
      # the same version, so nothing new is published. The push starts Unit
      # Tests, whose completion raises this workflow again on the commit made
      # here. If that crawl changes comments once more, it does not commit them
      # on top of this commit; the next push or schedule picks them up. So
      # documentation commits cannot chain, however the registries behave. The
      # Unit Tests run's head commit is in the `workflow_run` payload
      # (octokit/webhooks' workflow-run.schema.json, `head_commit`). `-a` is
      # enough here: a new or deleted module is code to the classifier, so it
      # takes the bump path above and never reaches this step (#1685).
      - name: Commit documentation changes
        id: commit-docs
        if: >-
          steps.verify-changed-files.outputs.files_changed == 'true' &&
          steps.classify.outputs.code_changed == 'false'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_AUTHOR: ${{ github.event.workflow_run.head_commit.author.email }}
          VERIFIED_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          bot="github-actions[bot]@users.noreply.github.com"
          subject="Updated vendor documentation without a version bump"

          verified_subject=$(printf '%s\n' "$VERIFIED_MESSAGE" | head -n 1)
          if [ "$EVENT_NAME" = workflow_run ] && [ "$VERIFIED_AUTHOR" = "$bot" ] &&
             [ "$verified_subject" = "$subject" ]; then
            echo "::notice title=Documentation changes held::this run was raised by the Unit Tests run for a documentation-only commit of this workflow, so the comments it changed again wait for the next push or schedule"
            exit 0
          fi

          git config --local user.email "$bot"
          git config --local user.name "github-actions[bot]"
          git commit -am"$subject

          Updated vendor constant enumerations at $(date). Only comments and
          docstrings changed, so the version stays at
          $(python -c 'import pcapkit; print(pcapkit.__version__)') (#1674). The
          following files have been changed: $CHANGED_FILES"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outcome == 'success' || steps.commit-docs.outputs.committed == 'true'
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${GITHUB_REF}"

      # - name: Create Tag
      #   if: steps.verify-changed-files.outputs.files_changed == 'true'
      #   run: |
      #     version=$(python -c 'import pcapkit; print(pcapkit.__version__)')
      #     git tag "v$version" -m "New distribution [$version] \

      #     Update vendor constant enumerations at $(date). The following files have been changed: ${{ steps.verify-changed-files.outputs.changed_files }}"

      # - name: Push changes
      #   uses: ad-m/github-push-action@master
      #   if: steps.verify-changed-files.outputs.files_changed == 'true'
      #   with:
      #     tags: true
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     branch: ${{ github.ref }}
