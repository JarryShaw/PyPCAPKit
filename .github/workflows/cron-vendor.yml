name: "Vendor Update"

on:
  # #1967: GitHub Pages, Vendor Update and Conda Update run eight hours
  # apart on Saturdays, so each runs `head`'s test gate alone and the
  # `repository-maintenance` jobs do not queue together. Conda Update comes
  # last so its upload finds the release Create Release made after Vendor
  # Update (#1634). workflows.rst gives the evidence.
  schedule:
    - cron: '0 10 * * 6' # Saturdays at 10:00 UTC
  # No `push` trigger: Unit Tests' own push run already reaches a verdict, and
  # calling it again with `gate-only: true` would re-run the gate on the same tree
  # (#715). `workflow_run` also fires for a pull request's run; the
  # `vendor-update` job's `if` refuses those, not a `branches:` filter here.
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]
  # A build-only run of the dispatched ref, to debug the crawl and its test
  # gate without waiting for Saturday: it crawls, tests and commits locally,
  # and pushes nothing, posts nothing and enters no environment. Create
  # Release, which a completed run raises, releases nothing for one either.
  workflow_dispatch:

# Nothing by default, since a pull request's Unit Tests run can raise
# `workflow_run`; each job declares its own `permissions:`.
permissions: {}

# Never cancelled in progress: a cancelled run can leave the bump half-applied,
# while a dropped duplicate only means a crawl not run twice. A `workflow_run` is
# keyed on the commit Unit Tests verified (#1643): in a shared group, a run for
# an older verdict would displace a pending one whose verdict matches, since
# "any existing pending job or workflow in the same concurrency group will be
# canceled" (GitHub, "Control the concurrency of workflows and jobs"). The
# repository writes are serialised by `vendor-update`'s `repository-maintenance`
# group, shared with cron-conda, not by this one. A manual run writes nothing,
# so it is keyed on itself here and there, and never displaces a pending run.
concurrency:
  group: vendor-update-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

# #2030: one Discussions category holds every report with no pull request to
# comment on, one thread per job.
env:
  REPORT_CATEGORY: CI reports

jobs:
  # #1967: the test gate on the schedule, `verdict` on a `workflow_run`;
  # shared with Conda Update and GitHub Pages.
  head:
    name: Vendor gate
    permissions:
      contents: read
    uses: ./.github/workflows/cron-head.yml

  vendor-update:
    runs-on: macos-latest
    # #1968: the deploy key is a `conda-tag` environment secret, readable only
    # by a job naming it. Keep it free of required reviewers, or every
    # scheduled bump waits for an approval. A manual run, which never pushes,
    # names no environment, so the deploy key reaches none of its steps.
    environment: ${{ github.event_name != 'workflow_dispatch' && 'conda-tag' || '' }}
    needs: [ head ]
    # `head`'s jobs skip on every path, so this job must not inherit a skip;
    # `!cancelled()`, not `always()`, so cancelling still cancels and a failed
    # gate still blocks. On `workflow_run`, `verified` says Unit Tests' verdict
    # covers the checkout (#1643), and the `push`/`main` checks stop a green
    # pull request's run from pushing a vendor commit from that PR's tree.
    if: >-
      !cancelled() && needs.head.result != 'failure' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        needs.head.outputs.verified == 'true'
      ))
    # #2030: `warning` where the job passed over a failed target or test gate.
    outputs:
      status: ${{ steps.run-report.outputs.status }}
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('repository-maintenance-{0}', github.run_id) || 'repository-maintenance' }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Load maintenance deploy key
        if: github.event_name != 'workflow_dispatch'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PYPCAPKIT_ACTIONS_DEPLOY_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default `github.sha` (main's tip), not `workflow_run.head_sha`,
          # which CodeQL flagged as "checkout of untrusted code in a privileged
          # context": a pull request's run can raise `workflow_run`. The push
          # rebases onto main's tip anyway; whether the verdict covers this
          # commit is `head`'s question (#1643). No persisted token: the push
          # authenticates with the deploy key over SSH.
          persist-credentials: false

      # #1660: `latest` from .github/python-versions.toml, read with the
      # runner's own python3.
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      - name: Install and Setup
        run: |
          set -x

          python -m pip install -U pip setuptools wheel packaging
          python -m pip install -U isort

          # `vendor` for `requests` and `beautifulsoup4`, which `all` does not
          # carry, as it holds core addons only (#910): `pcapkit-vendor` with no
          # target runs every crawler, and some import them at module scope
          # (#507). See the `vendor` extra's comment in pyproject.toml.
          python -m pip install -e '.[all,vendor]'

      - name: Update Vendor
        id: crawl
        run: |
          set -x

          export PCAPKIT_VENDOR_RETRY=10
          export PCAPKIT_CI_MODE=1

          # #872, the owner's ruling: a failed sub-vendor's changes are
          # discarded, every zero-exited one's are kept, and the job does not
          # fail over it. `set +e`, not `|| true`, so $vendor_exit keeps the code.
          set +e
          pcapkit-vendor 2> "$RUNNER_TEMP/vendor-stderr.log"
          vendor_exit=$?
          set -e
          echo "status=$vendor_exit" >> "$GITHUB_OUTPUT"

          # Replayed whatever the exit: each failing target's name and
          # exception, plus its VendorRuntimeWarning. `|| true` so a log that
          # was never created cannot abort the step under `-e` and lose the
          # good regenerations.
          cat "$RUNNER_TEMP/vendor-stderr.log" >&2 || true

          if [ "$vendor_exit" -ne 0 ]; then
            # Anchored: the VendorRuntimeWarning line embeds the same
            # {error!r} and so can contain "failed: " too (e.g.
            # ConnectionError('request failed: 503')), double-counting one
            # failure. Only run()'s print() line starts with the qualified name.
            failed_targets=$(grep -E '^[A-Za-z_][A-Za-z0-9_.]* failed: ' \
                                  "$RUNNER_TEMP/vendor-stderr.log" || true)

            {
              echo "### :warning: \`pcapkit-vendor\` reported failing target(s) (exit $vendor_exit)"
              echo
              echo '```'
              if [ -n "$failed_targets" ]; then
                echo "$failed_targets"
              else
                echo '(no target name could be extracted from stderr; see the step log above)'
              fi
              echo '```'
              echo
              echo 'Const files from targets that exited zero are still isorted, tested, diffed, committed and pushed below -- only the failing target(s) above were left as they were.'
            } >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$failed_targets" ]; then
              while IFS= read -r line; do
                echo "::warning title=pcapkit-vendor target failed::${line}"
              done <<< "$failed_targets"
            else
              echo "::warning title=pcapkit-vendor exited $vendor_exit::see the step log above for which target(s) failed"
            fi
          fi

          # `find`, not a glob (#765): macOS's system bash has no globstar.
          # `-mindepth 2` skips `pcapkit/const/__init__.py`.
          find pcapkit/const -mindepth 2 -name '*.py' -exec isort -l100 -ppcapkit {} +

      # #1853: both gates in `head` judge the commit from before the crawl, so
      # 1.5.0b13 was committed with a test failing on it. The owner's ruling:
      # test it here under #872's rule -- a module the tests fail with goes
      # back to HEAD's copy, the rest are committed. util/vendor_test_gate.py's
      # docstring gives the rule.
      #
      # `continue-on-error`, so the tests never fail the job; if the step fails
      # or times out, the next one discards every regenerated module. `.[test]`
      # brings psutil, which samples a run's memory (#1894); `timeout-minutes`
      # backs up the script's budget. Serial pytest peaked at 0.7 GB resident
      # over tests/const, measured locally; files capped as in experimental.yml.
      - name: Test the regenerated tree
        id: vendor-tests
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -x

          python -m pip install -e '.[test]'
          python util/vendor_test_gate.py --budget-minutes 40 \
              --max-memory-mib 4096 --max-file-size-mib 2048 -- \
              python -m pytest -q -p no:cacheprovider tests/const tests/vendor

      # The tree is untested if the step above did not finish, so nothing from
      # this crawl is committed. Not a failure either (#872).
      - name: Discard untested const changes
        if: steps.vendor-tests.outcome != 'success'
        run: |
          git checkout HEAD -- pcapkit/const
          git clean -fdq -- pcapkit/const
          echo "::warning title=Vendor test gate did not finish::the regenerated tree could not be tested, so every regenerated module was discarded; see the step log"
          {
            echo '### :warning: Vendor test gate did not finish'
            echo
            echo 'The step that tests the regenerated tree failed or timed out, so nothing from this crawl is committed.'
          } >> "$GITHUB_STEP_SUMMARY"

      # #1968: `git status` in place of tj-actions/verify-changed-files@v17, so
      # no third-party code runs while the deploy key is loaded. Same outputs as
      # the action with no `files:` input: `files_changed`, and `changed_files`,
      # space-joined, written only when non-empty. Tracked changes count, staged
      # ones too; untracked files are listed one by one; ignored files never.
      # git C-quotes an unusual path, so the list is one line; a path with a
      # space still splits, and util/vendor_code_changed.py counts a name it
      # cannot read as code. Read through `env:`, so a path is never shell text.
      # cron-conda.yml runs the same script.
      - name: Verify Changed files
        id: verify-changed-files
        run: |
          listing="$(git -c core.quotepath=on status --porcelain --untracked-files=all --no-renames)"
          printf '%s\n' "$listing"
          changed="$(printf '%s\n' "$listing" | cut -c4- | LC_ALL=C sort -u | paste -sd ' ' -)"
          if [ -n "$changed" ]; then
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=$changed" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # #1674: only a code change cuts a beta. util/vendor_code_changed.py
      # writes `code_changed=false` for comment- and docstring-only changes;
      # anything else bumps, including this step failing, which leaves it unset.
      - name: Classify Changed files
        id: classify
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: python util/vendor_code_changed.py

      - name: Bump Version
        if: >-
          steps.verify-changed-files.outputs.files_changed == 'true' &&
          steps.classify.outputs.code_changed != 'false'
        run: |
          set -x

          python util/bump_version.py
          isort -l100 -ppcapkit --skip-glob '**/__init__.py' pcapkit
          find pcapkit/const -mindepth 2 -name '*.py' -exec isort -l100 -ppcapkit {} +
          find pcapkit/vendor -mindepth 2 -name '*.py' -exec isort -l100 -ppcapkit {} +

      - name: Commit changes
        id: commit
        if: >-
          steps.verify-changed-files.outputs.files_changed == 'true' &&
          steps.classify.outputs.code_changed != 'false'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # #1685: `-a` skips untracked files, so a new module is staged here;
          # left out, it would stay uncommitted and every later crawl would bump
          # for it again. Quoted, so git matches at any depth; `.py` only, so a
          # leftover backup stays out.
          git add -A -- 'pcapkit/const/*.py'
          git commit -am"Bumped version to $(python -c 'import pcapkit; print(pcapkit.__version__)')

          Updated vendor constant enumerations at $(date). The following files
          have been changed: $CHANGED_FILES"

      # #1674: the same commit without the bump; Create Release sees the same
      # version and publishes nothing. Its push raises this workflow again, and
      # a crawl changing comments once more on top of this commit is held for
      # the next push or schedule, so documentation commits cannot chain. The
      # verified commit is the payload's `head_commit` (octokit/webhooks'
      # workflow-run.schema.json). `-a` suffices: a new or deleted module is
      # code, so it takes the bump path (#1685).
      - name: Commit documentation changes
        id: commit-docs
        if: >-
          steps.verify-changed-files.outputs.files_changed == 'true' &&
          steps.classify.outputs.code_changed == 'false'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_AUTHOR: ${{ github.event.workflow_run.head_commit.author.email }}
          VERIFIED_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          bot="github-actions[bot]@users.noreply.github.com"
          subject="Updated vendor documentation without a version bump"

          verified_subject=$(printf '%s\n' "$VERIFIED_MESSAGE" | head -n 1)
          if [ "$EVENT_NAME" = workflow_run ] && [ "$VERIFIED_AUTHOR" = "$bot" ] &&
             [ "$verified_subject" = "$subject" ]; then
            echo "::notice title=Documentation changes held::this run was raised by the Unit Tests run for a documentation-only commit of this workflow, so the comments it changed again wait for the next push or schedule"
            exit 0
          fi

          git config --local user.email "$bot"
          git config --local user.name "github-actions[bot]"
          git commit -am"$subject

          Updated vendor constant enumerations at $(date). Only comments and
          docstrings changed, so the version stays at
          $(python -c 'import pcapkit; print(pcapkit.__version__)') (#1674). The
          following files have been changed: $CHANGED_FILES"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: >-
          github.event_name != 'workflow_dispatch' &&
          (steps.commit.outcome == 'success' || steps.commit-docs.outputs.committed == 'true')
        run: |
          git remote set-url origin git@github.com:JarryShaw/PyPCAPKit.git
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${GITHUB_REF}"

      # #2030: the run's outcome for the `discussion` job to post, read from the
      # crawl's log and the steps above, and `status=warning` where a target or
      # the test gate failed without failing the job. `continue-on-error` on
      # both, since a failure here would fail the run Create Release reads.
      - name: Write the run report
        id: run-report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CRAWL_STATUS: ${{ steps.crawl.outputs.status }}
          TESTS: ${{ steps.vendor-tests.outcome }}
          FILES_CHANGED: ${{ steps.verify-changed-files.outputs.files_changed }}
          COMMITTED: ${{ steps.commit.outcome == 'success' || steps.commit-docs.outputs.committed == 'true' }}
        run: |
          if [ "$CRAWL_STATUS" = 0 ] && [ "$TESTS" = success ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=warning" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### Vendor Update'
            echo
            if [ -z "$CRAWL_STATUS" ]; then
              echo '- Crawl: did not finish'
            elif [ "$CRAWL_STATUS" = 0 ]; then
              echo '- Crawl: every target succeeded'
            else
              echo "- Crawl: pcapkit-vendor exited $CRAWL_STATUS; these targets failed and kept their modules:"
              echo
              echo '```'
              grep -E '^[A-Za-z_][A-Za-z0-9_.]* failed: ' "$RUNNER_TEMP/vendor-stderr.log" ||
                echo '(no target name could be read from stderr)'
              echo '```'
              echo
            fi
            echo "- Test gate: ${TESTS:-not run}"
            if [ "$COMMITTED" = true ]; then
              echo "- Committed: $(git log -1 --format=%s)"
            elif [ "$FILES_CHANGED" = true ]; then
              echo '- Committed: nothing, though the crawl changed files'
            elif [ "$FILES_CHANGED" = false ]; then
              echo '- Committed: nothing, as nothing changed'
            else
              echo '- Committed: nothing, as the job stopped first'
            fi
          } > "$RUNNER_TEMP/vendor-report.md"
          cat "$RUNNER_TEMP/vendor-report.md"

      - name: Upload the run report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-report
          path: ${{ runner.temp }}/vendor-report.md
          retention-days: 14

  # #2030: posts `vendor-update`'s report, and a short one of its own where
  # `head` failed or was cancelled, since a failed gate skips `vendor-update`.
  # `always()`, so that skip does not skip this job, but no deliberate skip
  # runs it: where `vendor-update` skipped because the verdict did not cover
  # the commit or the run is a pull request's, so does this, and a run whose
  # every job skipped still concludes `skipped` for Create Release. Job-level
  # `continue-on-error` as well as the steps', so nothing here can fail the run
  # Create Release reads; util/discussion_report.py writes a warning instead.
  # Never on a manual run, which the thread would read as a real one.
  discussion:
    name: Post the vendor report
    needs: [ head, vendor-update ]
    if: >-
      ${{ always() && github.event_name != 'workflow_dispatch' && (needs.vendor-update.result != 'skipped' ||
      needs.head.result == 'failure' || needs.head.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A run that never wrote a report uploaded none; the script then warns.
      - name: Download the report
        if: needs.vendor-update.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendor-report
          path: report

      # A `workflow_run` follows a push to main, so it posts as a push run: only
      # when it warned or failed, and once more on the next green run. The
      # schedule posts every run. A green job that warned reports `warning`, and
      # a run whose gate stopped `vendor-update` reports the gate's result.
      - name: Post the report to Discussions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_run' && 'push' || 'scheduled' }}
          HEAD_RESULT: ${{ needs.head.result }}
          VENDOR_RESULT: ${{ needs.vendor-update.result }}
          VENDOR_STATUS: ${{ needs.vendor-update.outputs.status }}
        run: |
          if [ "$VENDOR_RESULT" = skipped ]; then
            status="$HEAD_RESULT"
            mkdir -p report
            {
              echo '### Vendor Update'
              echo
              echo "- Gate: $HEAD_RESULT, so vendor-update did not run and nothing was crawled or committed"
            } > report/vendor-report.md
          elif [ "$VENDOR_RESULT" = success ] && [ -n "$VENDOR_STATUS" ]; then
            status="$VENDOR_STATUS"
          else
            status="$VENDOR_RESULT"
          fi
          python3 util/discussion_report.py --category "$REPORT_CATEGORY" \
            --title 'cron-vendor: vendor constant update report' --report report/vendor-report.md \
            --mode "$MODE" --status "$status"
