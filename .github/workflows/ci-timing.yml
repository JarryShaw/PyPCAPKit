name: CI Timing

# The periodic CI-duration review (#1538). util/ci_timing.py reads the last
# week of runs through the API, writes a report to the job summary and an
# artifact, and fails when a HARD threshold fires (status 1; 2 and 3 are an
# unreadable API and a crash), which GitHub emails to whoever last edited the
# cron line. The `discussion` job then posts the report to this job's thread in
# the Discussions category REPORT_CATEGORY names (#2030); it alone holds a write
# scope, and a report it cannot post is a warning. The thresholds are in
# docs/source/contributing/workflows.rst, the response to one in
# conventions/process.rst.
#
# Not a `workflow_run` on Unit Tests: that adds a job per run to a runner pool
# already measured saturated.
on:
  schedule:
    # Mondays 07:23 UTC: off the hour, where GitHub delays scheduled runs most,
    # and clear of the Saturday crons (#1967) and Project Status at 00:37.
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Window in days.
        type: number
        default: 7
      concurrency_hours:
        description: Also measure the runner pool over this many hours, at one API call per run (0 = off).
        type: number
        default: 0

# GITHUB_TOKEN allows 1,000 API requests an hour per repository; a default run
# made 677 (#1930).
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-timing
  cancel-in-progress: false

# #2030: one Discussions category holds every report with no pull request to
# comment on, one thread per job.
env:
  REPORT_CATEGORY: CI reports

jobs:
  report:
    name: CI timing report
    runs-on: ubuntu-latest
    # Three nested limits, so a slow week ends in a smaller report rather than
    # none (#1930): the script stops reading jobs at --budget-minutes and writes
    # what it has; the step's cap sits far enough above it for an in-flight
    # request to finish its retries; this one leaves room for setup and uploads.
    # A full sample took 16.6 minutes for #1930, nearly all of it serial job
    # reads at up to 2.4 s each.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #1660: `latest` from .github/python-versions.toml.
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # lxml parses the JUnit artifacts (#1894).
      - name: Install requests and lxml
        run: python -m pip install requests lxml

      # The newest earlier run that uploaded a report, so a week whose run failed
      # on a HARD threshold is still next week's baseline. A first run, or one
      # after 90 days without a report, has none and says so.
      - name: Fetch the previous report as the baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          mkdir -p prev
          for id in $(gh run list -R "$REPO" --workflow ci-timing.yml --limit 10 --json databaseId -q '.[].databaseId'); do
            [ "$id" = "$RUN_ID" ] && continue
            if gh run download "$id" -R "$REPO" -n ci-timing-report -D prev 2>/dev/null; then
              echo "Baseline: run $id"
              exit 0
            fi
          done
          echo "::notice title=No baseline::No earlier ci-timing-report artifact was found, so the week-over-week checks are skipped."

      # Progress goes to the log as it happens, so a run stopped by a cap shows
      # how far it got.
      - name: Report CI timing
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || 7 }}
          CONCURRENCY_HOURS: ${{ inputs.concurrency_hours || 0 }}
        run: |
          python util/ci_timing.py --repo "$REPO" --days "$DAYS" \
            --concurrency-hours "$CONCURRENCY_HOURS" --baseline prev/report.json \
            --budget-minutes 30 --out report.json --summary report.md

      # `always()`, not `!cancelled()`, here and below: a report written before a
      # cap stopped the job is still worth having (#1930).
      - name: Add the report to the job summary
        if: ${{ always() }}
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # 90 days, so the trend is a series of weekly reports rather than one.
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timing-report
          path: |
            report.json
            report.md
          retention-days: 90

  # #2030: posts the report the `report` job uploaded, on `always()` like that
  # job's own upload, so a run failed by a HARD threshold or stopped by a cap
  # is posted too. util/discussion_report.py writes a warning rather than
  # failing; `continue-on-error` covers the rest.
  discussion:
    name: Post the CI timing report
    needs: [ report ]
    if: ${{ always() && needs.report.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      discussions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A run that never wrote a report uploaded none; the script then warns.
      - name: Download the report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-timing-report
          path: report

      - name: Post the report to Discussions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ needs.report.result }}
        # `scheduled` on dispatch too: a manual run is a deliberate report.
        run: |
          python3 util/discussion_report.py --category "$REPORT_CATEGORY" \
            --title 'ci-timing: weekly CI timing report' --report report/report.md \
            --mode scheduled --status "$STATUS"
