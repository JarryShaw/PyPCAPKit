name: CI Timing

# The periodic CI-duration review #1538 asked for. util/ci_timing.py reads the
# last week of Unit Tests, Compat, Lint, CodeQL, Pages and Experimental Tests
# runs through the API, writes a report to the job summary and to an artifact,
# and fails the run when a
# HARD threshold fires (status 1; 2 and 3 are an unreadable API and a crash, each
# annotated as such). GitHub emails a scheduled workflow's failures to whoever
# last edited its cron line, so the owner hears about it with no `issues: write`.
# docs/source/contributing/workflows.rst has the thresholds and why each sits
# where it does; conventions/process.rst has what to do when one fires.
#
# Deliberately not a `workflow_run` on Unit Tests: that would add a job per run
# to a runner pool already measured saturated at 20 concurrent jobs.
on:
  schedule:
    # Mondays 07:23 UTC: off the hour, where GitHub delays scheduled runs most,
    # and clear of Saturday's 02:00-10:00 crons and Project Status at 00:37.
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Window in days.
        type: number
        default: 7
      concurrency_hours:
        description: Also measure the runner pool over this many hours, at one API call per run (0 = off).
        type: number
        default: 0

# Read-only: the runs, jobs and artifacts need `actions: read`, the workflow
# files at each run's sha need `contents: read`. GITHUB_TOKEN allows 1,000 API
# requests an hour per repository; a default run made 677 (#1930).
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-timing
  cancel-in-progress: false

jobs:
  report:
    name: CI timing report
    runs-on: ubuntu-latest
    # Three nested limits, each under the next, so that a slow week ends in a
    # smaller report rather than none (#1930). The script stops reading jobs at
    # --budget-minutes and writes what it has. The step's cap is the backstop, and
    # sits far enough above to let a request already in flight finish its retries.
    # This one leaves room for the setup steps and the uploads after it. Measured
    # for #1930, a full sample took 16.6 minutes, nearly all of it job reads, which
    # the API answers at up to 2.4 s each and which are made one at a time.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # #1660: `latest` from .github/python-versions.toml, read with the
      # runner's own python3.
      - name: Read the Python versions
        id: python-versions
        run: python3 util/python_versions.py --github-output

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-versions.outputs.latest }}

      # The script fetches with requests and parses the JUnit artifacts with lxml
      # (#1894), and needs nothing else outside the standard library.
      - name: Install requests and lxml
        run: python -m pip install requests lxml

      # The newest earlier run that uploaded a report, so a week whose run failed
      # on a HARD threshold is still next week's baseline. A first run, or one
      # after 90 days without a report, has none and says so.
      - name: Fetch the previous report as the baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          mkdir -p prev
          for id in $(gh run list -R "$REPO" --workflow ci-timing.yml --limit 10 --json databaseId -q '.[].databaseId'); do
            [ "$id" = "$RUN_ID" ] && continue
            if gh run download "$id" -R "$REPO" -n ci-timing-report -D prev 2>/dev/null; then
              echo "Baseline: run $id"
              exit 0
            fi
          done
          echo "::notice title=No baseline::No earlier ci-timing-report artifact was found, so the week-over-week checks are skipped."

      # Progress goes to the log as it happens, so a run stopped by a cap shows
      # how far it got.
      - name: Report CI timing
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || 7 }}
          CONCURRENCY_HOURS: ${{ inputs.concurrency_hours || 0 }}
        run: |
          python util/ci_timing.py --repo "$REPO" --days "$DAYS" \
            --concurrency-hours "$CONCURRENCY_HOURS" --baseline prev/report.json \
            --budget-minutes 30 --out report.json --summary report.md

      # `always()`, not `!cancelled()`, here and below: a report written before a
      # cap stopped the job is still worth having (#1930), and with none written
      # there is nothing to add.
      - name: Add the report to the job summary
        if: ${{ always() }}
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # 90 days, so the trend is a series of weekly reports rather than one.
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-timing-report
          path: |
            report.json
            report.md
          retention-days: 90
