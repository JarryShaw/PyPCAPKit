# Coverage configuration for the one coverage-measured leg of unit-tests.yml
# (`test`, Python 3.14), passed with `--rcfile`. Coverage reads a single config
# file, so this repeats pyproject.toml's [tool.coverage.*] settings and adds the
# three below on top. tests/project/test_coverage_rcfile.py asserts every
# pyproject setting is repeated here unchanged.
#
#   parallel  -- each process writes its own .coverage.* file, merged afterwards
#                by `coverage combine`.
#   patch     -- "subprocess" (coverage 7.10+) starts measurement in every
#                child Python process. pytest-xdist's workers are such children
#                (execnet popen), so without it only the controller is measured
#                and the -n auto run reports next to nothing. "_exit" saves the
#                data before os._exit(), which skips atexit: execnet calls it on
#                a worker whose execution outlives shutdown, and pytest-timeout's
#                thread method on a hung test (#1387).
#   sigterm   -- installs a SIGTERM handler that saves the data. `patch =
#                ["_exit"]` covers os._exit and atexit covers a clean exit, but
#                nothing covered a signal, so a worker SIGTERMed during
#                shutdown would leave no file -- one candidate for #1423, whose
#                actual cause is not established. Does not help against
#                SIGKILL -- execnet's post-timeout kill is `Popen.kill()` --
#                which is why `tests/conftest.py` also saves at
#                `pytest_sessionfinish` rather than relying on this alone.
#   core      -- "ctrace", not the sys.monitoring default on 3.12+. Tests
#                purge and re-import pcapkit, and sysmon keeps state for every
#                generation's code objects: measured on test_http_unit.py
#                alone, re-importing per test, peak RSS 0.40 GiB without
#                coverage, 4.17 GiB under sysmon and 0.41 GiB under ctrace.
#                Under -n auto that growth killed the runner.

[tool.coverage.run]
source = [
    "pcapkit",
]
branch = true
parallel = true
patch = [
    "subprocess",
    "_exit",
]
sigterm = true
core = "ctrace"

[tool.coverage.report]
show_missing = true
