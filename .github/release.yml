# .github/release.yml
#
# Categories for GitHub's automatically generated release notes. These are live:
# `create-release.yml` asks for the generated notes with
# `generate_release_notes: true` and the action joins them after the release body,
# so on a normal release they follow the `CHANGELOG.md` entry, and on a
# pre-release or a `.postN` vendor refresh -- neither of which has a changelog
# entry of its own -- they are the whole of the notes.
#
# Categorisation keys on pull-request *labels*, and on nothing else. There is no
# matching on the `type(scope):` subject prefix this project actually uses, so
# the type a pull request announces in its title cannot reach this file.
#
# Merged pull requests carry a type label, set by hand, which is what makes a
# category per label possible -- an earlier survey of pull requests, mostly
# untyped, supported only a bare Dependencies/catch-all split. The order below
# was derived from a sample of merged pull requests (`gh pr list --state
# merged`), every one of which carried a type label, `fix` most often.
#
# GitHub files a pull request under the *first* category whose `labels` it
# matches, so category order is what resolves the pull requests that carry
# more than one type label. This order is derived from those overlaps, traced
# against the actual pull requests, not guessed:
#
#   * `breaking` is first, full stop. It co-occurs with `fix` (most often, at
#     times with `test` too), `feat`, `ci`+`release` (at times with `fix` too)
#     and `refactor` -- e.g. #25 "New distribution [0.14.0]" carries
#     breaking+ci+fix+release. Any other position buries a breaking change
#     under "Fixes" or "Release", which is the one mistake this file exists to
#     avoid.
#   * `release` is second. Its overlaps with `ci` and with `ci`+
#     `dependencies` are all old "New distribution [x]" pull requests
#     (#9, #11, #21, #22) -- a version bump that happens to also touch a
#     workflow file or a lockfile is still, in substance, a release. `release`
#     also wins its overlap with `fix` (#14, "New distribution [0.13.3]").
#   * `feat` and `fix` follow, in that order by convention: they never overlap
#     each other, so nothing in the data forces this half.
#     `refactor` comes next; in the sample its only overlap was with
#     `breaking`, above.
#   * `ci` beats `perf` (#727, subject `ci(unit-tests):`, labelled ci+perf),
#     `const` (#12 "Update Makefile", labelled ci+const) and `dependencies`
#     (#41 "Config file for pyup.io", labelled ci+dependencies) -- in each case
#     the pull request is a build/workflow change first and the second label
#     is incidental to it.
#   * `docs` beats `chore` (#637, subject `docs(github):`) and `test` (#703,
#     subject `docs(tests):`); `chore` in turn beats `test` (#697, subject
#     `chore(examples):`; also #340).
#   * `test` beats `const` (#15 "Update test branch", its only overlap, and a
#     weak one -- an old pull request with no `type(scope):` subject to check
#     against).
#   * `dependencies` sits second-to-last rather than first -- see below.
#
# `dependencies` ranks second-to-last, and its pull requests are almost all bot
# noise, from pyup and Dependabot. Ranking it low rather than first is a
# judgement call, not a data requirement: nothing in the overlaps above forces
# its position relative to anything except `release` and `ci`, both of which
# already rank ahead of it regardless of where it sits. The case for ranking it
# low: a future pull request that mixes a real change with a `dependencies`
# label (say, a fix prompted by a dependency bump) surfaces under that real
# category instead of being swallowed by bot noise -- which is also,
# concretely, what keeps #22 ("New distribution [0.13.3.post2]",
# ci+dependencies+release) filed under Release rather than Dependencies. The
# case for ranking it first: it keeps a high-volume, low-interest category out
# of the way of everything else on a first read. This file takes
# the former; flip its position in the list below if that judgement is wrong.
#
# `*` catches whatever matches none of the categories above -- nothing in the
# sample, since every pull request in it carried a type label, but it stays
# last regardless so an unlabelled future pull request still lands somewhere
# instead of silently vanishing from the notes.
#
# `review: pending` / `review: needs-changes` / `review: good-to-go` are
# cross-review process metadata, not a change type, and must never key a
# category here, and must never appear in `changelog.exclude.labels` (which
# would drop the whole pull request from every release's notes) or in a
# category's own `exclude.labels` (which would drop it from just that
# category). Either one applied to these labels would make every reviewed pull
# request vanish from the generated notes -- the opposite of the intent.
# Nothing enforces this except that no category below keys on them; this
# comment is what should stop a future maintainer from adding one that
# accidentally does.

changelog:
  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking
    - title: 🚀 Release
      labels:
        - release
    - title: ✨ Features
      labels:
        - feat
    - title: 🐛 Fixes
      labels:
        - fix
    - title: ♻️ Refactoring
      labels:
        - refactor
    - title: ⚙️ CI & Build
      labels:
        - ci
    - title: ⚡ Performance
      labels:
        - perf
    - title: 📝 Documentation
      labels:
        - docs
    - title: 🧹 Chores
      labels:
        - chore
    - title: 🧪 Tests
      labels:
        - test
    - title: 🔢 Constants
      labels:
        - const
    - title: 👒 Dependencies
      labels:
        - dependencies
    - title: 🏕 Changes
      labels:
        - '*'
