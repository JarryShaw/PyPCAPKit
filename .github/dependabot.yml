# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Dependabot replaces PyUp's update pull requests (#1968); `.pyup.yml` turns those off.
# Left out (#1968): conda/requirements.txt, which Conda Update's `Setup Conda
# Distribution` step writes, and the benchmark's image digests, which its
# Dockerfile takes from examples/benchmark/python-images.txt.
# The pip entry's `exclude-paths` keeps conda/requirements.txt out: the `/` job
# otherwise reads requirements files one directory down, conda/ included.
# Every entry's `target-branch` is `develop`, which carries the next minor
# (#2942); `main` is the released line.

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directories: # Location of package manifests; `directories` replaces `directory`
      - "/"
      - "/docs" # Pins Sphinx and sphinx-autodoc-typehints deliberately, bumps included
      - "/examples/benchmark" # Nothing else updates the benchmark's pins
    exclude-paths: # Matched against the path from the repository root
      - "conda/requirements.txt"
    schedule:
      interval: "weekly"
    target-branch: "develop"

  - package-ecosystem: "github-actions" # Every `uses:` under .github/workflows
    directory: "/" # Dependabot reads .github/workflows from the repository root
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups: # codeql-action now refuses to run unless every step in a workflow
      codeql-action: # (init, autobuild, analyze) is on the same version (#2384-#2386)
        patterns:
          - "github/codeql-action/*"
