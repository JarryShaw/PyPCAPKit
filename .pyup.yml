# pyup.io config file
# see https://pyup.io/docs/configuration/ for all available options
#
# Dependabot opens the dependency updates (#1968, see .github/dependabot.yml),
# so PyUp opens none. `update: False` is the global default every requirements file
# falls back to. No `requirements:` list is kept, because a file listed there takes
# its own `update`, which defaults to `all` and would override this. Deleting the
# file would not stop the bot either: without it, PyUp runs on its defaults.

update: False
