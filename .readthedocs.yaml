# Read the Docs build of the v0.15.1.post1 documentation (#3077). This file
# replaces the tag's .readthedocs.yml, which uses keys RTD has removed,
# and is the only change from the tag.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.8"
  jobs:
    pre_build:
      # no viewcode pages (#3077): edit conf.py in the checkout, then prove it
      - 'sed -i -e "s/.sphinx\.ext\.viewcode.[[:space:]]*,\{0,1\}//" -e "s/app\.connect(.viewcode-[a-z-]*.,[^)]*)/None/" doc/sphinx/source/conf.py'
      - '! grep -n -e "sphinx\.ext\.viewcode" -e "connect(.viewcode-" doc/sphinx/source/conf.py'
    install:
      - python -m pip install --upgrade --no-cache-dir pip setuptools
      - sed -e "/^-i[ =]/d" -e "/^--index-url[ =]/d" -e "/^--extra-index-url[ =]/d" -e "/^scapy==/d" doc/sphinx/requirements.txt > $READTHEDOCS_VIRTUALENV_PATH/requirements.txt
      - python -m pip install --exists-action=w --no-cache-dir --no-deps -r $READTHEDOCS_VIRTUALENV_PATH/requirements.txt

sphinx:
  configuration: doc/sphinx/source/conf.py
