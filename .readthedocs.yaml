# Read the Docs build of the v1.0.0b19 documentation (#3077). This file
# is the only change from the tag, and matches its own docs toolchain.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    pre_build:
      # no viewcode pages (#3077): edit conf.py in the checkout, then prove it
      - 'sed -i -e "s/.sphinx\.ext\.viewcode.[[:space:]]*,\{0,1\}//" -e "s/app\.connect(.viewcode-[a-z-]*.,[^)]*)/None/" docs/source/conf.py'
      - '! grep -n -e "sphinx\.ext\.viewcode" -e "connect(.viewcode-" docs/source/conf.py'

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - all
