# An excerpt of .github/workflows/unit-tests.yml at ffca64637, cut down to the
# keys util/ci_timing.py reads: job names, caps, needs and the one step cap.
name: Unit Tests

on:
  push:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    if: ${{ inputs.gate-only != true && needs.changes.outputs.code != 'false' }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        id: tests
        run: |
          set -- -q -n auto --dist load

  integration:
    name: Integration Python ${{ matrix.python-version }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run full test suite
        shell: bash
        run: echo

  unittest-ordering:
    name: Plain unittest ordering (${{ matrix.label || matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run tests/${{ matrix.leg }} and the root-level modules under plain unittest
        timeout-minutes: 20
        run: python util/run_unittest_leg.py ${{ matrix.leg }} ${{ matrix.exclude }} --verbose

  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify the diff
        run: echo

  project-tests:
    name: Project tests (docs-only)
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run tests/project and the root-level modules under plain unittest
        timeout-minutes: 15
        run: python util/run_unittest_leg.py project --verbose

  required-checks:
    name: Required checks passed
    needs: [changes, test, integration, project-tests]
    if: ${{ always() && inputs.gate-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every required job succeeded
        run: echo
