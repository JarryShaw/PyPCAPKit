{% set name = "pypcapkit" %}
{% set version = environ['PCAPKIT_VERSION'] %}
{% set build_number = environ['PCAPKIT_BUILD'] %}
{% set python = environ['PCAPKIT_PYTHON_VERSION'] %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ../..

# #3133: one package per release, for every platform and Python, carrying the
# core functionality alone. The run requirements are pyproject.toml's
# [project].dependencies that conda-forge has; build.sh vendors the rest into
# pcapkit/_extern. An optional feature is pip-installed into the environment.
build:
  number: {{ build_number }}
  noarch: python
  entry_points:
    - pcapkit-cli = pcapkit.__main__:main
    - pcapkit-vendor = pcapkit.vendor.__main__:main

requirements:
  # The Python that downloaded conda/wheels: pip refuses a wheel tagged for
  # another, and a noarch build otherwise resolves any Python.
  host:
    - python {{ python }}.*
    - pip
    - setuptools>=69.0.0
  # util/conda_vendor.py's CONDA_FORGE names these. A noarch package cannot
  # carry typing_extensions' python_version marker, so it is unconditional.
  run:
    - python >=3.8
    - aenum
    - chardet
    - typing_extensions

test:
  imports:
    - pcapkit
  commands:
    - pcapkit-cli --help
    # The vendored packages import from pcapkit/_extern, which pcapkit/__init__.py appends to sys.path.
    - python -c "import os, pcapkit, dictdumper, tbtrim; assert all(os.path.realpath(m.__file__).startswith(os.path.realpath(pcapkit._extern) + os.sep) for m in (dictdumper, tbtrim))"

about:
  home: https://jarryshaw.github.io/PyPCAPKit
  license: BSD 3-Clause License
  license_family: BSD
  license_file:
    - LICENSE
  summary: "PyPCAPKit: comprehensive network packet analysis library"
  doc_url: https://jarryshaw.github.io/PyPCAPKit
  dev_url: https://github.com/jarryshaw/pypcapkit

extra:
  recipe-maintainers:
    - jarryshaw
